<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statik- und Dynamik-Tool</title>
<style>
:root{
  --bg:#e8edf2; --panel:#f8fafc; --ink:#14202b; --muted:#5b6876; --line:#ccd5de; --grid:#d3dce5;
  --force:#c2185b; --react:#0f766e; --beam:#2f3e4e; --accent:#1d4f91; --warn:#b45309; --ok:#15803d; --tint:#dfe9f5; --shear:#1d4f91; --mom:#7c3aed; --norm:#b45309;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d151e; --panel:#152230; --ink:#e6edf4; --muted:#93a1b1; --line:#2a3b4d; --grid:#1d2c3b;
    --force:#ff6b95; --react:#4dd6c1; --beam:#a9bdd3; --accent:#7db4ff; --warn:#f5a524; --ok:#4ade80; --tint:#1c3350; --shear:#7db4ff; --mom:#b79cff; --norm:#f5a524;
  }
}
:root[data-theme="dark"]{
  --bg:#0d151e; --panel:#152230; --ink:#e6edf4; --muted:#93a1b1; --line:#2a3b4d; --grid:#1d2c3b;
  --force:#ff6b95; --react:#4dd6c1; --beam:#a9bdd3; --accent:#7db4ff; --warn:#f5a524; --ok:#4ade80; --tint:#1c3350; --shear:#7db4ff; --mom:#b79cff; --norm:#f5a524;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:20px;line-height:1.2;margin:4px 2px 2px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 2px 12px;color:var(--muted);font-size:13px}
h2{font-size:15px;margin:0 2px 8px;font-weight:700}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "table" "dia"}
.a-board{grid-area:board;min-width:0} .a-table{grid-area:table;min-width:0} .a-dia{grid-area:dia;min-width:0}
@media (min-width:900px){
  main{max-width:1120px}
  .layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"board table" "dia table";align-items:start}
}

/* Zeichnung */
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.gl{fill:none;stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--muted);stroke-width:1;fill:none}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.tick{fill:var(--muted);font:10px ui-monospace,Menlo,Consolas,monospace}
.beam{fill:var(--beam)}
.sup{fill:var(--panel);stroke:var(--beam);stroke-width:2}
.gnd{stroke:var(--beam);stroke-width:1.5}
.pivot{fill:var(--panel);stroke:var(--beam);stroke-width:2}
.fa{stroke:var(--force);fill:var(--force);stroke-width:2.6;stroke-linecap:round}
.ra{stroke:var(--react);fill:var(--react);stroke-width:2.6;stroke-linecap:round}
.la{stroke:var(--force);fill:var(--force);stroke-width:1.6;stroke-linecap:round}
.lg{stroke:var(--muted);fill:var(--muted);stroke-width:1.4;stroke-linecap:round}
.lb{fill:var(--force);opacity:.12}
.lbg{fill:var(--muted);opacity:.14}
.arcF{fill:none;stroke:var(--force);stroke-width:2.4;stroke-linecap:round}
.arcR{fill:none;stroke:var(--react);stroke-width:2.4;stroke-linecap:round}
.headF{fill:var(--force)} .headR{fill:var(--react)}
.lbl{font:600 11px ui-monospace,Menlo,Consolas,monospace;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.lbl.f{fill:var(--force)} .lbl.r{fill:var(--react)} .lbl.s{fill:var(--beam)} .lbl.a{fill:var(--accent)} .lbl.g{fill:var(--muted)}
.dot{fill:var(--force)}
.mk{stroke:var(--panel);stroke-width:1.5}
.mk.f{fill:var(--force)} .mk.a{fill:var(--accent)}
.mk.lock{fill:var(--panel);stroke:var(--muted);stroke-dasharray:2 2;stroke-width:1.5}
.hv{fill:var(--panel);stroke:var(--force);stroke-width:2}
.hv.lock{stroke:var(--muted);stroke-dasharray:3 2}
.hit{fill:transparent;pointer-events:all;cursor:grab}
.hint{margin:0;padding:7px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 10px 8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Schnittgrössen */
.dia{padding:8px 10px 10px}
.dia h2{margin:0 0 6px}
.dia svg{display:block;width:100%;height:auto;margin-bottom:4px}
.dl{stroke:var(--muted);stroke-width:1}
.dtitle{fill:var(--ink);font:600 11px ui-monospace,Menlo,Consolas,monospace}
.dval{font:600 10.5px ui-monospace,Menlo,Consolas,monospace;paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.dnote{margin:2px 0 0;font-size:12px;color:var(--muted)}

/* Tabelle */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.tpl{display:flex;gap:8px;margin-bottom:10px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;min-width:0}
.tpl select{flex:1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:0 4px 6px}
.tbl th.tc,.tbl td.tc{width:58px;text-align:center}
.tbl td{padding:3px 4px;vertical-align:middle;font-size:14px}
.tbl td.un{width:44px;color:var(--muted);font-size:12px}
.tbl td.vl{width:112px}
.tbl tr.grp td{padding-top:12px;border-top:1px solid var(--line)}
.tbl tr.grp:first-child td{border-top:0;padding-top:2px}
.tbl tr.sel td{background:var(--tint)}
.tbl tr.sel td:first-child{border-radius:7px 0 0 7px}
.tbl tr.sel td:last-child{border-radius:0 7px 7px 0}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}
.gh .gr{display:flex;gap:6px;align-items:center}
.gh select{font-size:13px;padding:5px 4px;font-weight:400}
.tbl sub{font-size:.75em}
.tbl input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;cursor:pointer;vertical-align:middle}
.tbl input[type=number]{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:15px ui-monospace,Menlo,Consolas,monospace}
.tbl input[type=number]:disabled{background:transparent;border-style:dashed;color:var(--react);font-weight:700;opacity:1;-webkit-text-fill-color:var(--react)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.x{padding:4px 10px;color:var(--muted)}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.adds .btn{padding:10px}
.status{margin:8px 2px 0;font-size:13px;color:var(--muted)}
.status b{color:var(--ink)}
.status .ok{color:var(--ok);font-weight:600} .status .warn{color:var(--warn);font-weight:600}
.msg{min-height:0;margin:4px 2px 0;font-size:13px;color:var(--warn)}
.small{font-size:12px;color:var(--muted);margin:10px 0 0}

/* Lösungsweg */
section{margin:14px 0}
.answer{font:700 17px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--react);padding:2px 0 10px;overflow-wrap:anywhere}
.answer sub{font-size:.7em}
.answer.err{color:var(--warn)}
.step{margin-top:12px}
.step h3{font-size:13px;margin:0 0 5px;font-weight:700;color:var(--accent)}
.eq{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:2px 0 2px 10px;border-left:2px solid var(--line);overflow-wrap:anywhere}
.eq.res{border-left-color:var(--react);font-weight:700}
.eq.dim{color:var(--muted)}
.eq sub{font-size:.75em}
.err{color:var(--warn);font-weight:600}

/* ---------- Tabs & Dynamik ---------- */
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#dsvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.ctl .btn{padding:8px 12px;min-width:44px}
.ctl label{display:flex;align-items:center;gap:6px;font-size:13px}
.ctl input[type=number]{width:76px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:14px ui-monospace,Menlo,Consolas,monospace}
.ctl input[type=range]{flex:1 1 130px;min-width:110px;accent-color:var(--accent)}
.rtbl{width:100%;border-collapse:collapse}
.rtbl td{padding:3px 4px;font-size:14px;vertical-align:baseline}
.rtbl td.v{text-align:right;font:600 14px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.rtbl td.u{color:var(--muted);font-size:12px;width:52px}
.rtbl tr.g td{padding-top:10px;font-weight:700;font-size:13px;border-top:1px solid var(--line)}
.rtbl tr.g:first-child td{border-top:0;padding-top:0}
.rtbl sub{font-size:.75em}
.rtbl tr.hl td.v{color:var(--react)}
.dpanel2{margin-top:12px}
.pt{stroke:var(--muted);stroke-width:1}
.tr{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trg{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;opacity:.7}
.bob{fill:var(--accent);stroke:var(--panel);stroke-width:2}
.bobg{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.rod{stroke:var(--beam);stroke-width:2.5;stroke-linecap:round}
.spr{fill:none;stroke:var(--beam);stroke-width:2.2;stroke-linejoin:round}
.slp{fill:var(--panel);stroke:var(--beam);stroke-width:2}
.blk{fill:var(--accent);stroke:var(--panel);stroke-width:1.5}
.cgrid{stroke:var(--grid);stroke-width:1}
.cax{stroke:var(--muted);stroke-width:1}
.ctitle{fill:var(--ink);font:600 11px ui-monospace,Menlo,Consolas,monospace}
.cleg{font:600 10.5px ui-monospace,Menlo,Consolas,monospace}
.cmark{stroke:var(--force);stroke-width:1.2;stroke-dasharray:3 3}
.dhint{margin:0;padding:7px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>Statik- und Dynamik-Tool</h1>
  <div class="tabs" role="group" aria-label="Ansicht">
    <button data-tab="static" aria-pressed="true">Statik</button>
    <button data-tab="dyn" aria-pressed="false">Dynamik</button>
  </div>
  <p class="sub" id="sub">Aufbau in der Tabelle eintragen, gesuchte Grössen ankreuzen, Lösungsweg und Schnittgrössen lesen.</p>

  <div id="viewStatic">
  <div class="layout">
    <div class="a-board">
      <div class="board">
        <svg id="svg" viewBox="0 0 360 300" role="img" aria-label="Balken mit Lagern und Lasten">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="gl" d="M20 0H0V20"/></pattern>
          </defs>
          <rect width="360" height="300" fill="url(#grid)"/>
          <g id="dyn"></g>
        </svg>
        <div class="legend">
          <span><i style="background:var(--force)"></i>Last</span>
          <span><i style="background:var(--react)"></i>Lagerkraft (berechnet)</span>
        </div>
        <p class="hint">Ziehen: Pfeilfuss, Pfeilende, Lager, Momente oder die Punkte auf der Achse unten.</p>
      </div>
    </div>
    <div class="a-table">
      <div class="panel" id="tablePanel"></div>
      <div class="status" id="status"></div>
      <p class="msg" id="msg" role="status"></p>
    </div>
    <div class="a-dia">
      <div class="board dia" id="dia"></div>
    </div>
  </div>

  <section>
    <h2>Lösungsweg</h2>
    <div class="panel" id="formulas"></div>
  </section>
  </div>

  <div id="viewDyn" hidden>
  <div class="layout">
    <div class="a-board">
      <div class="board">
        <svg id="dsvg" viewBox="0 0 360 300" role="img" aria-label="Simulation">
          <rect width="360" height="300" fill="url(#grid)"/>
          <g id="ddyn"></g>
        </svg>
        <div class="ctl">
          <button class="btn pri" id="dplay" aria-label="Abspielen">▶ Abspielen</button>
          <button class="btn" id="dreset" aria-label="Zurück zu t">↺</button>
          <label>Zeit t <input type="number" id="dt" min="0" max="120" step="0.1" inputmode="decimal"> <span id="dtu">s</span></label>
          <label>Tempo <select id="dspeed" aria-label="Abspieltempo"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
          <input type="range" id="dslider" min="0" max="30" step="0.05" aria-label="Zeit">
        </div>
        <p class="dhint" id="dhint"></p>
      </div>
    </div>
    <div class="a-table">
      <div class="panel" id="dparams"></div>
      <div class="panel dpanel2" id="dres"></div>
    </div>
    <div class="a-dia">
      <div class="board dia" id="dcharts"></div>
    </div>
  </div>
  <section>
    <h2>Lösungsweg</h2>
    <div class="panel" id="dpath"></div>
  </section>
</div>

</main>

<script>
(function(){
'use strict';
var X0=30, W=300, BYC=150, AXY=268, D2R=Math.PI/180;
var S={L:4, theta:0, w:0, supports:[], forces:[], moments:[], loads:[], unk:{}, nid:1, sol:null};
var lay={};
function $(s){return document.querySelector(s);}
var svg=$('#svg'), dyn=$('#dyn');

/* ---------- Hilfsfunktionen ---------- */
function rz(v){return Math.round(v*1e9)/1e9;}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function norm(a){return ((a+180)%360+360)%360-180;}
function fmt(v,d){
  if(d===undefined)d=2;
  v=rz(v);
  var s=v.toFixed(d);
  if(s.indexOf('.')>=0) s=s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0'||s==='') s='0';
  return s.replace('.',',').replace('-','−');
}
function pn(v,d){return rz(v)<0?'('+fmt(v,d)+')':fmt(v,d);}
function letter(i){return String.fromCharCode(65+i);}
function byId(arr,id){for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null;}
function geo(){var t=S.theta*D2R; return {c:rz(Math.cos(t)), s:rz(Math.sin(t))};}
var TYPENAME={pin:'Festlager',roller:'Loslager',fixed:'Einspannung'};

/* ---------- Schlüssel (Zugriff auf alle Grössen) ---------- */
var SUPP={s:'s',x:'rx',y:'ry',R:'rn',m:'rm',ang:'ang'};
function refKey(key){
  var p=key.split(':');
  if(p.length===1) return {o:S,p:p[0]};
  var o=null, prop=p[2];
  if(p[0]==='f') o=byId(S.forces,+p[1]);
  else if(p[0]==='m') o=byId(S.moments,+p[1]);
  else if(p[0]==='l') o=byId(S.loads,+p[1]);
  else if(p[0]==='sup'){o=byId(S.supports,+p[1]); prop=SUPP[p[2]];}
  return o?{o:o,p:prop}:null;
}
function getV(k){var r=refKey(k); return r?r.o[r.p]:undefined;}
function setV(k,v){var r=refKey(k); if(r) r.o[r.p]=v;}
function isReactionKey(k){return /^sup:\d+:(x|y|R|m)$/.test(k);}
function isAngleKey(k){return /^f:\d+:a$/.test(k);}
function isPosKey(k){return /^(f|m|sup):\d+:s$/.test(k);}
function reactionKeys(){
  var o=[];
  S.supports.forEach(function(sp){
    var b='sup:'+sp.id+':';
    if(sp.type==='roller') o.push(b+'R');
    else {o.push(b+'x',b+'y'); if(sp.type==='fixed') o.push(b+'m');}
  });
  return o;
}
function tickKeys(){
  var o=['w'];
  S.supports.forEach(function(sp){
    var b='sup:'+sp.id+':';
    o.push(b+'s');
    if(sp.type==='roller') o.push(b+'R'); else {o.push(b+'x',b+'y'); if(sp.type==='fixed') o.push(b+'m');}
  });
  S.forces.forEach(function(f){o.push('f:'+f.id+':s','f:'+f.id+':F','f:'+f.id+':a');});
  S.moments.forEach(function(m){o.push('m:'+m.id+':s','m:'+m.id+':M');});
  S.loads.forEach(function(l){o.push('l:'+l.id+':q1','l:'+l.id+':q2');});
  return o;
}
function unkList(){return tickKeys().filter(function(k){return S.unk[k];});}
function cleanUnk(){
  var valid={}; tickKeys().forEach(function(k){valid[k]=1;});
  Object.keys(S.unk).forEach(function(k){if(!valid[k]) delete S.unk[k];});
}
function unitOf(k){
  if(k==='L') return 'm';
  if(k==='theta') return '°';
  if(k==='w') return 'N/m';
  var p=k.split(':'), t=p[2];
  if(t==='s'||t==='s1'||t==='s2') return 'm';
  if(t==='x'||t==='y'||t==='R'||t==='F') return 'N';
  if(t==='m'||t==='M') return 'N·m';
  if(t==='a'||t==='ang') return '°';
  if(t==='q1'||t==='q2') return 'N/m';
  return '';
}
function symOf(k){
  if(k==='w') return 'w';
  var p=k.split(':'), o, n;
  if(p[0]==='sup'){
    o=byId(S.supports,+p[1]); if(!o) return k;
    var L=letter(S.supports.indexOf(o));
    if(p[2]==='s') return 's<sub>'+L+'</sub>';
    if(p[2]==='R') return L;
    if(p[2]==='x') return L+'<sub>x</sub>';
    if(p[2]==='y') return L+'<sub>y</sub>';
    if(p[2]==='m') return 'M<sub>'+L+'</sub>';
  } else if(p[0]==='f'){
    o=byId(S.forces,+p[1]); if(!o) return k; n=S.forces.indexOf(o)+1;
    return p[2]==='F'?'F<sub>'+n+'</sub>':(p[2]==='s'?'s<sub>F'+n+'</sub>':'α<sub>'+n+'</sub>');
  } else if(p[0]==='m'){
    o=byId(S.moments,+p[1]); if(!o) return k; n=S.moments.indexOf(o)+1;
    return p[2]==='M'?'M<sub>'+n+'</sub>':'s<sub>M'+n+'</sub>';
  } else if(p[0]==='l'){
    o=byId(S.loads,+p[1]); if(!o) return k; n=S.loads.indexOf(o)+1;
    return p[2]==='q1'?'q<sub>'+n+'a</sub>':'q<sub>'+n+'e</sub>';
  }
  return k;
}

/* ---------- Ersatzlasten (Quellen) ---------- */
function loadsAll(){
  var a=S.loads.map(function(l,i){return {ref:l,name:'Q'+(i+1),s1:l.s1,s2:l.s2,q1:l.q1,q2:l.q2,key:'l:'+l.id};});
  if(S.w!==0||S.unk.w) a.push({ref:null,name:'G',s1:0,s2:S.L,q1:S.w,q2:S.w,key:'w',auto:true});
  return a;
}
function loadInfo(l){
  var len=l.s2-l.s1, k=len!==0?(l.q2-l.q1)/len:0;
  var R=len*(l.q1+l.q2)/2;
  var I=l.q1*l.s1*len+l.q1*len*len/2+k*l.s1*len*len/2+k*len*len*len/3;
  return {R:R,I:I,len:len,k:k};
}
function sources(){
  var g=geo(), out=[];
  S.forces.forEach(function(f,i){
    var r=f.a*D2R;
    out.push({kind:'F',name:'F'+(i+1),key:'f:'+f.id,s:f.s,x:f.s*g.c,y:f.s*g.s,fx:f.F*Math.cos(r),fy:f.F*Math.sin(r),m:0,ref:f});
  });
  S.moments.forEach(function(m,i){
    out.push({kind:'M',name:'M'+(i+1),key:'m:'+m.id,s:m.s,x:m.s*g.c,y:m.s*g.s,fx:0,fy:0,m:m.M,ref:m});
  });
  loadsAll().forEach(function(l){

  });
  S.supports.forEach(function(sp,i){
    var nm=letter(i), x=sp.s*g.c, y=sp.s*g.s;
    if(sp.type==='roller'){
      var r=sp.ang*D2R;
      out.push({kind:'S',name:nm,key:'sup:'+sp.id,s:sp.s,x:x,y:y,fx:sp.rn*Math.cos(r),fy:sp.rn*Math.sin(r),m:0,ref:sp});
    } else {
      out.push({kind:'S',name:nm,key:'sup:'+sp.id,s:sp.s,x:x,y:y,fx:sp.rx,fy:sp.ry,m:sp.type==='fixed'?sp.rm:0,ref:sp});

function contrib(src,k,P){
  if(k===0) return src.fx;
  if(k===1) return src.fy;
  return src.m+(src.x-P.x)*src.fy-(src.y-P.y)*src.fx;

function sumK(k,P){
  var s=0; sources().forEach(function(q){s+=contrib(q,k,P);});
  return s;
}
function pickRef(){
  var g=geo();
  var posUnknown=S.supports.some(function(sp){return S.unk['sup:'+sp.id+':s'];});
  if(!posUnknown){
    var sp=null;
    S.supports.forEach(function(q){if(!sp&&q.type!=='roller') sp=q;});
    if(!sp) sp=S.supports[0];
    if(sp) return {x:sp.s*g.c,y:sp.s*g.s,label:letter(S.supports.indexOf(sp))};
  }
  return {x:0,y:0,label:'O'};

/* ---------- Gleichungslöser ---------- */
function snapshot(){return JSON.stringify({sp:S.supports,f:S.forces,m:S.moments,l:S.loads,w:S.w});}
function restore(js){var o=JSON.parse(js); S.supports=o.sp;S.forces=o.f;S.moments=o.m;S.loads=o.l;S.w=o.w;}
function dependsOn(k,u,P){
  var v0=getV(u), d=isAngleKey(u)?23:0.7;
  var g0=sumK(k,P); setV(u,v0+d); var g1=sumK(k,P); setV(u,v0);
  return Math.abs(g1-g0)>1e-9*(1+Math.abs(g0));
}
function contribList(k,u,P){
  var v0=getV(u), out=[];
  setV(u,0);
  sources().forEach(function(s){var v=contrib(s,k,P); if(Math.abs(v)>1e-9) out.push({name:s.name,v:v});});
  setV(u,v0);
  return out;
}
function solve1(k,u,P,scale){
  var info={k:k,u:u}, v0=getV(u);
  var gk=function(){return sumK(k,P);};
  if(isAngleKey(u)){
    setV(u,0); var g0=gk(); setV(u,90); var g90=gk(); setV(u,180); var g180=gk(); setV(u,v0);
    var D=(g0+g180)/2, A=(g0-g180)/2, B=g90-D, R=Math.sqrt(A*A+B*B);
    info.type='ang'; info.A=A; info.B=B; info.D=D; info.R=R;
    if(R<1e-9){info.err='Der Winkel hat auf diese Gleichung keinen Einfluss (Hebelarm 0 oder Kraft 0).';return info;}
    var ca=-D/R;
    if(Math.abs(ca)>1+1e-9){info.err='Keine Lösung für den Winkel: Die Kraft ist zu klein oder der Hebelarm zu kurz.';return info;}
    var phi=Math.atan2(B,A)/D2R, del=Math.acos(clamp(ca,-1,1))/D2R;
    var a1=norm(phi+del), a2=norm(phi-del);
    var pick=Math.abs(norm(a1-v0))<=Math.abs(norm(a2-v0))?a1:a2;
    info.phi=phi; info.a1=a1; info.a2=a2; info.val=rz(pick);
    setV(u,info.val);
    return info;
  }
  info.contrib=contribList(k,u,P);
  setV(u,0); var d0=gk(); setV(u,1); var d1=gk(); setV(u,2); var d2=gk(); setV(u,v0);
  var c=d1-d0;
  info.c=c; info.d=d0;
  var affine=Math.abs(d2-2*d1+d0)<=1e-7*(1+Math.abs(d0)+Math.abs(d1));
  if(affine){
    info.type='lin';
    if(Math.abs(c)<1e-9){info.err='Die gesuchte Grösse hat in dieser Gleichung keinen Einfluss (Koeffizient 0). Ursache: Hebelarm 0 oder Lagerrichtung passt nicht.';return info;}
    var val=-d0/c; info.raw=val;
    if(/:F$/.test(u) && val<0){
      info.flip=true; info.val=rz(-val); setV(u,info.val);
      var ak=u.replace(/:F$/,':a'); setV(ak,rz(norm(getV(ak)+180)));
    } else {info.val=rz(val); setV(u,info.val);}
    return info;
  }
  info.type='newton1';
  var x=v0, ok=false;
  for(var it=0;it<60;it++){
    setV(u,x); var g=gk();
    if(Math.abs(g)<1e-10*(1+scale)){ok=true;break;}
    var h=1e-6*(1+Math.abs(x)); setV(u,x+h); var gp=(gk()-g)/h;
    if(!isFinite(gp)||Math.abs(gp)<1e-12) break;
    x=x-g/gp;
  }
  if(!ok){setV(u,v0); info.err='Die nichtlineare Gleichung konnte nicht gelöst werden.'; return info;}
  info.val=rz(x); setV(u,info.val);
  return info;
}
function gauss(A,b){
  var n=b.length, i, j, k;
  for(i=0;i<n;i++){
    var piv=i;
    for(j=i+1;j<n;j++) if(Math.abs(A[j][i])>Math.abs(A[piv][i])) piv=j;
    if(Math.abs(A[piv][i])<1e-14) return null;
    var t=A[i];A[i]=A[piv];A[piv]=t; var tb=b[i];b[i]=b[piv];b[piv]=tb;
    for(j=i+1;j<n;j++){
      var f=A[j][i]/A[i][i];
      for(k=i;k<n;k++) A[j][k]-=f*A[i][k];
      b[j]-=f*b[i];
    }
  }
  var x=new Array(n);
  for(i=n-1;i>=0;i--){
    var s=b[i];
    for(j=i+1;j<n;j++) s-=A[i][j]*x[j];
    x[i]=s/A[i][i];
  }
  return x;
}
function newtonSys(keys,eqs,P,scale){
  var n=keys.length, iters=0;
  for(var it=0;it<80;it++){
    iters=it;
    var g=eqs.map(function(k){return sumK(k,P);});
    var nrm=0; g.forEach(function(v){nrm+=v*v;}); nrm=Math.sqrt(nrm);
    if(nrm<1e-10*(1+scale)) return {ok:true,iters:iters};
    var J=[], i, j;
    for(i=0;i<n;i++) J.push(new Array(n));
    for(j=0;j<n;j++){
      var v0=getV(keys[j]), h=1e-6*(1+Math.abs(v0));
      setV(keys[j],v0+h);
      for(i=0;i<n;i++) J[i][j]=(sumK(eqs[i],P)-g[i])/h;
      setV(keys[j],v0);
    }
    var dx=gauss(J,g.map(function(v){return -v;}));
    if(!dx) return {ok:false};
    var base=keys.map(getV), step=1, improved=false;
    for(var ls=0;ls<12;ls++){
      for(j=0;j<n;j++) setV(keys[j],base[j]+step*dx[j]);
      var g2=eqs.map(function(k){return sumK(k,P);}), n2=0;
      g2.forEach(function(v){n2+=v*v;}); n2=Math.sqrt(n2);
      if(n2<nrm){improved=true;break;}
      step/=2;
    }
    if(!improved){for(j=0;j<n;j++) setV(keys[j],base[j]); return {ok:false};}
  }
  return {ok:false};
}
function solve(){
  var keys=unkList();
  var sol={ok:true,steps:[],keys:keys,err:null,warn:[],n:keys.length};
  var P=pickRef(); sol.P=P;
  var snap=snapshot();
  var scale=1;
  sources().forEach(function(s){scale=Math.max(scale,Math.abs(s.fx),Math.abs(s.fy),Math.abs(s.m));});
  var unresolved=keys.slice(), used=[false,false,false], order=[2,0,1], guard=0;
  var fail=function(msg){sol.ok=false; sol.err=msg; restore(snap);};
  var failGeneric=function(){
    if(keys.length>3) fail('Statisch unbestimmt: '+keys.length+' Unbekannte, aber nur 3 Gleichgewichtsbedingungen. Entferne ein Häkchen und gib den Wert vor.');
    else fail('Nicht lösbar: Die Gleichungen bestimmen die Unbekannten nicht eindeutig (Aufbau verschieblich oder ein Hebelarm ist 0).');
  };
  while(unresolved.length && guard++<12){
    var done=false;
    for(var oi=0;oi<3&&!done;oi++){
      var k=order[oi]; if(used[k]) continue;
      var dep=unresolved.filter(function(u){return dependsOn(k,u,P);});
      if(dep.length===1){
        var st=solve1(k,dep[0],P,scale);
        if(st.err){fail(st.err); return sol;}
        sol.steps.push(st); used[k]=true;
        unresolved.splice(unresolved.indexOf(dep[0]),1);
        done=true;
      }
    }
    if(done) continue;
    var avail=[0,1,2].filter(function(k){
      return !used[k] && unresolved.some(function(u){return dependsOn(k,u,P);});
    });
    if(avail.length<unresolved.length){failGeneric(); return sol;}
    var eqs=avail.slice(0,unresolved.length);
    var nr=newtonSys(unresolved,eqs,P,scale);
    if(!nr.ok){fail('Die gekoppelten Gleichungen konnten nicht gelöst werden. Ändere die Startwerte oder wähle andere Unbekannte.'); return sol;}
    sol.steps.push({type:'coupled',keys:unresolved.slice(),eqs:eqs,iters:nr.iters});
    eqs.forEach(function(k){used[k]=true;});
    unresolved=[];
  }
  if(unresolved.length){failGeneric(); return sol;}
  sol.used=used;
  sol.resid=[rz(sumK(0,P)),rz(sumK(1,P)),rz(sumK(2,P))];
  var tol=1e-7*scale+1e-9;
  sol.unbalanced=false;
  for(var q=0;q<3;q++) if(Math.abs(sol.resid[q])>tol) sol.unbalanced=true;
  keys.forEach(function(k){
    if(isPosKey(k)){
      var v=getV(k);
      if(v<-1e-9||v>S.L+1e-9) sol.warn.push(symOf(k)+' = '+fmt(v)+' m liegt ausserhalb des Balkens (0 bis '+fmt(S.L)+' m).');
    }
  });
  return sol;
}

/* ---------- Auswahl "gesucht" ---------- */
function unkCount(){return unkList().length;}
function autoBalance(just){
  var guard=0;
  while(guard++<12){
    var n=unkCount(), rk;
    if(n>3){
      rk=reactionKeys().filter(function(k){return S.unk[k]&&k!==just;});
      if(!rk.length) break;
      delete S.unk[rk[rk.length-1]];
    } else if(n<3){
      rk=reactionKeys().filter(function(k){return !S.unk[k]&&k!==just;});
      if(!rk.length) break;
      S.unk[rk[0]]=true;
    } else break;
  }
}

/* ---------- Schnittgrössen ---------- */
function internalForces(){
  var g=geo(), src=sources(), eps=1e-6, n=240, i;
  var cuts=[];
  for(i=0;i<=n;i++) cuts.push(S.L*i/n);
  src.forEach(function(s){ if(s.kind!=='Q') cuts.push(clamp(s.s-eps,0,S.L),clamp(s.s+eps,0,S.L)); });
  loadsAll().forEach(function(l){cuts.push(clamp(l.s1,0,S.L),clamp(l.s2,0,S.L));});
  cuts.push(S.L+eps);
  cuts.sort(function(a,b){return a-b;});
  var xs=[],N=[],V=[],M=[];
  cuts.forEach(function(sc){
    var Fx=0,Fy=0,Mc=0,Ma=0;
    src.forEach(function(s){
      if(s.kind==='Q'){
        var l=s.load, len=l.s2-l.s1; if(len<=0) return;
        var k=(l.q2-l.q1)/len, c=clamp(sc-l.s1,0,len);
        var R=l.q1*c+k*c*c/2, I1=l.q1*c*c/2+k*c*c*c/3;
        Fy+=-R; Mc+=g.c*((sc-l.s1)*R-I1);
      } else if(s.s<sc-1e-12){
        Fx+=s.fx; Fy+=s.fy;
        var dx=(s.s-sc)*g.c, dy=(s.s-sc)*g.s;
        Mc+=dx*s.fy-dy*s.fx; Ma+=s.m;
      }
    });
    xs.push(clamp(sc,0,S.L));
    N.push(rz(-(Fx*g.c+Fy*g.s)));
    V.push(rz(-Fx*g.s+Fy*g.c));
    M.push(rz(-(Mc+Ma)));
  });
  return {xs:xs,N:N,V:V,M:M};
}

/* ---------- Zeichnung ---------- */
function layout(){
  var g=geo(), Lx=S.L*g.c, Ly=S.L*g.s;
  var xmin=Math.min(0,Lx), xmax=Math.max(0,Lx), ymin=Math.min(0,Ly), ymax=Math.max(0,Ly);
  var wx=xmax-xmin, wy=ymax-ymin;
  var u=Math.min(wx>1e-6?W/wx:1e9, wy>1e-6?120/wy:1e9);
  lay={u:u,xmin:xmin,ymid:(ymin+ymax)/2,ox:X0+(W-wx*u)/2,c:g.c,s:g.s};
}
function P(s){return {x:lay.ox+(s*lay.c-lay.xmin)*lay.u, y:BYC-(s*lay.s-lay.ymid)*lay.u};}
function arrow(x1,y1,x2,y2,cls,size){
  size=size||9;
  var a=Math.atan2(y2-y1,x2-x1);
  var bx=x2-Math.cos(a)*size, by=y2-Math.sin(a)*size;
  var nx=-Math.sin(a)*size*0.45, ny=Math.cos(a)*size*0.45;
  return '<line class="'+cls+'" x1="'+x1+'" y1="'+y1+'" x2="'+bx+'" y2="'+by+'"/>'+
         '<polygon class="'+cls+'" points="'+x2+','+y2+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny)+'"/>';
}
function label(x,y,t,cls){
  x=clamp(x,16,344); y=clamp(y,12,296);
  return '<text class="lbl '+cls+'" x="'+x+'" y="'+y+'" text-anchor="middle">'+t+'</text>';
}
function ground(cx,y,w){
  var s='<line class="gnd" x1="'+(cx-w)+'" y1="'+y+'" x2="'+(cx+w)+'" y2="'+y+'"/>';
  for(var x=cx-w;x<=cx+w-5;x+=6) s+='<line class="gnd" x1="'+(x+6)+'" y1="'+y+'" x2="'+x+'" y2="'+(y+6)+'"/>';
  return s;
}
function handle(cx,cy,key,lock,ax){
  if(lock) return '<circle class="hv lock" cx="'+cx+'" cy="'+cy+'" r="6"/>';
  return '<circle class="hv" cx="'+cx+'" cy="'+cy+'" r="6" pointer-events="none"/>'+
         '<circle class="hit" data-drag="'+key+'"'+(ax?' data-ax="1"':'')+' cx="'+cx+'" cy="'+cy+'" r="16"/>';
}
function arcArrow(cx,cy,r,ccw,col){
  function pt(phi){return [cx+r*Math.cos(phi*D2R), cy-r*Math.sin(phi*D2R)];}
  var a0=ccw?-30:210, a1=ccw?240:-60, p0=pt(a0), p1=pt(a1);
  var s='<path class="arc'+col+'" d="M'+p0[0]+','+p0[1]+' A'+r+','+r+' 0 1 '+(ccw?0:1)+' '+p1[0]+','+p1[1]+'"/>';
  var ph=a1*D2R, tx=ccw?-Math.sin(ph):Math.sin(ph), ty=ccw?-Math.cos(ph):Math.cos(ph);
  var tipx=p1[0]+tx*4, tipy=p1[1]+ty*4, bx=tipx-tx*8, by=tipy-ty*8, nx=-ty*3.6, ny=tx*3.6;
  s+='<polygon class="head'+col+'" points="'+tipx+','+tipy+' '+(bx+nx)+','+(by+ny)+' '+(bx-nx)+','+(by-ny)+'"/>';
  return s;
}
function supportSvg(sp,i){
  var p=P(sp.s), nm=letter(i), h='', x=p.x, y=p.y, g=geo();
  if(sp.type==='pin'){
    h+='<polygon class="sup" points="'+x+','+(y+4)+' '+(x-13)+','+(y+24)+' '+(x+13)+','+(y+24)+'"/>'+ground(x,y+24,17);
    h+=label(x,y+50,nm,'s');
  } else if(sp.type==='roller'){
    var rot=90-sp.ang;
    h+='<g transform="translate('+x+' '+y+') rotate('+rot+')">'+
       '<polygon class="sup" points="0,4 -10,20 10,20"/>'+
       '<circle class="sup" cx="-5" cy="24" r="3.5"/><circle class="sup" cx="5" cy="24" r="3.5"/>'+
       ground(0,28,17)+'</g>';
    var nx=Math.cos(sp.ang*D2R), ny=-Math.sin(sp.ang*D2R);
    h+=label(x-nx*50,y-ny*50+4,nm,'s');
  } else {
    var side=sp.s<=S.L/2?-1:1;

       '<rect class="sup" x="-4" y="-28" width="8" height="56"/>';
    for(var yy=-28;yy<28;yy+=7) h+='<line class="gnd" x1="'+(side*4)+'" y1="'+(yy+7)+'" x2="'+(side*11)+'" y2="'+yy+'"/>';
    h+='</g>';

}
function drawSvg(){
  layout();
  var sol=S.sol, ok=sol&&sol.ok, h='', i;
  var p0=P(0), g=geo();
  // Achse (Länge s entlang des Balkens)
  h+='<line class="axis" x1="'+X0+'" y1="'+AXY+'" x2="'+(X0+W)+'" y2="'+AXY+'"/>';
  var steps=[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000], st=1000;
  for(i=0;i<steps.length;i++){ if(S.L/steps[i]<=10){st=steps[i];break;} }
  for(i=0;i*st<=S.L+1e-9;i++){
    var t=i*st, tx=X0+t*W/S.L;
    h+='<line class="axis" x1="'+tx+'" y1="'+AXY+'" x2="'+tx+'" y2="'+(AXY+5)+'"/>'+
       '<text class="tick" x="'+tx+'" y="'+(AXY+17)+'" text-anchor="middle">'+fmt(t)+'</text>';
  }
  h+='<text class="tick" x="'+(X0+W)+'" y="'+(AXY+30)+'" text-anchor="end">s in m (entlang des Balkens)</text>';

  // Marker auf der Achse
  var marks=[];
  S.forces.forEach(function(f,n){marks.push({s:f.s,key:'f:'+f.id+':s',name:'F'+(n+1),cls:'f'});});
  S.moments.forEach(function(m,n){marks.push({s:m.s,key:'m:'+m.id+':s',name:'M'+(n+1),cls:'f'});});
  S.supports.forEach(function(sp,n){marks.push({s:sp.s,key:'sup:'+sp.id+':s',name:letter(n),cls:'a'});});
  marks.forEach(function(m){m.lock=!!S.unk[m.key]; m.px=X0+m.s*W/S.L;});
  marks.sort(function(a,b){return a.px-b.px;});
  var lane=0, prev=-1e9;
  marks.forEach(function(m){
    lane=(m.px-prev<26)?(lane+1)%3:0; prev=m.px; m.lane=lane;
    if(Math.abs(S.theta)<0.5) h+='<line class="guide" x1="'+m.px+'" y1="'+AXY+'" x2="'+m.px+'" y2="'+P(m.s).y+'"/>';
  });

  // Skala für Pfeile
  var mags=[1e-9];
  S.forces.forEach(function(f){mags.push(Math.abs(f.F));});
  if(ok) S.supports.forEach(function(sp){mags.push(Math.abs(sp.rx),Math.abs(sp.ry),Math.abs(sp.rn));});
  var k=80/Math.max.apply(null,mags);

  // Lager
  S.supports.forEach(function(sp,n){h+=supportSvg(sp,n);});

  // Balken
  h+='<g transform="translate('+p0.x+' '+p0.y+') rotate('+(-S.theta)+')"><rect class="beam" x="0" y="-4" width="'+(S.L*lay.u)+'" height="8" rx="2"/></g>';

  // Streckenlasten
  var qmax=1e-9;
  loadsAll().forEach(function(l){qmax=Math.max(qmax,Math.abs(l.q1),Math.abs(l.q2));});
  loadsAll().forEach(function(l){
    if(l.s2<=l.s1+1e-9) return;
    var cls=l.auto?'lg':'la', fcls=l.auto?'lbg':'lb';
    var cnt=Math.max(2,Math.round((l.s2-l.s1)/S.L*14)), top=[], base=[], j;
    var dirTop=0;
    for(j=0;j<=cnt;j++){
      var s=l.s1+(l.s2-l.s1)*j/cnt, q=l.q1+(l.q2-l.q1)*j/cnt, p=P(s);
      var hh=Math.abs(q)/qmax*36, dir=q>=0?-1:1;
      if(Math.abs(q)>1e-9) dirTop=dir;
      var yb=p.y+dir*5, yt=p.y+dir*(5+hh);
      base.push([p.x,yb]); top.push([p.x,yt]);
      if(hh>1.5) h+=arrow(p.x,yt,p.x,yb,cls,6);
    }
    var poly=base.concat(top.slice().reverse()).map(function(a){return a[0]+','+a[1];}).join(' ');
    h+='<polygon class="'+fcls+'" points="'+poly+'"/>';
    h+='<polyline class="'+cls+'" fill="none" points="'+top.map(function(a){return a[0]+','+a[1];}).join(' ')+'"/>';
    var mid=top[Math.floor(cnt/2)];
    h+=label(mid[0],mid[1]+(dirTop>=0?14:-6),l.name,l.auto?'g':'f');
    if(l.ref){
      h+=handle(top[0][0],top[0][1],'l:'+l.ref.id+':s1',false,false);
      h+=handle(top[cnt][0],top[cnt][1],'l:'+l.ref.id+':s2',false,false);
    }
  });

  // Einzelkräfte
  S.forces.forEach(function(f,n){
    var p=P(f.s), c=Math.cos(f.a*D2R), s=Math.sin(f.a*D2R);
    var len=Math.max(26,f.F*k), tx2=p.x-c*len, ty2=p.y+s*len;
    h+=arrow(tx2,ty2,p.x,p.y,'fa');
    h+=label(tx2-c*14,ty2+s*14+4,'F'+(n+1),'f');
  });
  // Momente
  S.moments.forEach(function(m,n){
    var p=P(m.s);
    if(Math.abs(m.M)>1e-9) h+=arcArrow(p.x,p.y,18,m.M>0,'F');
    h+=label(p.x,p.y-26,'M'+(n+1),'f');
  });

  // Lagerkräfte
  if(ok){
    S.supports.forEach(function(sp,n){
      var p=P(sp.s), nm=letter(n);
      if(sp.type==='roller'){
        if(Math.abs(sp.rn)>1e-6){
          var dx=Math.cos(sp.ang*D2R)*(sp.rn>0?1:-1), dy=-Math.sin(sp.ang*D2R)*(sp.rn>0?1:-1);
          var len=Math.max(26,Math.abs(sp.rn)*k);
          h+=arrow(p.x,p.y,p.x+dx*len,p.y+dy*len,'ra');
          h+=label(p.x+dx*(len+14),p.y+dy*(len+14)+4,nm,'r');
        }
      } else {
        if(Math.abs(sp.rx)>1e-6){
          var sg=sp.rx>0?1:-1, l1=Math.max(26,Math.abs(sp.rx)*k);
          h+=arrow(p.x,p.y,p.x+sg*l1,p.y,'ra');
          h+=label(p.x+sg*(l1+16),p.y+4,nm+'x','r');
        }
        if(Math.abs(sp.ry)>1e-6){
          var dd=sp.ry>0?-1:1, l2=Math.max(26,Math.abs(sp.ry)*k);
          h+=arrow(p.x,p.y,p.x,p.y+dd*l2,'ra');
          h+=label(p.x,dd<0?p.y-l2-7:p.y+l2+15,nm+'y','r');
        }
        if(sp.type==='fixed' && Math.abs(sp.rm)>1e-6){
          var side=sp.s<=S.L/2?-1:1;
          var cx=p.x-side*28*lay.c, cy=p.y+side*28*lay.s;
          h+=arcArrow(cx,cy,18,sp.rm>0,'R');
          h+=label(cx,cy-26,'M'+nm,'r');
        }
      }
    });
  }

  // Griffe
  marks.forEach(function(m){
    h+='<circle class="mk '+(m.lock?'lock':m.cls)+'" cx="'+m.px+'" cy="'+AXY+'" r="5.5" pointer-events="none"/>';
    h+='<text class="lbl '+(m.cls==='f'?'f':'a')+'" x="'+m.px+'" y="'+(AXY-10-m.lane*11)+'" text-anchor="middle">'+m.name+'</text>';
    if(!m.lock) h+='<circle class="hit" data-drag="'+m.key+'" data-ax="1" cx="'+m.px+'" cy="'+AXY+'" r="15"/>';
  });
  S.supports.forEach(function(sp){
    if(S.unk['sup:'+sp.id+':s']) return;
    var p=P(sp.s);
    h+='<circle class="hit" data-drag="sup:'+sp.id+':s" cx="'+p.x+'" cy="'+(p.y+14)+'" r="16"/>';
  });
  S.moments.forEach(function(m){
    if(S.unk['m:'+m.id+':s']) return;
    var p=P(m.s);
    h+='<circle class="hit" data-drag="m:'+m.id+':s" cx="'+p.x+'" cy="'+p.y+'" r="12"/>';
  });
  S.forces.forEach(function(f){
    var p=P(f.s), c=Math.cos(f.a*D2R), s=Math.sin(f.a*D2R);
    var len=Math.max(26,f.F*k), tx2=p.x-c*len, ty2=p.y+s*len;
    h+='<circle class="dot" cx="'+p.x+'" cy="'+p.y+'" r="3.5" pointer-events="none"/>';
    if(!S.unk['f:'+f.id+':s']) h+='<circle class="hit" data-drag="f:'+f.id+':s" cx="'+p.x+'" cy="'+p.y+'" r="12"/>';
    h+=handle(tx2,ty2,'f:'+f.id+':a',!!S.unk['f:'+f.id+':a'],false);
  });
  dyn.innerHTML=h;
}

/* ---------- Schnittgrössen-Diagramme ---------- */
function diaSvg(title,unit,xs,vs,down,col){
  var H=118, y0=62, amp=36, i, vmax=1e-9;
  vs.forEach(function(v){vmax=Math.max(vmax,Math.abs(v));});
  var flat=vmax<1e-6;
  var sc=flat?0:amp/vmax, dir=down?1:-1;
  var pts=xs.map(function(x,j){return (X0+x*W/S.L).toFixed(1)+','+(y0+dir*vs[j]*sc).toFixed(1);});
  var h='<svg viewBox="0 0 360 '+H+'" role="img" aria-label="'+title+'">';
  h+='<line class="dl" x1="'+X0+'" y1="'+y0+'" x2="'+(X0+W)+'" y2="'+y0+'"/>';
  if(!flat){
    h+='<polygon fill="'+col+'" opacity="0.18" points="'+X0+','+y0+' '+pts.join(' ')+' '+(X0+W)+','+y0+'"/>';
    h+='<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" points="'+pts.join(' ')+'"/>';
  }
  h+='<text class="dtitle" x="'+X0+'" y="12">'+title+' in '+unit+'</text>';
  if(flat){
    h+='<text class="dval" fill="'+col+'" x="'+(X0+W/2)+'" y="'+(y0-8)+'" text-anchor="middle">überall 0</text>';
  } else {
    var imax=0, imin=0;
    for(i=0;i<vs.length;i++){ if(vs[i]>vs[imax]) imax=i; if(vs[i]<vs[imin]) imin=i; }
    [imax,imin].forEach(function(ix,n){
      if(n===1&&imin===imax) return;
      var v=vs[ix]; if(Math.abs(v)<1e-6) return;
      var x=X0+xs[ix]*W/S.L, y=y0+dir*v*sc;
      var above=(dir*v<0);
      var ty=above?y-6:y+14;
      var tx=clamp(x,50,310);
      h+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+col+'"/>';
      h+='<text class="dval" fill="'+col+'" x="'+tx+'" y="'+ty+'" text-anchor="middle">'+fmt(v)+' bei s = '+fmt(xs[ix])+'</text>';
    });
  }
  h+='</svg>';
  return h;
}
function drawDia(){
  var el=$('#dia');
  var sol=S.sol;
  if(!sol||!sol.ok||sol.unbalanced){
    el.innerHTML='<h2>Schnittgrössen</h2><p class="dnote">Die Diagramme erscheinen, sobald der Aufbau im Gleichgewicht ist.</p>';
    return;
  }
  var f=internalForces();
  el.innerHTML='<h2>Schnittgrössen</h2>'+
    diaSvg('Normalkraft N','N',f.xs,f.N,false,'var(--norm)')+
    diaSvg('Querkraft Q','N',f.xs,f.V,false,'var(--shear)')+
    diaSvg('Biegemoment M','N·m',f.xs,f.M,true,'var(--mom)')+
    '<p class="dnote">N positiv = Zug. Q positiv = nach oben (links vom Schnitt). M positiv = Zugseite unten, hier nach unten aufgetragen.</p>';
}

/* ---------- Lösungsweg ---------- */
function eq(t,res,dim){return '<div class="eq'+(res?' res':'')+(dim?' dim':'')+'">'+t+'</div>';}
function step(title,lines){return '<div class="step"><h3>'+title+'</h3>'+lines.join('')+'</div>';}
function isKnownSrc(s){
  return !Object.keys(S.unk).some(function(k){return k===s.key||k.indexOf(s.key+':')===0;});
}
function srcLines(s,P){
  var out=[], g=geo();
  if(!isKnownSrc(s)){
    out.push(eq((s.kind==='S'?'Lager ':'')+s.name+': enthält gesuchte Grössen, wird unten über Koeffizienten eingerechnet.',false,true));
    return out;
  }
  var dx=s.x-P.x, dy=s.y-P.y, mp=contrib(s,2,P);
  if(s.kind==='F'){
    var f=s.ref;
    out.push(eq(s.name+': F = '+fmt(f.F)+' N, α = '+fmt(f.a,1)+'°, bei s = '+fmt(f.s)+' m'));
    out.push(eq('F<sub>x</sub> = F·cos α = '+fmt(f.F)+'·cos('+fmt(f.a,1)+'°) = '+fmt(s.fx)+' N, F<sub>y</sub> = F·sin α = '+fmt(s.fy)+' N'));
  } else if(s.kind==='M'){
    out.push(eq(s.name+' = '+fmt(s.m)+' N·m ('+(s.m>=0?'gegen':'im')+' Uhrzeigersinn)'));
  } else if(s.kind==='Q'){
    var l=s.load, li=s.li;
    if(l.auto) out.push(eq('Eigengewicht G = w·L = '+fmt(l.q1)+'·'+fmt(S.L)+' = '+fmt(li.R)+' N '+(li.R>=0?'↓':'↑')+', wirkt in der Balkenmitte'));
    else {
      out.push(eq(s.name+': R = (q<sub>a</sub> + q<sub>e</sub>)/2·(s<sub>2</sub> − s<sub>1</sub>) = ('+fmt(l.q1)+' + '+fmt(l.q2)+')/2·'+fmt(li.len)+' = '+fmt(li.R)+' N '+(li.R>=0?'↓':'↑')));
      if(Math.abs(li.R)>1e-9) out.push(eq('Lage der Resultierenden: s<sub>R</sub> = '+fmt(li.I/li.R)+' m (Schwerpunkt der Last)'));
      else out.push(eq('Resultierende = 0: die Last wirkt nur als Kräftepaar.'));
    }
  } else {
    var sp=s.ref;
    out.push(eq('Lager '+s.name+' (vorgegeben): '+(sp.type==='roller'?'F = '+fmt(sp.rn)+' N, Richtung '+fmt(sp.ang,1)+'°':s.name+'<sub>x</sub> = '+fmt(sp.rx)+' N, '+s.name+'<sub>y</sub> = '+fmt(sp.ry)+' N'+(sp.type==='fixed'?', M<sub>'+s.name+'</sub> = '+fmt(sp.rm)+' N·m':''))));
  }
  if(s.kind!=='M'){
    var t='M<sub>P</sub> = F<sub>y</sub>·Δx';
    var nt=pn(s.fy)+'·'+pn(dx);
    if(Math.abs(s.fx)>1e-9&&Math.abs(dy)>1e-9){t+=' − F<sub>x</sub>·Δy'; nt+=' − '+pn(s.fx)+'·'+pn(dy);}
    if(Math.abs(s.m)>1e-9) {t+=' + M'; nt+=' + '+pn(s.m);}
    if(Math.abs(mp)>1e-9||Math.abs(s.fy)>1e-9) out.push(eq(t+' = '+nt+' = '+fmt(mp)+' N·m'));
  }
  return out;
}
function eqNames(P){return ['ΣF<sub>x</sub>','ΣF<sub>y</sub>','ΣM<sub>'+P.label+'</sub>'];}
function stageHtml(info,P){
  var names=eqNames(P), u=info.u, sym=symOf(u), unit=unitOf(u), eu=info.k===2?'N·m':'N', ln=[];
  if(info.type==='lin'){
    if(info.contrib&&info.contrib.length) ln.push(eq('d = '+info.contrib.map(function(c){return c.name+': '+pn(c.v);}).join(' + ')+' = '+fmt(info.d)+' '+eu));
    ln.push(eq(fmt(info.d)+' + '+pn(info.c)+'·'+sym+' = 0'));
    ln.push(eq(sym+' = −'+pn(info.d)+' / '+pn(info.c)+' = '+fmt(info.raw)+' '+unit,true));
    if(info.flip) ln.push(eq('Negativ heisst: die Kraft wirkt in Gegenrichtung. Verwendet wird F = '+fmt(info.val)+' N mit α + 180°.',false,true));
  } else if(info.type==='ang'){
    ln.push(eq('A·cos α + B·sin α + D = 0 mit A = '+fmt(info.A,3)+', B = '+fmt(info.B,3)+', D = '+fmt(info.D,3)));
    ln.push(eq('R = √(A² + B²) = '+fmt(info.R,3)+', φ = '+fmt(info.phi)+'°'));
    ln.push(eq('α = φ ± arccos(−D/R) → '+fmt(info.a1)+'° oder '+fmt(info.a2)+'°'));
    ln.push(eq('Gewählt (näher am bisherigen Winkel): '+sym+' = '+fmt(info.val)+'°',true));
  } else {
    ln.push(eq('Nichtlineare Gleichung, numerisch gelöst: '+sym+' = '+fmt(info.val)+' '+unit,true));
  }
  return step(names[info.k]+' = 0 ⇒ '+sym,ln);
}
function drawPath(){
  var sol=S.sol, el=$('#formulas');
  if(!sol.ok){
    el.innerHTML='<div class="answer err">Keine Lösung</div><p class="err">'+sol.err+'</p>';
    return;
  }
  var P=sol.P, h='', st=[], i;
  // Ergebnis
  if(sol.keys.length){
    var ans=sol.keys.map(function(k){
      var v=getV(k), ex='';
      var fl=sol.steps.filter(function(s){return s.u===k&&s.flip;}).length;
      if(fl) ex=' (wirkt in Gegenrichtung)';
      return symOf(k)+' = '+fmt(v)+' '+unitOf(k)+ex;
    });
    h+='<div class="answer">'+ans.join('<br>')+'</div>';
  } else h+='<div class="answer">Gleichgewichtsprüfung</div>';

  // Aufbau
  var a=[];
  a.push(eq('Bezugspunkt für die Momente: P = '+(P.label==='O'?'Balkenanfang (s = 0)':'Lager '+P.label)));
  if(Math.abs(S.theta)>1e-9) a.push(eq('Balken geneigt um θ = '+fmt(S.theta,1)+'°: ein Punkt bei s liegt bei x = s·cos θ, y = s·sin θ.'));
  a.push(eq('Unbekannte: '+(sol.keys.length?sol.keys.map(symOf).join(', '):'keine')+' ('+sol.keys.length+') · Gleichungen: 3'));
  st.push(step('Aufbau',a));

  // Lasten
  var l=[];
  sources().forEach(function(s){srcLines(s,P).forEach(function(x){l.push(x);});});
  if(l.length) st.push(step('Lasten zerlegen',l));

  // Schritte
  sol.steps.forEach(function(s,n){
    if(s.type==='coupled'){
      var nm=eqNames(P);
      st.push(step('Gekoppelte Gleichungen',[
        eq('Gleichungen: '+s.eqs.map(function(k){return nm[k];}).join(', ')),
        eq('Unbekannte: '+s.keys.map(symOf).join(', ')+' hängen voneinander ab und werden zusammen gelöst (Newton, '+s.iters+' Schritte).'),
        eq(s.keys.map(function(k){return symOf(k)+' = '+fmt(getV(k))+' '+unitOf(k);}).join('<br>'),true)]));
    } else st.push(stageHtml(s,P));
  });

  // Probe
  var nm2=eqNames(P), r=sol.resid, pr=[];
  for(i=0;i<3;i++){
    pr.push(eq(nm2[i]+' = '+fmt(r[i],3)+(i===2?' N·m':' N')+' '+(Math.abs(r[i])<1e-6?'✓':(sol.used[i]?'✗':'≠ 0')),Math.abs(r[i])<1e-6));
  }
  if(sol.unbalanced){
    var txt='Kein Gleichgewicht: ';
    if(!sol.used[2]&&Math.abs(r[2])>1e-6) txt+=(r[2]>0?'der Körper dreht gegen den Uhrzeigersinn.':'der Körper dreht im Uhrzeigersinn.');
    else txt+='mit diesen Lagern bleibt eine Restkraft übrig.';
    pr.push(eq('<span class="err">'+txt+'</span>'));
  }
  st.push(step('Probe',pr));
  el.innerHTML=h+st.join('')+
    '<p class="small">Vorzeichen: Kräfte nach rechts und oben positiv, Momente positiv gegen den Uhrzeigersinn. α: 0° = rechts, 90° = oben, −90° = unten. Lagerkräfte sind die Kräfte, die das Lager auf den Balken ausübt.</p>';
}
function drawStatus(){
  var sol=S.sol, h='';
  h+='Unbekannte: <b>'+sol.n+'</b> · Gleichungen: <b>3</b>';
  if(!sol.ok) h+='<br><span class="warn">'+sol.err+'</span>';
  else if(sol.unbalanced) h+='<br><span class="warn">Kein Gleichgewicht: mit '+sol.n+' Unbekannten gibt es nicht genug Stützen. Kreuze eine weitere Grösse an.</span>';
  else if(sol.n===3) h+=' <span class="ok">✓ lösbar</span>';
  else if(sol.n<3) h+='<br>Weniger Unbekannte als Gleichungen: Es wird nur geprüft, ob Gleichgewicht herrscht.';
  var idle=[];
  S.supports.forEach(function(sp,i){
    var ks=reactionKeys().filter(function(k){return k.indexOf('sup:'+sp.id+':')===0;});
    if(ks.length&&!ks.some(function(k){return S.unk[k];})) idle.push(letter(i));
  });
  if(idle.length) h+='<br>Lager '+idle.join(', ')+': Kraft ist vorgegeben. Häkchen setzen, damit sie berechnet wird.';
  $('#status').innerHTML=h;
  $('#msg').textContent=(sol.warn||[]).join(' ').replace(/<[^>]+>/g,'');
}

/* ---------- Tabelle ---------- */
function row(valKey,tickKey,lab,unit){
  var sel=tickKey&&S.unk[tickKey];
  var h='<tr'+(sel?' class="sel"':'')+'><td class="tc">';
  if(tickKey) h+='<input type="checkbox" data-u="'+tickKey+'"'+(sel?' checked':'')+' aria-label="gesucht">';
  h+='</td><td>'+lab+'</td><td class="vl"><input type="number" inputmode="decimal" step="any" data-k="'+valKey+'"'+(sel?' disabled':'')+'></td><td class="un">'+unit+'</td></tr>';
  return h;
}
function grp(inner){return '<tr class="grp"><td colspan="4"><div class="gh">'+inner+'</div></td></tr>';}
function delBtn(act,aria){return '<button class="btn x" data-act="'+act+'" aria-label="'+aria+'">✕</button>';}
function renderTable(){
  var h='';
  h+='<div class="tpl"><select id="tpl" aria-label="Vorlage laden"><option value="">Vorlage laden …</option>';

  h+=grp('<span>Balken</span>');
  h+=row('L',null,'Länge L','m');
  h+=row('theta',null,'Neigung θ','°');

  S.supports.forEach(function(sp,i){
    var L=letter(i), b='sup:'+sp.id+':';
    h+=grp('<span>Lager '+L+'</span><span class="gr"><select data-sel="'+sp.id+'" aria-label="Lagertyp '+L+'">'+

    }
  });
  S.forces.forEach(function(f,i){
    var n=i+1, b='f:'+f.id+':';
    h+=grp('<span>Kraft F'+n+'</span>'+delBtn('delf:'+f.id,'F'+n+' entfernen'));
    h+=row(b+'s',b+'s','Ort s<sub>F'+n+'</sub>','m');
    h+=row(b+'F',b+'F','Grösse F<sub>'+n+'</sub>','N');
    h+=row(b+'a',b+'a','Winkel α<sub>'+n+'</sub>','°');
  });
  S.moments.forEach(function(m,i){
    var n=i+1, b='m:'+m.id+':';
    h+=grp('<span>Moment M'+n+'</span>'+delBtn('delm:'+m.id,'M'+n+' entfernen'));
    h+=row(b+'s',b+'s','Ort s<sub>M'+n+'</sub>','m');
    h+=row(b+'M',b+'M','Moment M<sub>'+n+'</sub> (+ = gegen Uhrzeigersinn)','N·m');
  });
  S.loads.forEach(function(l,i){
    var n=i+1, b='l:'+l.id+':';
    h+=grp('<span>Streckenlast Q'+n+'</span>'+delBtn('dell:'+l.id,'Q'+n+' entfernen'));
    h+=row(b+'s1',null,'Anfang s<sub>1</sub>','m');
    h+=row(b+'s2',null,'Ende s<sub>2</sub>','m');
    h+=row(b+'q1',b+'q1','Last am Anfang q<sub>'+n+'a</sub>','N/m');
    h+=row(b+'q2',b+'q2','Last am Ende q<sub>'+n+'e</sub>','N/m');
  });
  h+='</tbody></table>';
  h+='<div class="adds"><button class="btn pri" data-act="addsup">+ Lager</button><button class="btn pri" data-act="addF">+ Kraft</button>'+
     '<button class="btn pri" data-act="addM">+ Moment</button><button class="btn pri" data-act="addQ">+ Streckenlast</button></div>';
  $('#tablePanel').innerHTML=h;
  syncInputs(true);
}
function syncInputs(force){
  var els=document.querySelectorAll('[data-k]');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(!force&&el===document.activeElement) continue;
    var v=getV(el.getAttribute('data-k'));
    el.value=(v===undefined||v===null||isNaN(v))?'':String(Math.round(v*1000)/1000);
  }
}
function clampAll(){
  S.L=Math.max(0.1,S.L);
  S.theta=clamp(S.theta,-90,90);
  var ck=function(o,p,key){ if(!S.unk[key]) o[p]=clamp(o[p],0,S.L); };
  S.supports.forEach(function(sp){ck(sp,'s','sup:'+sp.id+':s');});
  S.forces.forEach(function(f){
    ck(f,'s','f:'+f.id+':s');
    if(f.F<0&&!S.unk['f:'+f.id+':F']){f.F=-f.F; f.a=f.a+180;}
    f.a=norm(f.a);
  });
  S.moments.forEach(function(m){ck(m,'s','m:'+m.id+':s');});
  S.loads.forEach(function(l){
    l.s1=clamp(l.s1,0,S.L); l.s2=clamp(l.s2,0,S.L);
    if(l.s1>l.s2){var t=l.s1;l.s1=l.s2;l.s2=t;}
  });
}
function update(){
  S.sol=solve();
  drawSvg(); drawDia(); syncInputs(false); drawStatus(); drawPath();
}
function rebuild(){cleanUnk(); renderTable(); update();}

/* ---------- Vorlagen ---------- */

function newSup(type,s,ang){return {id:S.nid++,type:type,s:s,ang:(ang===undefined?90:ang),rx:0,ry:0,rn:0,rm:0};}
function applyTpl(t){
  S.L=t.L; S.theta=t.theta||0; S.w=t.w||0; S.nid=1;
  S.supports=[]; S.forces=[]; S.moments=[]; S.loads=[]; S.unk={};
  t.sup.forEach(function(o){S.supports.push(newSup(o[0],o[1],o[2]));});
  t.F.forEach(function(o){S.forces.push({id:S.nid++,s:o[0],F:o[1],a:o[2]});});
  t.M.forEach(function(o){S.moments.push({id:S.nid++,s:o[0],M:o[1]});});
  t.Q.forEach(function(o){S.loads.push({id:S.nid++,s1:o[0],s2:o[1],q1:o[2],q2:o[3]});});
  reactionKeys().forEach(function(k){S.unk[k]=true;});
  t.unk.forEach(function(u){var o=S.forces[u[1]]; if(o) S.unk['f:'+o.id+':'+u[2]]=true;});
  autoBalance(null);
}

var panel=$('#tablePanel');
panel.addEventListener('input',function(e){
  var el=e.target; if(!el.getAttribute) return;
  var key=el.getAttribute('data-k'); if(!key||el.type==='checkbox') return;
  var v=parseFloat(el.value); if(!isFinite(v)) return;
  if(key==='L'&&v<=0) return;
  setV(key,v);
  update();
});
panel.addEventListener('change',function(e){
  var el=e.target; if(!el.getAttribute) return;
  if(el.id==='tpl'){
    if(el.value==='') return;
    applyTpl(TPL[+el.value]); rebuild(); return;
  }
  var sel=el.getAttribute('data-sel');
  if(sel){
    var sp=byId(S.supports,+sel); if(!sp) return;
    ['x','y','R','m'].forEach(function(c){delete S.unk['sup:'+sp.id+':'+c];});
    sp.type=el.value;
    if(sp.type==='roller'&&sp.ang===undefined) sp.ang=90;
    var b='sup:'+sp.id+':';
    if(sp.type==='roller') S.unk[b+'R']=true; else {S.unk[b+'x']=true; S.unk[b+'y']=true; if(sp.type==='fixed') S.unk[b+'m']=true;}
    autoBalance(null); rebuild(); return;
  }
  if(el.type==='checkbox'){
    var key=el.getAttribute('data-u'); if(!key) return;
    if(el.checked) S.unk[key]=true; else delete S.unk[key];
    autoBalance(key); rebuild(); return;
  }
  if(!el.getAttribute('data-k')) return;
  clampAll(); syncInputs(true); update();
});
panel.addEventListener('click',function(e){

    var sp=newSup('roller',Math.round(S.L/2*100)/100,90);
    S.supports.push(sp);
    autoBalance(null);
  } else if(a[0]==='addF'){
    S.forces.push({id:S.nid++,s:Math.round(S.L/2*100)/100,F:50,a:-90});
  } else if(a[0]==='addM'){
    S.moments.push({id:S.nid++,s:Math.round(S.L/2*100)/100,M:100});
  } else if(a[0]==='addQ'){
    S.loads.push({id:S.nid++,s1:Math.round(S.L*25)/100,s2:Math.round(S.L*75)/100,q1:20,q2:20});
  } else if(a[0]==='delsup'){
    S.supports=S.supports.filter(function(q){return q.id!==id;}); cleanUnk(); autoBalance(null);
  } else if(a[0]==='delf'){
    S.forces=S.forces.filter(function(q){return q.id!==id;}); cleanUnk(); autoBalance(null);
  } else if(a[0]==='delm'){
    S.moments=S.moments.filter(function(q){return q.id!==id;}); cleanUnk(); autoBalance(null);
  } else if(a[0]==='dell'){
    S.loads=S.loads.filter(function(q){return q.id!==id;}); cleanUnk(); autoBalance(null);

// Ziehen im Bild und auf der Achse
var drag=null;
function toSvg(e){
  var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  var m=svg.getScreenCTM(); if(!m) return {x:0,y:0};
  return pt.matrixTransform(m.inverse());
}
function snapS(v){return clamp(Math.round(v*20)/20,0,S.L);}
svg.addEventListener('pointerdown',function(e){
  var t=e.target.closest?e.target.closest('[data-drag]'):null; if(!t) return;
  drag={key:t.getAttribute('data-drag'),ax:t.getAttribute('data-ax')==='1'};
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
svg.addEventListener('pointermove',function(e){
  if(!drag) return;
  var p=toSvg(e), key=drag.key;
  if(isAngleKey(key)){
    var f=refKey(key.replace(/:a$/,':s')), bp=P(f.o.s);
    var vx=p.x-bp.x, vy=p.y-bp.y;
    if(Math.sqrt(vx*vx+vy*vy)<6) return;
    setV(key,norm(Math.round(Math.atan2(vy,-vx)/D2R/5)*5));
  } else {
    var s;
    if(drag.ax) s=(p.x-X0)/(W/S.L);
    else {
      var o=P(0);
      s=((p.x-o.x)*lay.c+(p.y-o.y)*(-lay.s))/lay.u;
    }
    setV(key,snapS(s));
  }
  update();
});
function endDrag(){if(!drag) return; drag=null; clampAll(); syncInputs(true); update();}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

applyTpl(TPL[0]);
rebuild();

      Ek1:0.5*p.m1*v1*v1,Ek2:0.5*p.m2*v2*v2,px:px,py:py,p:Math.sqrt(px*px+py*py),
      dist:Math.sqrt(Math.pow(y[2]-y[0],2)+Math.pow(y[3]-y[1],2))};

function predictStoss(p){
  var a1=p.a1*D2R, a2=p.a2*D2R, u1x=p.v1*Math.cos(a1), u1y=p.v1*Math.sin(a1), u2x=p.v2*Math.cos(a2), u2y=p.v2*Math.sin(a2);
  var rx=p.x2-p.x1, ry=p.y2-p.y1, ux=u2x-u1x, uy=u2y-u1y, R=p.r1+p.r2;
  var A=ux*ux+uy*uy, B=rx*ux+ry*uy, C=rx*rx+ry*ry-R*R, disc=B*B-A*C;
  var o={u1x:u1x,u1y:u1y,u2x:u2x,u2y:u2y,rx:rx,ry:ry,ux:ux,uy:uy,R:R,A:A,B:B,C:C,disc:disc,tc:null};
  if(A>1e-12&&B<0&&disc>=0&&C>=0) o.tc=(-B-Math.sqrt(disc))/A;
  if(A>1e-12&&B<0) o.dmin=Math.sqrt(Math.max(0,C+R*R-B*B/A)); else o.dmin=Math.sqrt(C+R*R);
  return o;
}

/* ---------- Numerik ---------- */
function rk4(sc,p,t,y,h){
  var n=y.length, i, y2=new Array(n), o=new Array(n);
  var k1=sc.deriv(p,t,y);
  for(i=0;i<n;i++) y2[i]=y[i]+h/2*k1[i];
  var k2=sc.deriv(p,t+h/2,y2);
  for(i=0;i<n;i++) y2[i]=y[i]+h/2*k2[i];
  var k3=sc.deriv(p,t+h/2,y2);
  for(i=0;i<n;i++) y2[i]=y[i]+h*k3[i];
  var k4=sc.deriv(p,t+h,y2);
  for(i=0;i<n;i++) o[i]=y[i]+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
  return o;
}
function stepOnce(sc,p,t,y,h){
  if(sc.adaptDt){
    var ya=y, rem=h, ta=t, cap=h/(sc.sub||1), it=0;
    while(rem>1e-15&&it++<200000){
      var dts=Math.max(Math.min(rem,cap,sc.adaptDt(p,ya)),1e-9);
      ya=rk4(sc,p,ta,ya,dts); ta+=dts; rem-=dts;
    }
    return ya;
  }
  if(sc.sub>1){
    var yy=y, k, hs=h/sc.sub;
    for(k=0;k<sc.sub;k++) yy=rk4(sc,p,t+k*hs,yy,hs);
    return yy;
  }
  var yn=rk4(sc,p,t,y,h);
  if(sc.zeroV!==undefined&&sc.zeroOn(p)&&y[sc.zeroV]*yn[sc.zeroV]<0){
    var vi=sc.zeroV, lo=0, hi=h, i;
    for(i=0;i<40;i++){var mid=(lo+hi)/2, ym=rk4(sc,p,t,y,mid); if(y[vi]*ym[vi]>0) lo=mid; else hi=mid;}
    var z=rk4(sc,p,t,y,hi); z[vi]=0;
    var rest=h-hi;
    if(rest>1e-14) return stepOnce(sc,p,t+hi,z,rest);
    return z;
  }
  return sc.post?sc.post(p,y,yn):yn;
}
function simulate(sc,p,tEnd){
  var dt=sc.dtOf?sc.dtOf(p):(sc.dt||0.005);
  if(tEnd/dt>60000) dt=tEnd/60000;
  var y=sc.init(p), ts=[0], ys=[y], t=0, ended=null, events=[], guard=0;
  while(t<tEnd-1e-12&&guard++<400000){
    var h=Math.min(dt,tEnd-t), yn=stepOnce(sc,p,t,y,h);
    if(sc.event&&sc.event(p,y)>=0&&sc.event(p,yn)<0){
      var lo=0, hi=h, i;
      for(i=0;i<40;i++){var mid=(lo+hi)/2; if(sc.event(p,stepOnce(sc,p,t,y,mid))<0) hi=mid; else lo=mid;}
      var y0=stepOnce(sc,p,t,y,hi), yc=sc.finish(p,y0), tc=t+hi;
      if(typeof sc.cont==='function'?sc.cont(p,y0):sc.cont){
        events.push({t:tc,before:y0,after:yc});
        t=tc; y=yc; ts.push(t); ys.push(y);
        continue;
      }
      ended={t:tc,y:yc}; ts.push(tc); ys.push(yc);
      break;
    }
    t+=h; y=yn; ts.push(t); ys.push(y);
  }
  return {sc:sc,p:p,ts:ts,ys:ys,dt:dt,ended:ended,events:events,tEnd:tEnd};
}
function idxAt(ts,t){
  var lo=0, hi=ts.length-1;
  while(lo<hi){var mid=(lo+hi+1)>>1; if(ts[mid]<=t+1e-12) lo=mid; else hi=mid-1;}
  return lo;
}
function stateAt(sim,t){
  if(sim.ended&&t>=sim.ended.t) return sim.ended.y;
  t=clamp(t,0,sim.tEnd);
  var i=idxAt(sim.ts,t), h=t-sim.ts[i];
  if(h<1e-12) return sim.ys[i];
  return stepOnce(sim.sc,sim.p,sim.ts[i],sim.ys[i],h);
}
function qOf(sim,t){
  var q=sim.sc.q(sim.p,stateAt(sim,t),t);
  q.v=Math.sqrt(q.vx*q.vx+q.vy*q.vy);
  q.a=Math.sqrt(q.ax*q.ax+q.ay*q.ay);
  q.E=q.Ep+q.Ek;
  return q;
}
function tu(){return SC[D.sc].tunit||'s';}
function isW(){return D.sc==='wurf'||D.sc==='kanone';}
function recompute(){
  var sc=SC[D.sc], p=D.P[D.sc];
  if(sc.prep) sc.prep(p);
  if(D.sc==='rolle'){
    p.n=Math.max(1,Math.min(8,Math.round(p.n)));
    p.H=Math.max(2.5,p.H);
    p.h1=clamp(p.h1,0,Math.max(0,p.H-SC.rolle.clrL(p)));
    p.h2=clamp(p.h2,0,Math.max(0,p.H-0.6));
  }
  D.sim=simulate(sc,p,Math.max(D.t,0.001));
  D.sim.q0=qOf(D.sim,0);
  D.full=null;
  if(isW()||sc.full) D.full=simulate(sc,p,120);
  if(sc.after) sc.after(p);
  var tv=(isW()&&D.sim.ended)?D.sim.ended.t:D.t, ss=samples(Math.max(tv,0.001),100);
  D.vmax=maxOf(ss,'v'); D.amax=maxOf(ss,'a');
  if(D.sc==='stoss'){D.vmax=Math.max(maxOf(ss,'v1'),maxOf(ss,'v2'),1e-9); D.amax=1;}
  D.pred=D.sc==='stoss'?predictStoss(p):null;
  D.view=computeView(tv);
}
function computeView(tv){
  var p=D.P[D.sc], j, q;
  if(SC[D.sc].view) return SC[D.sc].view(tv);
  if(isW()){
    var x0=0,x1=0,y0=Math.min(0,p.h0),y1=p.h0;
    for(j=0;j<=120;j++){
      q=qOf(D.sim,tv*j/120);
      x0=Math.min(x0,q.x); x1=Math.max(x1,q.x); y0=Math.min(y0,q.y); y1=Math.max(y1,q.y);
    }
    if(p.ground) y0=Math.min(y0,0);
    var wx=Math.max(x1-x0,1), wy=Math.max(y1-y0,1), sc=Math.min(290/wx,175/wy);
    return {s:sc,ox:35+(290-wx*sc)/2,xmin:x0,top:240-wy*sc,ymax:y1,ymin:y0,wx:wx,wy:wy};
  }
  if(D.sc==='feder'){
    var ymax=Math.max(p.y0,p.l0,p.l0+p.m*D.g/p.k);
    for(j=0;j<=100;j++){q=qOf(D.sim,D.t*j/100); ymax=Math.max(ymax,q.d);}
    ymax=Math.max(ymax,0.1)*1.1;
    return {s:Math.min(220/ymax,400)};
  }
  if(D.sc==='ebene'){
    var b=p.beta*D2R;
    return {s:Math.min(280/(p.Ls*Math.cos(b)),190/(p.Ls*Math.sin(b))),xb:35,yb:250};
  }
  if(D.sc==='stoss'){
    var xs0=1e9,xs1=-1e9,ys0=1e9,ys1=-1e9, rr=Math.max(p.r1,p.r2);
    for(j=0;j<=120;j++){
      q=qOf(D.sim,tv*j/120);
      xs0=Math.min(xs0,q.x1-p.r1,q.x2-p.r2); xs1=Math.max(xs1,q.x1+p.r1,q.x2+p.r2);
      ys0=Math.min(ys0,q.y1-p.r1,q.y2-p.r2); ys1=Math.max(ys1,q.y1+p.r1,q.y2+p.r2);
    }
    var wx2=Math.max(xs1-xs0,1), wy2=Math.max(ys1-ys0,1), s2=Math.min(290/wx2,200/wy2);
    return {s:s2,ox:35+(290-wx2*s2)/2,xmin:xs0,top:30+(200-wy2*s2)/2,ymax:ys1,ymin:ys0,wx:wx2,wy:wy2};
  }
  return {};
}

/* ---------- Hilfen fürs Zeichnen ---------- */
function niceStep(range,target){
  var raw=range/target, pw=Math.pow(10,Math.floor(Math.log10(raw))), fr=raw/pw;
  return (fr<1.5?1:(fr<3.5?2:(fr<7.5?5:10)))*pw;

function arrow(x1,y1,x2,y2,cls,size){

  var nx=-Math.sin(a)*size*0.45, ny=Math.cos(a)*size*0.45;
  return '<line class="'+cls+'" x1="'+x1+'" y1="'+y1+'" x2="'+bx+'" y2="'+by+'"/>'+

}
function txt(x,y,t,cls,anchor){return '<text class="'+cls+'" x="'+x+'" y="'+y+'" text-anchor="'+(anchor||'middle')+'">'+t+'</text>';}
function lbl(x,y,t,cls){return '<text class="lbl '+cls+'" x="'+clamp(x,14,346)+'" y="'+clamp(y,12,296)+'" text-anchor="middle">'+t+'</text>';}
function handle(cx,cy,key){

function vecArrows(sx,sy,q,vs,as_){
  var h='';
  if(q.v>1e-9){var l=Math.max(8,q.v*vs); h+=arrow(sx,sy,sx+q.vx/q.v*l,sy-q.vy/q.v*l,'ra',7);}

  return h;
}
function samples(tmax,N){
  var o=[], j;
  for(j=0;j<=N;j++) o.push(qOf(D.sim,tmax*j/N));

}
function maxOf(arr,key){var m=1e-12; arr.forEach(function(q){m=Math.max(m,Math.abs(q[key]));}); return m;}

function drawStoss(tau){
  var p=D.P.stoss, h='', V=D.lock||D.view, i, j, q;

  function Y(y){return V.top+(V.ymax-y)*V.s;}

  for(i=xa;i<=V.xmin+V.wx+1e-9;i+=sx) h+='<line class="cgrid" x1="'+X(i)+'" y1="'+Y(V.ymax)+'" x2="'+X(i)+'" y2="'+Y(V.ymin)+'"/>'+txt(X(i),Y(V.ymin)+13,f(i),'tick');
  for(i=ya;i<=V.ymax+1e-9;i+=sy) h+='<line class="cgrid" x1="'+X(V.xmin)+'" y1="'+Y(i)+'" x2="'+X(V.xmin+V.wx)+'" y2="'+Y(i)+'"/>'+txt(X(V.xmin)-4,Y(i)+3,f(i),'tick','end');
  var tview=D.t, tw=Math.min(tau,tview), N=160, g1=[],g2=[],t1=[],t2=[];
  for(j=0;j<=N;j++){q=qOf(D.sim,tview*j/N); g1.push(X(q.x1)+','+Y(q.y1)); g2.push(X(q.x2)+','+Y(q.y2));}
  for(j=0;j<=N;j++){q=qOf(D.sim,tw*j/N); t1.push(X(q.x1)+','+Y(q.y1)); t2.push(X(q.x2)+','+Y(q.y2));}
  h+='<polyline class="trg" points="'+g1.join(' ')+'"/><polyline class="trg" points="'+g2.join(' ')+'"/>';
  h+='<polyline class="tr" points="'+t1.join(' ')+'"/><polyline class="tr" stroke="var(--react)" points="'+t2.join(' ')+'"/>';
  var r1=Math.max(p.r1*V.s,5), r2=Math.max(p.r2*V.s,5), q0=D.sim.q0;
  h+='<circle class="bobg" cx="'+X(q0.x1)+'" cy="'+Y(q0.y1)+'" r="'+r1+'"/><circle class="bobg" cx="'+X(q0.x2)+'" cy="'+Y(q0.y2)+'" r="'+r2+'"/>';
  var ev=D.sim.events[0];
  if(ev&&tau>=ev.t){
    var c1=ev.after;

  var qq=qOf(D.sim,tau), b1=[X(qq.x1),Y(qq.y1)], b2=[X(qq.x2),Y(qq.y2)];
  h+='<circle class="bob" cx="'+b1[0]+'" cy="'+b1[1]+'" r="'+r1+'"/>'+txt(b1[0],b1[1]+4,'1','tick');
  h+='<circle class="bob" fill="var(--react)" cx="'+b2[0]+'" cy="'+b2[1]+'" r="'+r2+'"/>'+txt(b2[0],b2[1]+4,'2','tick');

  h+=vecArrows(b1[0],b1[1],{v:qq.v1,vx:qq.vx1,vy:qq.vy1,a:0,ax:0,ay:0},vs,1);
  h+=vecArrows(b2[0],b2[1],{v:qq.v2,vx:qq.vx2,vy:qq.vy2,a:0,ax:0,ay:0},vs,1);
  // Startpfeile + Griffe
  [[1,q0.x1,q0.y1,p.v1,p.a1],[2,q0.x2,q0.y2,p.v2,p.a2]].forEach(function(o){

    var tx=sx0+Math.cos(al)*len, ty=sy0-Math.sin(al)*len;

    h+=handle(tx,ty,'stoss:v'+o[0])+handle(sx0,sy0,'stoss:p'+o[0]);
  });
  h+=txt(40,292,'x, y in m (Aufsicht, ohne Schwerkraft)','tick','start');
  return h;
}
function drawScene(tau){
  var h='';
  if(SC[D.sc].draw){ddyn.innerHTML=SC[D.sc].draw(tau); return;}
  if(D.sc==='pend') h=drawPend(tau);
  else if(D.sc==='wurf') h=drawWurf(tau);

function chartSvg(title,unit,series,tmax,tau){
  var x0=34,xw=296,yt=26,yh=70,yb=yt+yh, i, vmin=0, vmax=0;
  series.forEach(function(s){s.d.forEach(function(v){vmin=Math.min(vmin,v);vmax=Math.max(vmax,v);});});
  if(vmax-vmin<1e-9){vmax=vmin+1;}
  var pad=(vmax-vmin)*0.06; if(vmax>0) vmax+=pad; if(vmin<0) vmin-=pad;
  function Y(v){return yb-(v-vmin)/(vmax-vmin)*yh;}
  var N=series[0].d.length-1;
  var h='<svg viewBox="0 0 360 122" role="img" aria-label="'+title+'">';
  h+='<line class="cax" x1="'+x0+'" y1="'+yb+'" x2="'+(x0+xw)+'" y2="'+yb+'"/>';
  h+='<line class="cax" x1="'+x0+'" y1="'+yt+'" x2="'+x0+'" y2="'+yb+'"/>';
  if(vmin<0&&vmax>0) h+='<line class="cgrid" x1="'+x0+'" y1="'+Y(0)+'" x2="'+(x0+xw)+'" y2="'+Y(0)+'"/>';
  h+=txt(x0-3,yt+4,f(vmax),'tick','end')+txt(x0-3,yb+3,f(vmin),'tick','end');
  h+=txt(x0,yb+13,'0','tick')+txt(x0+xw,yb+13,f(tmax)+' '+tu(),'tick','end');
  series.forEach(function(s){
    var pts=s.d.map(function(v,j){return (x0+xw*j/N).toFixed(1)+','+Y(v).toFixed(1);});
    h+='<polyline fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="5 4"':'')+' points="'+pts.join(' ')+'"/>';
  });
  var mx=x0+xw*clamp(tau/tmax,0,1);
  h+='<line class="cmark" data-x0="'+x0+'" data-xw="'+xw+'" data-tmax="'+tmax+'" x1="'+mx+'" y1="'+yt+'" x2="'+mx+'" y2="'+yb+'"/>';
  h+='<text class="ctitle" x="'+x0+'" y="12">'+title+' in '+unit+'</text>';
  var lx=x0+xw;
  for(i=series.length-1;i>=0;i--){
    h+='<text class="cleg" fill="'+series[i].c+'" x="'+lx+'" y="12" text-anchor="end">'+series[i].n+'</text>';
    lx-=series[i].n.replace(/<[^>]+>/g,'').length*6.6+10;
  }
  return h+'</svg>';
}

function wrap(a){return ((a+180)%360+360)%360-180;}
function R(l,v,u,hl){return {l:l,v:v,u:u,hl:hl};}
function Gp(t){return {g:t};}
function resultRows(q){
