    o.push(Gp('Beschleunigung'),R('a<sub>x</sub>',q.ax,'m/s²'),R('a<sub>y</sub>',q.ay,'m/s²'),R('|a|',q.a,'m/s²',1));
  } else if(D.sc==='feder'){
    o.push(Gp('Position'),R('Abstand unter der Aufhängung',q.d,'m',1),R('Ruhelage',q.yeq,'m'),R('Auslenkung aus der Ruhelage',q.disp,'m'));
    o.push(Gp('Geschwindigkeit'),R('v (nach unten +)',-q.vy,'m/s',1));
    o.push(Gp('Beschleunigung'),R('a (nach unten +)',-q.ay,'m/s²',1));
    o.push(Gp('Kraft'),R('Federkraft F',q.Fs,'N'));
  } else if(D.sc==='rolle'){
    o.push(Gp('Position'),R('Höhe der Zugmasse m<sub>2</sub>',q.hz,'m',1),R('Höhe der Last m<sub>1</sub>',q.hl,'m',1));
    o.push(Gp('Geschwindigkeit'),R('Zugmasse (abwärts +)',q.vz,'m/s',1),R('Last (aufwärts +)',q.vl,'m/s',1));
    o.push(Gp('Beschleunigung'),R('Zugmasse (abwärts +)',q.az,'m/s²',1),R('Last (aufwärts +)',q.al,'m/s²',1));
    o.push(Gp('Kräfte'),R('Seilkraft bei der Zugmasse',q.Te,'N'),R('Seilkraft bei der Last (pro Seilstück)',q.Tb,'N'),R('Gesamte Haltekraft an der Last',q.Tb*p.n,'N'));
  } else if(D.sc==='stoss'){
    o.push(Gp('Körper 1'),R('x',q.x1,'m'),R('y',q.y1,'m'),R('v<sub>x</sub>',q.vx1,'m/s'),R('v<sub>y</sub>',q.vy1,'m/s'),R('|v|',q.v1,'m/s',1),R('E<sub>kin</sub>',q.Ek1,'J'));
    o.push(Gp('Körper 2'),R('x',q.x2,'m'),R('y',q.y2,'m'),R('v<sub>x</sub>',q.vx2,'m/s'),R('v<sub>y</sub>',q.vy2,'m/s'),R('|v|',q.v2,'m/s',1),R('E<sub>kin</sub>',q.Ek2,'J'));
    o.push(Gp('Beschleunigung'),R('a (keine Kraft ausser beim Stoss)',0,'m/s²'));
    o.push(Gp('Impuls'),R('p<sub>x</sub> = m<sub>1</sub>·v<sub>1x</sub> + m<sub>2</sub>·v<sub>2x</sub>',q.px,'kg·m/s'),R('p<sub>y</sub>',q.py,'kg·m/s'),R('|p|',q.p,'kg·m/s',1));
    var ev=D.sim.events[0];
    o.push(Gp('Stoss'));
    if(ev){
      var dv1=Math.sqrt(Math.pow(ev.after[4]-ev.before[4],2)+Math.pow(ev.after[5]-ev.before[5],2)), J=p.m1*dv1;
      o.push(R('Zeitpunkt des Stosses',ev.t,'s',1),R('Stossimpuls J',J,'N·s'),R('Energieverlust beim Stoss',D.sim.q0.E-qOf(D.sim,Math.max(ev.t+1e-6,0)).E,'J'));
    } else if(D.pred&&D.pred.tc!==null) o.push(R('Stoss erst bei t =',D.pred.tc,'s',1));
    else o.push(R('Kein Stoss: kleinster Abstand der Mittelpunkte',D.pred?D.pred.dmin:null,'m'));
  } else if(D.sc==='doppel'){
    o.push(Gp('Position (Aufhängung = 0)'),R('Winkel θ<sub>1</sub>',wrap(q.th1),'°'),R('Winkel θ<sub>2</sub>',wrap(q.th2),'°'),
      R('Kugel 1: x',q.x1,'m'),R('Kugel 1: y',q.y1,'m'),R('Kugel 2: x',q.x,'m',1),R('Kugel 2: y',q.y,'m',1));
    o.push(Gp('Geschwindigkeit'),R('ω<sub>1</sub>',q.w1,'rad/s'),R('ω<sub>2</sub>',q.w2,'rad/s'),R('|v<sub>1</sub>| Kugel 1',q.v1,'m/s'),R('|v<sub>2</sub>| Kugel 2',q.v,'m/s',1));
    o.push(Gp('Beschleunigung'),R('|a<sub>1</sub>| Kugel 1',q.a1,'m/s²'),R('a<sub>2x</sub>',q.ax,'m/s²'),R('a<sub>2y</sub>',q.ay,'m/s²'),R('|a<sub>2</sub>| Kugel 2',q.a,'m/s²',1));
  } else {
    o.push(Gp('Position'),R('Weg u (vom unteren Ende)',q.u,'m',1),R('x',q.x,'m'),R('Höhe y',q.y,'m'));
    o.push(Gp('Geschwindigkeit'),R('v (aufwärts +)',q.v*(q.vx<0?-1:1),'m/s',1));
    o.push(Gp('Beschleunigung'),R('a längs der Ebene',q.a*(q.ax<0?-1:1),'m/s²',1),R('a<sub>x</sub>',q.ax,'m/s²'),R('a<sub>y</sub>',q.ay,'m/s²'));
    o.push(Gp('Kräfte'),R('Normalkraft F<sub>N</sub>',q.FN,'N'),R('Reibkraft F<sub>R</sub>',q.FR,'N'),R('Hangabtrieb F<sub>H</sub>',q.FH,'N'));
  }
  o.push(Gp('Energie'));
  if(D.sc==='stoss'){
    o.push(R('E<sub>kin</sub> gesamt',q.Ek,'J',1),R('Änderung ΔE seit dem Start',dE,'J'));
    return o;
  }
  if(D.sc==='feder') o.push(R('E<sub>pot,Schwere</sub> = m·g·Δh',q.Epg,'J'),R('E<sub>pot,Feder</sub> = ½·k·Δl²',q.Eps,'J'));
  o.push(R('E<sub>pot</sub> (Lage)',q.Ep,'J',1),R('E<sub>kin</sub> (Bewegung)',q.Ek,'J',1),R('E = E<sub>pot</sub> + E<sub>kin</sub>',q.E,'J'));
  if(D.sc==='ebene'||D.sc==='rolle') o.push(R('Reibungswärme Q',q.Q,'J'));
  o.push(R('Änderung ΔE seit dem Start',dE,'J'));
  if(D.sc==='wurf'){
    var st=wurfStats();
    o.push(Gp('Wurfdaten'),R('Steigzeit',st.tApex,'s'),R('Wurfhöhe (max. y)',st.ymax,'m'));
    if(st.tLand!==null) o.push(R('Flugzeit bis Aufprall',st.tLand,'s'),R('Wurfweite',st.range,'m'));
  }
  return o;
}
function wurfStats(){
  var sim=D.full, i, best=0;
  for(i=0;i<sim.ys.length;i++) if(sim.ys[i][1]>sim.ys[best][1]) best=i;
  return {tApex:sim.ts[best],ymax:sim.ys[best][1],tLand:sim.ended?sim.ended.t:null,range:sim.ended?sim.ended.y[0]:null};
}
function drawResults(tau){
  var q=qOf(D.sim,tau), rows=resultRows(q), h='<h2>Werte bei t = '+f(tau)+' '+tu()+'</h2><table class="rtbl"><tbody>';
  rows.forEach(function(r){
    if(r.g) h+='<tr class="g"><td colspan="3">'+r.g+'</td></tr>';
    else h+='<tr'+(r.hl?' class="hl"':'')+'><td>'+r.l+'</td><td class="v">'+(r.v===null?'–':f(r.v))+'</td><td class="u">'+r.u+'</td></tr>';
  });
  h+='</tbody></table>';
  if(D.sim.ended&&tau>=D.sim.ended.t-1e-9) h+='<p class="small">Die Bewegung ist bei t = '+f(D.sim.ended.t)+' '+tu()+' zu Ende (Boden oder Anschlag erreicht). Die Werte gelten für den Endzustand.</p>';
  $('#dres').innerHTML=h;
}

/* ---------- Lösungsweg ---------- */
function eq(t,res,dim){return '<div class="eq'+(res?' res':'')+(dim?' dim':'')+'">'+t+'</div>';}
function step(title,lines){return '<div class="step"><h3>'+title+'</h3>'+lines.join('')+'</div>';}
function energySteps(q,E0,tau){
  var p=D.P[D.sc], g=D.g, s=[];
  if(D.sc==='pend') s.push(eq('E<sub>pot</sub> = m·g·h = '+f(p.m)+'·'+f(g)+'·'+f(q.h)+' = '+f(q.Ep)+' J'));
  else if(D.sc==='wurf') s.push(eq('E<sub>pot</sub> = m·g·y = '+f(p.m)+'·'+f(g)+'·'+f(q.y)+' = '+f(q.Ep)+' J'));
  else if(D.sc==='rolle') s.push(eq('E<sub>pot</sub> = m<sub>2</sub>·g·h<sub>2</sub> + (m<sub>1</sub> + m<sub>p</sub>)·g·h<sub>1</sub> = '+f(p.m2)+'·'+f(g)+'·'+f(q.hz)+' + '+f(p.m1+p.mp)+'·'+f(g)+'·'+f(q.hl)+' = '+f(q.Ep)+' J'));
  else if(D.sc==='doppel') s.push(eq('E<sub>pot</sub> = g·(m<sub>1</sub>·h<sub>1</sub> + m<sub>2</sub>·h<sub>2</sub>) = '+f(g)+'·('+f(p.m1)+'·'+f(q.h1)+' + '+f(p.m2)+'·'+f(q.h2)+') = '+f(q.Ep)+' J (h = Höhe über dem tiefsten möglichen Punkt)'));
  else if(D.sc==='ebene') s.push(eq('E<sub>pot</sub> = m·g·u·sin β = '+f(p.m)+'·'+f(g)+'·'+f(q.u)+'·sin('+f(p.beta)+'°) = '+f(q.Ep)+' J'));
  else {
    s.push(eq('E<sub>pot,Schwere</sub> = m·g·(y<sub>Ruhe</sub> − y) = '+f(p.m)+'·'+f(g)+'·('+f(q.yeq)+' − '+f(q.d)+') = '+f(q.Epg)+' J'));
    s.push(eq('E<sub>pot,Feder</sub> = ½·k·(y − l<sub>0</sub>)² = ½·'+f(p.k)+'·('+f(q.d)+' − '+f(p.l0)+')² = '+f(q.Eps)+' J'));
  }
  var vv=(D.sc==='pend')?'(L·ω)':'v';
  if(D.sc==='rolle') s.push(eq('E<sub>kin</sub> = ½·m<sub>2</sub>·v² + ½·(m<sub>1</sub> + m<sub>p</sub>)·v<sub>1</sub>² + ¼·M<sub>r</sub>·v² = ½·'+f(p.m2)+'·'+f(q.vz)+'² + ½·'+f(p.m1+p.mp)+'·'+f(q.vl)+'² + ¼·'+f(p.Mr)+'·'+f(q.vz)+'² = '+f(q.Ek)+' J',true));
  else if(D.sc==='doppel') s.push(eq('E<sub>kin</sub> = ½·m<sub>1</sub>·v<sub>1</sub>² + ½·m<sub>2</sub>·v<sub>2</sub>² = ½·'+f(p.m1)+'·'+f(q.v1)+'² + ½·'+f(p.m2)+'·'+f(q.v)+'² = '+f(q.Ek)+' J',true));
  else s.push(eq('E<sub>kin</sub> = ½·m·v² = ½·'+f(p.m)+'·'+f(q.v)+'² = '+f(q.Ek)+' J',true));
  s.push(eq('E = E<sub>pot</sub> + E<sub>kin</sub> = '+f(q.E)+' J, am Start '+f(E0)+' J, ΔE = '+f(q.E-E0)+' J'));
  if(D.sc==='ebene'&&D.sim.ended&&tau>=D.sim.ended.t-1e-9) s.push(eq('Der Block ist unten angekommen und bleibt stehen. Seine restliche Bewegungsenergie geht beim Anhalten verloren.',false,true));
  if(D.sc==='rolle') s.push(eq('Reibungswärme Q = F<sub>R</sub>·(Weg der Zugmasse) = '+f(p.FR)+'·'+f(q.s)+' = '+f(q.Q)+' J; E + Q = '+f(q.E+q.Q)+' J'));
  else if(D.sc==='ebene') s.push(eq('Reibungswärme Q = μ·m·g·cos β·(zurückgelegter Weg) = '+f(p.mu)+'·'+f(p.m)+'·'+f(D.g)+'·cos('+f(p.beta)+'°)·'+f(q.s)+' = '+f(q.Q)+' J; E + Q = '+f(q.E+q.Q)+' J'));
  else if(Math.abs(q.E-E0)>1e-3*(Math.abs(E0)+1)) s.push(eq('Energie geht verloren (Dämpfung, Luftwiderstand oder Aufprall).',false,true));
  return s;
}
function drawPath(tau){
  var p=D.P[D.sc], q=qOf(D.sim,tau), E0=D.sim.q0.E, g=D.g, st=[];
  var tt=f(tau);
  if(SC[D.sc].path){
    $('#dpath').innerHTML=SC[D.sc].path(p,q,tau,E0).join('')+'<p class="small">Alle Grössen in SI-Einheiten. Die Rechnung läuft in kleinen Zeitschritten (Runge-Kutta 4. Ordnung); wo es eine geschlossene Formel gibt, ist sie zum Vergleich angegeben.</p>';
    return;
  }
  if(D.sc==='pend'){
    st.push(step('Bewegungsgleichung',[
      eq('θ″ = −(g/L)·sin θ − c·ω'),
      eq('θ″ = −('+f(g)+'/'+f(p.L)+')·sin θ − '+f(p.c)+'·ω'),
      eq('Nichtlinear: numerisch gelöst (Runge-Kutta, 4. Ordnung).',false,true),
      eq('Start: θ<sub>0</sub> = '+f(p.th0)+'°, ω<sub>0</sub> = '+f(p.w0)+' rad/s')]));
    st.push(step('Zustand bei t = '+tt+' s',[eq('θ = '+f(q.th)+'°, ω = '+f(q.w)+' rad/s',true)]));
    st.push(step('Position',[
      eq('x = L·sin θ = '+f(p.L)+'·sin('+f(q.th)+'°) = '+f(q.x)+' m'),
      eq('y = −L·cos θ = '+f(q.y)+' m (Aufhängung = 0)'),
      eq('h = L·(1 − cos θ) = '+f(p.L)+'·(1 − cos('+f(q.th)+'°)) = '+f(q.h)+' m',true)]));
    st.push(step('Geschwindigkeit',[eq('v = L·|ω| = '+f(p.L)+'·'+f(Math.abs(q.w))+' = '+f(q.v)+' m/s',true)]));
    st.push(step('Beschleunigung',[
      eq('θ″ = −('+f(g)+'/'+f(p.L)+')·sin('+f(q.th)+'°) − '+f(p.c)+'·'+pn(q.w)+' = '+f(q.tdd)+' rad/s²'),
      eq('a<sub>t</sub> = L·θ″ = '+f(p.L)+'·'+pn(q.tdd)+' = '+f(q.at)+' m/s²'),
      eq('a<sub>n</sub> = L·ω² = '+f(p.L)+'·'+f(q.w)+'² = '+f(q.an)+' m/s²'),
      eq('|a| = √(a<sub>t</sub>² + a<sub>n</sub>²) = '+f(q.a)+' m/s²',true)]));
    st.push(step('Energien',energySteps(q,E0,tau)));
    st.push(step('Fadenkraft',[eq('T = m·(g·cos θ + L·ω²) = '+f(p.m)+'·('+f(g)+'·cos('+f(q.th)+'°) + '+f(p.L)+'·'+f(q.w)+'²) = '+f(q.T)+' N',true)]));
    var w0=Math.sqrt(g/p.L), T0=2*Math.PI/w0, cmp=[eq('Periode (kleine Winkel): T<sub>0</sub> = 2π·√(L/g) = 2π·√('+f(p.L)+'/'+f(g)+') = '+f(T0)+' s')];
    if(p.c===0&&p.w0===0) cmp.push(eq('Näherung θ(t) = θ<sub>0</sub>·cos(√(g/L)·t) = '+f(p.th0)+'·cos('+f(w0)+'·'+tt+') = '+f(p.th0*Math.cos(w0*tau))+'° (gilt nur für kleine Startwinkel; genau: '+f(q.th)+'°)',false,true));
    st.push(step('Vergleich mit der Kleinwinkel-Formel',cmp));
  } else if(D.sc==='wurf'){
    var v0x=p.v0*Math.cos(p.al*D2R), v0y=p.v0*Math.sin(p.al*D2R);
    st.push(step('Startwerte',[
      eq('v<sub>0x</sub> = v<sub>0</sub>·cos α = '+f(p.v0)+'·cos('+f(p.al)+'°) = '+f(v0x)+' m/s'),
      eq('v<sub>0y</sub> = v<sub>0</sub>·sin α = '+f(p.v0)+'·sin('+f(p.al)+'°) = '+f(v0y)+' m/s'),
      eq('Starthöhe h<sub>0</sub> = '+f(p.h0)+' m')]));
    if(p.k===0){
      var te=D.sim.ended?Math.min(tau,D.sim.ended.t):tau;
      st.push(step('Bewegung bei t = '+f(te)+' s (ohne Luftwiderstand)',[
        eq('x = v<sub>0x</sub>·t = '+f(v0x)+'·'+f(te)+' = '+f(v0x*te)+' m',true),
        eq('y = h<sub>0</sub> + v<sub>0y</sub>·t − ½·g·t² = '+f(p.h0)+' + '+pn(v0y)+'·'+f(te)+' − ½·'+f(g)+'·'+f(te)+'² = '+f(p.h0+v0y*te-0.5*g*te*te)+' m',true),
        eq('v<sub>x</sub> = v<sub>0x</sub> = '+f(v0x)+' m/s'),
        eq('v<sub>y</sub> = v<sub>0y</sub> − g·t = '+pn(v0y)+' − '+f(g)+'·'+f(te)+' = '+f(v0y-g*te)+' m/s'),
        eq('|v| = √(v<sub>x</sub>² + v<sub>y</sub>²) = '+f(q.v)+' m/s',true),
        eq('a = (0 ; −g) = (0 ; '+f(-g)+') m/s², |a| = '+f(q.a)+' m/s²',true)]));
    } else {
      st.push(step('Bewegung mit Luftwiderstand',[
        eq('a<sub>x</sub> = −k·|v|·v<sub>x</sub>, a<sub>y</sub> = −g − k·|v|·v<sub>y</sub> mit k = '+f(p.k)+' 1/m'),
        eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung).',false,true),
        eq('x = '+f(q.x)+' m, y = '+f(q.y)+' m',true),
        eq('v<sub>x</sub> = '+f(q.vx)+' m/s, v<sub>y</sub> = '+f(q.vy)+' m/s, |v| = '+f(q.v)+' m/s',true),
        eq('a<sub>x</sub> = '+f(q.ax)+' m/s², a<sub>y</sub> = '+f(q.ay)+' m/s², |a| = '+f(q.a)+' m/s²',true)]));
    }
    st.push(step('Energien',energySteps(q,E0,tau)));
    var ws=wurfStats(), wl=[];
    if(p.k===0){
      wl.push(eq('Steigzeit t<sub>S</sub> = v<sub>0y</sub>/g = '+f(v0y)+'/'+f(g)+' = '+f(Math.max(v0y/g,0))+' s'));
      wl.push(eq('Wurfhöhe y<sub>max</sub> = h<sub>0</sub> + v<sub>0y</sub>²/(2·g) = '+f(p.h0)+' + '+f(v0y*v0y)+'/(2·'+f(g)+') = '+f(ws.ymax)+' m'));
      if(p.ground){
        var disc=v0y*v0y+2*g*p.h0, tf=(v0y+Math.sqrt(disc))/g;
        wl.push(eq('Flugzeit: h<sub>0</sub> + v<sub>0y</sub>·t − ½·g·t² = 0 ⇒ t = (v<sub>0y</sub> + √(v<sub>0y</sub>² + 2·g·h<sub>0</sub>))/g = '+f(tf)+' s'));
        wl.push(eq('Wurfweite = v<sub>0x</sub>·t = '+f(v0x)+'·'+f(tf)+' = '+f(v0x*tf)+' m',true));
      }
    } else {
      wl.push(eq('Steigzeit '+f(ws.tApex)+' s, Wurfhöhe '+f(ws.ymax)+' m'+(ws.tLand!==null?', Flugzeit '+f(ws.tLand)+' s, Wurfweite '+f(ws.range)+' m':'')+' (numerisch)'));
    }
    st.push(step('Wurfdaten',wl));
  } else if(D.sc==='feder'){
    var w0f=Math.sqrt(p.k/p.m), yeq=p.l0+p.m*g/p.k;
    st.push(step('Grössen der Feder',[
      eq('Eigenkreisfrequenz ω<sub>0</sub> = √(k/m) = √('+f(p.k)+'/'+f(p.m)+') = '+f(w0f)+' rad/s'),
      eq('Periode T = 2π/ω<sub>0</sub> = '+f(2*Math.PI/w0f)+' s'),
      eq('Ruhelage y<sub>Ruhe</sub> = l<sub>0</sub> + m·g/k = '+f(p.l0)+' + '+f(p.m)+'·'+f(g)+'/'+f(p.k)+' = '+f(yeq)+' m')]));
    st.push(step('Bewegungsgleichung',[
      eq('y″ = g − (k/m)·(y − l<sub>0</sub>) − (c/m)·y′'),
      eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung).',false,true)]));
    var ln=[];
    if(p.c===0) ln.push(eq('Ohne Dämpfung: y(t) = y<sub>Ruhe</sub> + (y<sub>0</sub> − y<sub>Ruhe</sub>)·cos(ω<sub>0</sub>·t) + (v<sub>0</sub>/ω<sub>0</sub>)·sin(ω<sub>0</sub>·t) = '+f(yeq)+' + '+pn(p.y0-yeq)+'·cos('+f(w0f)+'·'+tt+') + '+pn(p.v0/w0f)+'·sin('+f(w0f)+'·'+tt+') = '+f(yeq+(p.y0-yeq)*Math.cos(w0f*tau)+(p.v0/w0f)*Math.sin(w0f*tau))+' m',false,true));
    ln.push(eq('y = '+f(q.d)+' m unter der Aufhängung',true));
    ln.push(eq('v = '+f(-q.vy)+' m/s (nach unten +)',true));
    ln.push(eq('a = g − (k/m)·(y − l<sub>0</sub>) − (c/m)·v = '+f(g)+' − ('+f(p.k)+'/'+f(p.m)+')·('+f(q.d)+' − '+f(p.l0)+') − ('+f(p.c)+'/'+f(p.m)+')·'+pn(-q.vy)+' = '+f(-q.ay)+' m/s²',true));
    ln.push(eq('Federkraft F = k·(y − l<sub>0</sub>) = '+f(p.k)+'·('+f(q.d)+' − '+f(p.l0)+') = '+f(q.Fs)+' N'));
    st.push(step('Zustand bei t = '+tt+' s',ln));
    st.push(step('Energien (Bezug der Lageenergie: Ruhelage)',energySteps(q,E0,tau)));
  } else if(D.sc==='rolle'){
    var ml=p.m1+p.mp, Me=SC.rolle.Me(p), Fa=SC.rolle.F(p), n=p.n;
    st.push(step('Übersetzung',[
      eq('n = '+n+' tragende Seilstücke: Weg, Geschwindigkeit und Beschleunigung der Zugmasse sind n-mal so gross wie bei der Last.'),
      eq('s<sub>2</sub> = n·s<sub>1</sub>, v<sub>2</sub> = n·v<sub>1</sub>, a<sub>2</sub> = n·a<sub>1</sub>'),
      eq('Im Gleichgewicht trägt jedes Seilstück (m<sub>1</sub> + m<sub>p</sub>)·g/n = '+f(ml)+'·'+f(g)+'/'+f(n)+' = '+f(ml*g/n)+' N; Gleichgewicht bei m<sub>2</sub> = (m<sub>1</sub> + m<sub>p</sub>)/n = '+f(ml/n)+' kg',false,true)]));
    st.push(step('Ersatzmasse und Antriebskraft',[
      eq('M<sub>ers</sub> = m<sub>2</sub> + (m<sub>1</sub> + m<sub>p</sub>)/n² + M<sub>r</sub>/2 = '+f(p.m2)+' + '+f(ml)+'/'+f(n*n)+' + '+f(p.Mr)+'/2 = '+f(Me)+' kg'),
      eq('(die feste Rolle ist eine Scheibe mit I = ½·M<sub>r</sub>·r², sie zählt mit M<sub>r</sub>/2)',false,true),
      eq('F = m<sub>2</sub>·g − (m<sub>1</sub> + m<sub>p</sub>)·g/n = '+f(p.m2)+'·'+f(g)+' − '+f(ml)+'·'+f(g)+'/'+f(n)+' = '+f(Fa)+' N',true)]));
    var rl=[];
    if(Math.abs(Fa)<=p.FR&&Math.abs(p.v0)<1e-12) rl.push(eq('|F| = '+f(Math.abs(Fa))+' N ≤ F<sub>R</sub> = '+f(p.FR)+' N: Das System bleibt in Ruhe (Haftung).',true));
    else {
      rl.push(eq('a<sub>2</sub> = (F − F<sub>R</sub>·sgn v)/M<sub>ers</sub> = ('+f(Fa)+' − '+f(p.FR)+')/'+f(Me)+' = '+f((Fa-(Fa>0?1:-1)*p.FR)/Me)+' m/s² (in Bewegungsrichtung der Zugmasse, ohne Richtungswechsel)'));
      rl.push(eq('a<sub>1</sub> = a<sub>2</sub>/n; Weg y(t) = v<sub>0</sub>·t + ½·a<sub>2</sub>·t² bis zum Anschlag (Boden oder Rolle)',false,true));
    }
    st.push(step('Beschleunigung',rl));
    st.push(step('Zustand bei t = '+tt+' s',[
      eq('Zugmasse: Höhe '+f(q.hz)+' m, v = '+f(q.vz)+' m/s, a = '+f(q.az)+' m/s² (abwärts +)',true),
      eq('Last: Höhe '+f(q.hl)+' m, v = '+f(q.vl)+' m/s, a = '+f(q.al)+' m/s² (aufwärts +)',true)]));
    st.push(step('Seilkräfte',[

function springPoly(x1,y1,x2,y2,n,amp){
  var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  var pad=Math.min(10,L*0.15), seg=(L-2*pad)/n, pts=[[x1,y1],[x1+ux*pad,y1+uy*pad]], i;
  for(i=0;i<n;i++){
    var t=pad+seg*(i+0.5), sg=(i%2===0?1:-1);
    pts.push([x1+ux*t+nx*amp*sg,y1+uy*t+ny*amp*sg]);
  }
  pts.push([x2-ux*pad,y2-uy*pad]); pts.push([x2,y2]);
  return pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
}

}

  h+=txt(x0-3,yt+4,f(vmax),'tick','end')+txt(x0-3,yb+3,'0','tick','end')+txt(x0,yb+13,'0','tick')+txt(x0+xw,yb+13,f(xmax)+' '+xlab,'tick','end');
  h+='<polyline fill="none" stroke="var(--mom)" stroke-width="2" stroke-linejoin="round" points="'+xs.map(function(x,j){return X(x).toFixed(1)+','+Y(ys[j]).toFixed(1);}).join(' ')+'"/>';
  h+='<line class="cmark" x1="'+X(mark)+'" y1="'+yt+'" x2="'+X(mark)+'" y2="'+yb+'"/>';

function colOf(ss,fn){return ss.map(fn);}
function eRow(q,E0,items){
  var o=[Gp('Energie')];

}
function damping(p){return p.c/(2*Math.sqrt(p.k*p.m));}
function dampingText(Dg,w0){
  if(Dg<1-1e-9) return 'D = '+f(Dg)+' &lt; 1: schwache Dämpfung (Schwingung), ω<sub>d</sub> = ω<sub>0</sub>·√(1 − D²) = '+f(w0*Math.sqrt(1-Dg*Dg))+' rad/s';
  if(Dg<=1+1e-9) return 'D = 1: aperiodischer Grenzfall (schnellste Rückkehr ohne Schwingung)';
  return 'D = '+f(Dg)+' &gt; 1: Kriechfall (keine Schwingung)';
}
function modeVec(p,l){
  var A=(p.k1+p.k2)/p.m1, B=p.k2/p.m1, C=p.k2/p.m2, Dd=(p.k2+p.k3)/p.m2;
  var u=[B,A-l];
  if(Math.sqrt(u[0]*u[0]+u[1]*u[1])<1e-9) u=[Dd-l,C];
  if(Math.sqrt(u[0]*u[0]+u[1]*u[1])<1e-9) u=[1,0];
  var m=Math.max(Math.abs(u[0]),Math.abs(u[1]));
  return [u[0]/m,u[1]/m];
}
function eigenKoppel(p){
  var A=(p.k1+p.k2)/p.m1, B=p.k2/p.m1, C=p.k2/p.m2, Dd=(p.k2+p.k3)/p.m2;
  var disc=Math.sqrt(Math.pow(A-Dd,2)+4*B*C), l1=((A+Dd)-disc)/2, l2=((A+Dd)+disc)/2;
  return {l1:l1,l2:l2,w1:Math.sqrt(Math.max(l1,0)),w2:Math.sqrt(Math.max(l2,0)),u1:modeVec(p,l1),u2:modeVec(p,l2),A:A,B:B,C:C,D:Dd};
}

/* ---------- 1. Waagerechter Federschwinger mit Reibung ---------- */
SC.hfeder={name:'Federschwinger waagerecht',dt:0.001,
  acc:function(p,x,v){
    var Fs=-p.k*x, N=p.mu*p.m*D.g;
    if(v>0) return (Fs-p.c*v-N)/p.m;
    if(v<0) return (Fs-p.c*v+N)/p.m;
    if(Math.abs(Fs)<=N+1e-12) return 0;
    return (Fs-(Fs>0?1:-1)*N)/p.m;
  },
  init:function(p){return [p.x0,p.v0,0];},
  deriv:function(p,t,y){return [y[1],SC.hfeder.acc(p,y[0],y[1]),p.c*y[1]*y[1]+p.mu*p.m*D.g*Math.abs(y[1])];},
  zeroV:1, zeroOn:function(p){return p.mu>0;},
  q:function(p,y){

    h+=ruler(xeq,fy,V.s,V.range)+handle(gx,cy,'hfeder:x0');

  drag:function(key,pt,V){if(key==='hfeder:x0'&&V) D.P.hfeder.x0=Math.round(((pt.x-190)/V.s)*100)/100;},
  rows:function(p,q,E0,dE){
    var o=[Gp('Position'),R('Auslenkung x aus der Ruhelage',q.x,'m',1),Gp('Geschwindigkeit'),R('v',q.vx,'m/s',1),Gp('Beschleunigung'),R('a',q.ax,'m/s²',1),
      Gp('Kräfte'),R('Federkraft F = −k·x',q.Fs,'N'),R('Gleitreibkraft μ·m·g',p.mu*p.m*D.g,'N')];
    return o.concat(eRow(q,E0,[['Federenergie ½·k·x²',q.Ep,1],['E<sub>kin</sub>',q.Ek,1],['E = Feder + kin',q.E],['Wärme Q (Dämpfung, Reibung)',q.Q],['E + Q (bleibt konstant)',q.E+q.Q]]));
  },
  path:function(p,q,tau,E0){
    var w0=Math.sqrt(p.k/p.m), Dg=damping(p), N=p.mu*p.m*D.g, tt=f(tau), st=[];
    st.push(step('Die Feder',[

      eq('E = '+f(q.E)+' J, am Start '+f(E0)+' J; Wärme Q = '+f(q.Q)+' J; E + Q = '+f(q.E+q.Q)+' J')]));

  }};

    st.push(step('Eigenschwingungen (Moden)',ml));

      eq('Masse 1: x<sub>1</sub> = '+f(q.x1)+' m, v<sub>1</sub> = '+f(q.v1)+' m/s, a<sub>1</sub> = '+f(q.acc1)+' m/s²',true),

/* ---------- 3. Erzwungene Schwingung / Resonanz ---------- */
function steadyErz(p){
  var Om=2*Math.PI*p.f, w0=Math.sqrt(p.k/p.m), den=Math.sqrt(Math.pow(p.k-p.m*Om*Om,2)+Math.pow(p.c*Om,2));
  var Dg=damping(p), o={Om:Om,w0:w0,den:den,A:den>1e-12?p.F0/den:Infinity,phi:Math.atan2(p.c*Om,p.k-p.m*Om*Om)/D2R,Dg:Dg};
  o.res=(2*Dg*Dg<1)?w0*Math.sqrt(1-2*Dg*Dg):null;
  o.Amax=(Dg>0&&Dg<Math.SQRT1_2)?p.F0/(2*p.k*Dg*Math.sqrt(1-Dg*Dg)):null;
  return o;
}
SC.erz={name:'Erzwungene Schwingung',dt:0.003,noG:true,
  init:function(p){return [p.x0,p.v0,0,0];},
  deriv:function(p,t,y){var F=p.F0*Math.cos(2*Math.PI*p.f*t); return [y[1],(-p.k*y[0]-p.c*y[1]+F)/p.m,p.c*y[1]*y[1],F*y[1]];},
  q:function(p,y,t){

/* ---------- 4. Federkanone ---------- */
SC.kanone={name:'Federkanone',dt:0.004,
  prep:function(p){p.v0=p.s*Math.sqrt(Math.max(0,p.eta)*p.ks/p.m);},

  event:function(p,y){return p.ground?y[1]:1;},
  finish:function(p,y){return [y[0],0,0,0];},
  q:function(p,y){
    var v=Math.sqrt(y[2]*y[2]+y[3]*y[3]), g=D.g, rest=p.ground&&y[1]<=1e-9&&v<1e-12;
    return {x:y[0],y:y[1],vx:y[2],vy:y[3],ax:rest?0:-p.kd*v*y[2],ay:rest?0:-g-p.kd*v*y[3],Ep:p.m*g*y[1],Ek:0.5*p.m*v*v};
  },
  draw:function(tau){return drawWurf(tau,'kanone');},

      var sx0=V.ox+(0-V.xmin)*V.s, sy0=V.top+(V.ymax-p.h0)*V.s, dx=pt.x-sx0, dy=sy0-pt.y, len=Math.sqrt(dx*dx+dy*dy);
      if(len<4) return;
      p.al=clamp(Math.round(Math.atan2(dy,dx)/D2R),-90,90);
      var v0=len<=10?0:Math.min(300,Math.pow((len-10)/7,2));
      p.s=Math.max(0,Math.round(v0/Math.sqrt(Math.max(p.eta,1e-6)*p.ks/p.m)*1000)/1000);
    }
  },
  rows:function(p,q,E0,dE){
    var st=wurfStats(), o=[Gp('Position'),R('x',q.x,'m',1),R('y (Höhe)',q.y,'m',1),Gp('Geschwindigkeit'),R('v<sub>x</sub>',q.vx,'m/s'),R('v<sub>y</sub>',q.vy,'m/s'),R('|v|',q.v,'m/s',1),
      Gp('Beschleunigung'),R('a<sub>x</sub>',q.ax,'m/s²'),R('a<sub>y</sub>',q.ay,'m/s²'),R('|a|',q.a,'m/s²',1)];
    o=o.concat(eRow(q,E0,[['E<sub>pot</sub> (Lage)',q.Ep,1],['E<sub>kin</sub> (Bewegung)',q.Ek,1],['E = E<sub>pot</sub> + E<sub>kin</sub>',q.E],['Änderung ΔE seit dem Abschuss',dE]]));
    o.push(Gp('Abschuss'),R('Federenergie am Start ½·k·s²',0.5*p.ks*p.s*p.s,'J'),R('Abschussgeschwindigkeit v<sub>0</sub>',p.v0,'m/s'),Gp('Wurfdaten'),R('Steigzeit',st.tApex,'s'),R('Wurfhöhe (max. y)',st.ymax,'m'));
    if(st.tLand!==null) o.push(R('Flugzeit bis Aufprall',st.tLand,'s'),R('Wurfweite',st.range,'m'));

  path:function(p,q,tau,E0){
    var g=D.g, EF=0.5*p.ks*p.s*p.s, st=[], tt=f(tau), v0x=p.v0*Math.cos(p.al*D2R), v0y=p.v0*Math.sin(p.al*D2R), ws=wurfStats();
    st.push(step('Federenergie wird zu Bewegungsenergie',[
      eq('E<sub>Feder</sub> = ½·k·s² = ½·'+f(p.ks)+'·'+f(p.s)+'² = '+f(EF)+' J'),
      eq('Nur der Anteil η = '+f(p.eta)+' wird zu Bewegung: E<sub>kin,0</sub> = η·E<sub>Feder</sub> = '+f(p.eta*EF)+' J'),

        eq('v<sub>y</sub> = v<sub>0y</sub> − g·t = '+f(v0y-g*te)+' m/s, |v| = '+f(q.v)+' m/s',true),

      var wl=[eq('Steigzeit t<sub>S</sub> = v<sub>0y</sub>/g = '+f(Math.max(v0y/g,0))+' s, Wurfhöhe y<sub>max</sub> = h<sub>0</sub> + v<sub>0y</sub>²/(2·g) = '+f(ws.ymax)+' m')];

  charts:function(col,tmax,tau,ss,C){

/* ---------- 5. Elastisches Pendel ---------- */

    p.th0=clamp(Math.round(Math.atan2(dx,dy)/D2R),-179,179);
    p.r0=Math.max(0.05,Math.round(Math.sqrt(dx*dx+dy*dy)/V.s*100)/100);
  },
  rows:function(p,q,E0,dE){
    var o=[Gp('Position'),R('Länge der Feder r',q.r,'m',1),R('Winkel θ',((q.th+180)%360+360)%360-180,'°',1),R('x',q.x,'m'),R('y (unter der Aufhängung −)',q.y,'m'),
      Gp('Geschwindigkeit'),R('radial v<sub>r</sub>',q.vr,'m/s'),R('|v|',q.v,'m/s',1),
      Gp('Beschleunigung'),R('radial a<sub>r</sub>',q.ar,'m/s²'),R('tangential a<sub>t</sub>',q.at,'m/s²'),R('|a|',q.a,'m/s²',1),
      Gp('Kraft'),R('Federkraft k·(r − l<sub>0</sub>)',q.Fs,'N')];
    return o.concat(eRow(q,E0,[['E<sub>pot,Schwere</sub> (Bezug: Ruhelage)',q.Epg],['E<sub>pot,Feder</sub> ½·k·Δl²',q.Eps],['E<sub>kin</sub>',q.Ek,1],['E gesamt',q.E,1],['Wärme Q (Dämpfung)',q.Q],['E + Q',q.E+q.Q]]));
  },
  path:function(p,q,tau,E0){
    var g=D.g, leq=p.l0+p.m*g/p.k, wf=Math.sqrt(p.k/p.m), wp=Math.sqrt(g/leq), st=[], tt=f(tau);
    st.push(step('Zwei Schwingungen in einem System',[
      eq('Ruhelänge l<sub>Ruhe</sub> = l<sub>0</sub> + m·g/k = '+f(p.l0)+' + '+f(p.m)+'·'+f(g)+'/'+f(p.k)+' = '+f(leq)+' m'),
      eq('Federschwingung: ω<sub>F</sub> = √(k/m) = '+f(wf)+' rad/s (T = '+f(2*Math.PI/wf)+' s)'),
      eq('Pendelschwingung: ω<sub>P</sub> = √(g/l<sub>Ruhe</sub>) = '+f(wp)+' rad/s (T = '+f(2*Math.PI/wp)+' s)'),
      eq('Verhältnis ω<sub>F</sub>/ω<sub>P</sub> = '+f(wf/wp)+(Math.abs(wf/wp-2)<0.15?' ≈ 2: Resonanz! Die Energie wandert zwischen Feder- und Pendelschwingung hin und her.':''),Math.abs(wf/wp-2)<0.15,Math.abs(wf/wp-2)>=0.15)]));
    st.push(step('Bewegungsgleichungen (Polarkoordinaten r, θ)',[
      eq('r″ = r·θ′² + g·cos θ − (k/m)·(r − l<sub>0</sub>) − (c/m)·r′'),
      eq('θ″ = −(2·r′/r)·θ′ − (g/r)·sin θ − (c/m)·θ′'),
      eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung). Gekoppelt und nichtlinear, bei höherer Energie chaotisch.',false,true)]));
    st.push(step('Zustand bei t = '+tt+' s',[
      eq('r = '+f(q.r)+' m, θ = '+f(q.th)+'°, r′ = '+f(q.vr)+' m/s, θ′ = '+f(q.w)+' rad/s',true),
      eq('x = r·sin θ = '+f(q.x)+' m, y = −r·cos θ = '+f(q.y)+' m')]));
    st.push(step('Geschwindigkeit und Beschleunigung',[
      eq('v<sub>x</sub> = r′·sin θ + r·θ′·cos θ = '+f(q.vx)+' m/s, v<sub>y</sub> = −r′·cos θ + r·θ′·sin θ = '+f(q.vy)+' m/s, |v| = '+f(q.v)+' m/s',true),
      eq('a<sub>r</sub> = r″ − r·θ′² = '+f(q.ar)+' m/s², a<sub>t</sub> = r·θ″ + 2·r′·θ′ = '+f(q.at)+' m/s²'),
      eq('|a| = √(a<sub>r</sub>² + a<sub>t</sub>²) = '+f(q.a)+' m/s²',true)]));
    st.push(step('Energien (Lageenergie der Schwere mit Bezug auf die Ruhelage)',[
      eq('E<sub>Schwere</sub> = m·g·(y − y<sub>Ruhe</sub>) = '+f(p.m)+'·'+f(g)+'·('+f(q.y)+' + '+f(leq)+') = '+f(q.Epg)+' J'),
      eq('E<sub>Feder</sub> = ½·k·(r − l<sub>0</sub>)² = ½·'+f(p.k)+'·('+f(q.r)+' − '+f(p.l0)+')² = '+f(q.Eps)+' J'),
      eq('E<sub>kin</sub> = ½·m·(r′² + (r·θ′)²) = '+f(q.Ek)+' J',true),
      eq('E = '+f(q.E)+' J, am Start '+f(E0)+' J; Wärme Q = '+f(q.Q)+' J; E + Q = '+f(q.E+q.Q)+' J')]));
    return st;
  },

SC.schalt={name:'Federschaltung',dt:0.004,
  prep:function(p){p.mode=p.mode>=0.5?1:0;},
  ke:function(p){return p.mode===1?p.k1*p.k2/(p.k1+p.k2):p.k1+p.k2;},
  le:function(p){return p.mode===1?2*p.l0:p.l0;},
  acc:function(p,y){return D.g-(SC.schalt.ke(p)/p.m)*(y[0]-SC.schalt.le(p))-(p.c/p.m)*y[1];},
  init:function(p){return [p.y0,p.v0];},
  deriv:function(p,t,y){return [y[1],SC.schalt.acc(p,y)];},
  q:function(p,y){
    var ke=SC.schalt.ke(p), le=SC.schalt.le(p), a=SC.schalt.acc(p,y), g=D.g, ext=y[0]-le, yeq=le+p.m*g/ke;
    var F1,F2,e1,e2;
    if(p.mode===1){F1=F2=ke*ext; e1=F1/p.k1; e2=F2/p.k2;} else {e1=e2=ext; F1=p.k1*ext; F2=p.k2*ext;}
    var Epg=p.m*g*(yeq-y[0]), E1=0.5*p.k1*e1*e1, E2=0.5*p.k2*e2*e2;
    return {x:0,y:-y[0],vx:0,vy:-y[1],ax:0,ay:-a,Ep:Epg+E1+E2,Epg:Epg,E1:E1,E2:E2,Ek:0.5*p.m*y[1]*y[1],
      d:y[0],disp:y[0]-yeq,yeq:yeq,ke:ke,le:le,ext:ext,F1:F1,F2:F2,e1:e1,e2:e2};
  },
  view:function(tv){
    var p=D.P.schalt, ke=SC.schalt.ke(p), ymax=Math.max(p.y0,SC.schalt.le(p),SC.schalt.le(p)+p.m*D.g/ke), j, q;
    for(j=0;j<=100;j++){q=qOf(D.sim,tv*j/100); ymax=Math.max(ymax,q.d);}
    ymax=Math.max(ymax,0.1)*1.1;
    return {s:Math.min(220/ymax,400)};
  },
  presets:[
    {label:'Parallel',apply:function(p){p.mode=0;}},
    {label:'In Reihe',apply:function(p){p.mode=1;}}
  ],
  draw:function(tau){
    var p=D.P.schalt, V=D.lock||D.view, qq=qOf(D.sim,tau), h='', i, py=34, r=clamp(10+4*Math.sqrt(p.m),12,26);

    for(i=116;i<=250;i+=10) h+='<line class="pt" x1="'+i+'" y1="'+py+'" x2="'+(i-6)+'" y2="'+(py-7)+'"/>';
    h+='<line class="guide" x1="110" y1="'+Y(qq.yeq)+'" x2="290" y2="'+Y(qq.yeq)+'"/>'+txt(292,Y(qq.yeq)+3,'Ruhelage','tick','start');
    var cy=Y(qq.d), top=cy-r*0.7;
    h+='<rect class="bobg" x="'+(180-r)+'" y="'+(Y(p.y0)-r*0.7)+'" width="'+(2*r)+'" height="'+(1.4*r)+'" rx="3"/>';
    if(p.mode===0){
      h+='<polyline class="spr" points="'+springPoly(160,py,160,top,10,8)+'"/>'+'<polyline class="spr" stroke="var(--force)" points="'+springPoly(200,py,200,top,10,8)+'"/>';
      h+='<line class="rod" x1="160" y1="'+top+'" x2="200" y2="'+top+'"/>'+txt(140,py+(top-py)/2,'k₁','tick','end')+txt(222,py+(top-py)/2,'k₂','tick','start');
    } else {

      h+='<circle cx="180" cy="'+mid+'" r="3.5" fill="var(--beam)"/>'+txt(160,py+(mid-py)/2+3,'k₁','tick','end')+txt(160,mid+(top-mid)/2+3,'k₂','tick','end');
    }

    h+=vecArrows(180+r+14,cy,{v:qq.v,vx:0,vy:qq.vy,a:qq.a,ax:0,ay:qq.ay},45/Math.max(D.vmax,1e-9),45/Math.max(D.amax,1e-9));

  drag:function(key,pt,V){if(key==='schalt:y0'&&V) D.P.schalt.y0=Math.max(0,Math.round(((pt.y-34)/V.s)*100)/100);},
  rows:function(p,q,E0,dE){
    var o=[Gp('Ersatzfeder'),R('Ersatzfederkonstante k<sub>ers</sub>',q.ke,'N/m',1),R('Länge ohne Last',q.le,'m'),
      Gp('Position'),R('Abstand unter der Aufhängung',q.d,'m',1),R('Ruhelage',q.yeq,'m'),R('Auslenkung aus der Ruhelage',q.disp,'m'),
      Gp('Geschwindigkeit'),R('v (abwärts +)',-q.vy,'m/s',1),Gp('Beschleunigung'),R('a (abwärts +)',-q.ay,'m/s²',1),
      Gp('Die beiden Federn'),R('Kraft in Feder 1',q.F1,'N'),R('Kraft in Feder 2',q.F2,'N'),R('Dehnung Feder 1',q.e1,'m'),R('Dehnung Feder 2',q.e2,'m')];
    return o.concat(eRow(q,E0,[['E<sub>Schwere</sub> (Bezug: Ruhelage)',q.Epg],['E<sub>Feder 1</sub>',q.E1],['E<sub>Feder 2</sub>',q.E2],['E<sub>kin</sub>',q.Ek,1],['E gesamt',q.E,1],['Änderung ΔE',dE]]));

  path:function(p,q,tau,E0){
    var g=D.g, ke=q.ke, le=q.le, w0=Math.sqrt(ke/p.m), st=[], tt=f(tau), Dg=p.c/(2*Math.sqrt(ke*p.m));

    } else {
      kl.push(eq('In Reihe: beide Federn tragen dieselbe Kraft, die Dehnungen addieren sich.'));
      kl.push(eq('1/k<sub>ers</sub> = 1/k<sub>1</sub> + 1/k<sub>2</sub> = 1/'+f(p.k1)+' + 1/'+f(p.k2)+' ⇒ k<sub>ers</sub> = k<sub>1</sub>·k<sub>2</sub>/(k<sub>1</sub> + k<sub>2</sub>) = '+f(ke)+' N/m',true));
      kl.push(eq('Länge ohne Last: 2·l<sub>0</sub> = '+f(le)+' m',false,true));
    }
    st.push(step('Ersatzfeder',kl));
    st.push(step('Schwingung',[
      eq('ω<sub>0</sub> = √(k<sub>ers</sub>/m) = √('+f(ke)+'/'+f(p.m)+') = '+f(w0)+' rad/s, T = 2π/ω<sub>0</sub> = '+f(2*Math.PI/w0)+' s, f = '+f(w0/(2*Math.PI))+' Hz'),
      eq('Ruhelage y<sub>Ruhe</sub> = l<sub>ers</sub> + m·g/k<sub>ers</sub> = '+f(le)+' + '+f(p.m)+'·'+f(g)+'/'+f(ke)+' = '+f(q.yeq)+' m'),
      eq('Dämpfungsgrad D = '+f(Dg),false,true),
      eq('Numerisch gelöst: m·y″ = m·g − k<sub>ers</sub>·(y − l<sub>ers</sub>) − c·y′ (Runge-Kutta, 4. Ordnung).',false,true)]));
    st.push(step('Zustand bei t = '+tt+' s',[
      eq('y = '+f(q.d)+' m, v = '+f(-q.vy)+' m/s, a = '+f(-q.ay)+' m/s² (abwärts +)',true),
      eq('Gesamtdehnung = y − l<sub>ers</sub> = '+f(q.ext)+' m')]));
    var fl=[];
    if(p.mode===0){
      fl.push(eq('F<sub>1</sub> = k<sub>1</sub>·Δl = '+f(p.k1)+'·'+f(q.ext)+' = '+f(q.F1)+' N, F<sub>2</sub> = k<sub>2</sub>·Δl = '+f(q.F2)+' N'));

function phaseSvg(title,xl,yl,line,dots,cur){
  var all=line.concat(dots), x0=1e9,x1=-1e9,y0=1e9,y1=-1e9, L=40,R=330,T=24,B=172;
  all.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
  x0=Math.min(x0,0);x1=Math.max(x1,0);y0=Math.min(y0,0);y1=Math.max(y1,0);
  var px=(x1-x0)*0.06+1e-9, py=(y1-y0)*0.06+1e-9; x0-=px;x1+=px;y0-=py;y1+=py;
  function X(v){return L+(v-x0)/(x1-x0)*(R-L);}
  function Y(v){return B-(v-y0)/(y1-y0)*(B-T);}
  var h='<svg viewBox="0 0 360 190" role="img" aria-label="'+title+'">';
  h+='<rect x="'+L+'" y="'+T+'" width="'+(R-L)+'" height="'+(B-T)+'" fill="none" stroke="var(--line)"/>';
  h+='<line class="cgrid" x1="'+X(0)+'" y1="'+T+'" x2="'+X(0)+'" y2="'+B+'"/><line class="cgrid" x1="'+L+'" y1="'+Y(0)+'" x2="'+R+'" y2="'+Y(0)+'"/>';
  h+=txt(L,B+13,f(x0),'tick','start')+txt(R,B+13,f(x1)+' '+xl,'tick','end')+txt(L-3,T+4,f(y1),'tick','end')+txt(L-3,B,f(y0),'tick','end');
  if(line.length) h+='<polyline fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".85" stroke-linejoin="round" points="'+line.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1);}).join(' ')+'"/>';
  dots.forEach(function(q){h+='<circle cx="'+X(q[0]).toFixed(1)+'" cy="'+Y(q[1]).toFixed(1)+'" r="1.5" fill="var(--force)"/>';});
  if(cur) h+='<circle cx="'+X(cur[0])+'" cy="'+Y(cur[1])+'" r="4.5" fill="var(--react)" stroke="var(--panel)" stroke-width="1.5"/>';
  h+='<text class="ctitle" x="'+L+'" y="14">'+title+' ('+yl+' über '+xl+')</text>';
  return h+'</svg>';
}

/* ---------- Katapult ---------- */
SC.katapult={name:'Katapult',dtOf:function(p){return 0.002;},full:true,
  prep:function(p){p.rel=p.rel>=0.5?1:0; if(p.ls<=1e-9){p.ls=0; p.psi0=0;}},
  I:function(p){return p.Marm*(Math.pow(p.a,3)+Math.pow(p.b,3))/(3*(p.a+p.b))+p.Mc*p.a*p.a+p.m*p.b*p.b;},
  acc:function(p,y){
    var g=D.g, phi=y[0], psi=y[1], w=y[2], u=y[3], a=p.a, b=p.b, ls=p.ls, m=p.m, It=SC.katapult.I(p);
    var K=-p.Mc*a+m*b+p.Marm*(b-a)/2, Q=-p.kappa*(phi-p.phif*D2R);
    if(ls<=1e-9){var q0=(Q-g*K*Math.cos(phi))/It; return [q0,q0];}
    var d=phi-psi, cd=Math.cos(d), sd=Math.sin(d);
    var r1=Q-m*b*ls*sd*u*u-g*K*Math.cos(phi), r2=b*w*w*sd-g*Math.cos(psi);
    var det=It*ls-m*b*ls*cd*b*cd;
    return [(r1*ls-m*b*ls*cd*r2)/det,(It*r2-b*cd*r1)/det];
  },
  P:function(p,y){
    var phi=y[0], psi=y[1], w=y[2], u=y[3], b=p.b, ls=p.ls, ac=SC.katapult.acc(p,y), cp=Math.cos(phi), sp=Math.sin(phi), cs=Math.cos(psi), ss=Math.sin(psi);
    return {pos:[b*cp+ls*cs,p.H+b*sp+ls*ss],v:[-b*w*sp-ls*u*ss,b*w*cp+ls*u*cs],
      a:[-b*ac[0]*sp-b*w*w*cp-ls*ac[1]*ss-ls*u*u*cs,b*ac[0]*cp-b*w*w*sp+ls*ac[1]*cs-ls*u*u*ss],ac:ac};
  },
  init:function(p){var f0=p.phi0*D2R; return [f0,f0+p.psi0*D2R,0,0,0,0,0,0,0];},
  deriv:function(p,t,y){
    if(y[8]>0.5){var v=Math.sqrt(y[6]*y[6]+y[7]*y[7]); return [0,0,0,0,y[6],y[7],-p.kd*v*y[6],-D.g-p.kd*v*y[7],0];}
    var a=SC.katapult.acc(p,y);
    return [y[2],(p.ls<=1e-9?y[2]:y[3]),a[0],a[1],0,0,0,0,0];
  },
  event:function(p,y){
    if(y[8]>0.5) return y[5];
    if(p.rel===1) return y[0]-p.phst*D2R;
    var G=SC.katapult.P(p,y), vx=G.v[0], vy=G.v[1];
    if(vx<=1e-9) return 1e3;
    if(p.ls>0&&y[0]>Math.PI/2) return 1e3;
    return Math.atan2(vy,vx)/D2R-p.arel;
  },
  finish:function(p,y){
    if(y[8]>0.5) return [y[0],y[1],0,0,y[4],0,0,0,1];
    var G=SC.katapult.P(p,y);
    return [y[0],y[1],y[2],y[3],G.pos[0],G.pos[1],G.v[0],G.v[1],1];
  },
  cont:function(p,y0){return y0[8]<0.5;},
  q:function(p,y){
    var g=D.g, H=p.H;
    if(y[8]>0.5){
      var v=Math.sqrt(y[6]*y[6]+y[7]*y[7]), rest=y[5]<=1e-9&&v<1e-12;
      return {x:y[4],y:y[5],vx:y[6],vy:y[7],ax:rest?0:-p.kd*v*y[6],ay:rest?0:-g-p.kd*v*y[7],Ep:p.m*g*y[5],Ek:0.5*p.m*v*v,ph:1,phi:y[0]/D2R,w:0,psi:y[1]/D2R};
    }
    var G=SC.katapult.P(p,y), phi=y[0], psi=y[1], w=y[2], u=y[3], It=SC.katapult.I(p);
    var T=0.5*It*w*w+0.5*p.m*p.ls*p.ls*u*u+p.m*p.b*p.ls*w*u*Math.cos(phi-psi);
    var U=g*(p.Mc*(H-p.a*Math.sin(phi))+p.m*G.pos[1]+p.Marm*(H+(p.b-p.a)/2*Math.sin(phi)))+0.5*p.kappa*Math.pow(phi-p.phif*D2R,2);
    return {x:G.pos[0],y:G.pos[1],vx:G.v[0],vy:G.v[1],ax:G.a[0],ay:G.a[1],Ep:U,Ek:T,ph:0,phi:phi/D2R,w:w,psi:(psi-phi)/D2R};
  },
  view:function(tv){
    var p=D.P.katapult, x0=-p.a-1,x1=p.b+1,y0=0,y1=p.H+p.b, j, y, G, t;
    for(j=0;j<=160;j++){
      t=tv*j/160; y=stateAt(D.sim,t);
      if(y[8]>0.5){x0=Math.min(x0,y[4]);x1=Math.max(x1,y[4]);y0=Math.min(y0,y[5]);y1=Math.max(y1,y[5]);}
      else {
        G=SC.katapult.P(p,y); x0=Math.min(x0,G.pos[0],-p.a*Math.cos(y[0])); x1=Math.max(x1,G.pos[0],-p.a*Math.cos(y[0]));
        y0=Math.min(y0,G.pos[1]); y1=Math.max(y1,G.pos[1],p.H+p.b*Math.sin(y[0]));
      }
    }
    var wx=Math.max(x1-x0,1), wy=Math.max(y1-y0,1), sc=Math.min(290/wx,185/wy);
    return {s:sc,ox:35+(290-wx*sc)/2,xmin:x0,top:240-wy*sc,ymax:y1,ymin:y0,wx:wx,wy:wy};
  },
  presets:[
    {label:'Trebuchet (Schleuder)',apply:function(p){Object.assign(p,{a:1.2,b:4.5,Marm:20,Mc:250,m:10,ls:3.0,phi0:230,psi0:0,kappa:0,phif:40,rel:0,arel:42,phst:100,H:6,kd:0});}},
    {label:'Wippkatapult (fester Löffel)',apply:function(p){Object.assign(p,{a:1.2,b:4.5,Marm:15,Mc:200,m:5,ls:0,phi0:215,psi0:0,kappa:0,phif:40,rel:0,arel:45,phst:100,H:4.5,kd:0});}},
    {label:'Torsionskatapult (Mangonel)',apply:function(p){Object.assign(p,{a:0.3,b:2.5,Marm:15,Mc:0,m:3,ls:0,phi0:215,psi0:0,kappa:600,phif:60,rel:1,arel:45,phst:135,H:2,kd:0});}},
    {label:'Schleuder 1,5 m (kurz)',apply:function(p){p.ls=1.5;}}
  ],
  draw:function(tau){
    var p=D.P.katapult, V=D.lock||D.view, h='', i, j, y=stateAt(D.sim,tau), ph1=y[8]>0.5;
    function X(x){return V.ox+(x-V.xmin)*V.s;}
    function Y(yy){return V.top+(V.ymax-yy)*V.s;}
    var sx=niceStep(V.wx,5), sy=niceStep(V.wy,4), xa=Math.ceil(V.xmin/sx-1e-9)*sx, ya=Math.ceil(V.ymin/sy-1e-9)*sy;
    for(i=xa;i<=V.xmin+V.wx+1e-9;i+=sx) h+='<line class="cgrid" x1="'+X(i)+'" y1="'+Y(V.ymax)+'" x2="'+X(i)+'" y2="'+Y(V.ymin)+'"/>'+txt(X(i),Y(V.ymin)+13,f(i),'tick');
    for(i=ya;i<=V.ymax+1e-9;i+=sy) h+='<line class="cgrid" x1="'+X(V.xmin)+'" y1="'+Y(i)+'" x2="'+X(V.xmin+V.wx)+'" y2="'+Y(i)+'"/>'+txt(X(V.xmin)-4,Y(i)+3,f(i),'tick','end');
    h+='<line class="axis" stroke-width="2" x1="'+X(V.xmin)+'" y1="'+Y(0)+'" x2="'+X(V.xmin+V.wx)+'" y2="'+Y(0)+'"/>';
    h+='<line class="pt" stroke-width="4" x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(0)+'" y2="'+Y(p.H)+'"/>';
    var tview=D.sim.ended?D.sim.ended.t:D.t, tw=Math.min(tau,tview), N=200, g1=[], t1=[], q;
    for(j=0;j<=N;j++){q=qOf(D.sim,tview*j/N); g1.push(X(q.x)+','+Y(q.y));}
    for(j=0;j<=N;j++){q=qOf(D.sim,tw*j/N); t1.push(X(q.x)+','+Y(q.y));}
    h+='<polyline class="trg" points="'+g1.join(' ')+'"/><polyline class="tr" points="'+t1.join(' ')+'"/>';
    function mech(yy,cls,dash){
      var c=Math.cos(yy[0]), s=Math.sin(yy[0]), tip=[p.b*c,p.H+p.b*s], cw=[-p.a*c,p.H-p.a*s], pr=[tip[0]+p.ls*Math.cos(yy[1]),tip[1]+p.ls*Math.sin(yy[1])];
      var o='<line class="'+cls+'" '+(dash?'stroke-dasharray="4 4" opacity=".5" ':'')+'x1="'+X(cw[0])+'" y1="'+Y(cw[1])+'" x2="'+X(tip[0])+'" y2="'+Y(tip[1])+'"/>';
      if(p.ls>0) o+='<line class="'+cls+'" stroke-width="1.5" '+(dash?'stroke-dasharray="3 3" opacity=".5" ':'')+'x1="'+X(tip[0])+'" y1="'+Y(tip[1])+'" x2="'+X(pr[0])+'" y2="'+Y(pr[1])+'"/>';
      return {svg:o,tip:tip,cw:cw,pr:pr};
    }
    var y0=SC.katapult.init(p), g0=mech(y0,'rod',true);
    h+=g0.svg;
    var cur=mech(y,ph1?'pt':'rod',false);
    h+=cur.svg;
    var cws=clamp(8+3*Math.sqrt(p.Mc),9,26);
    if(p.Mc>0) h+='<rect class="blk" fill="var(--mom)" x="'+(X(cur.cw[0])-cws/2)+'" y="'+(Y(cur.cw[1])-cws/2)+'" width="'+cws+'" height="'+cws+'" rx="2"/>';
    h+='<circle cx="'+X(0)+'" cy="'+Y(p.H)+'" r="4" fill="var(--beam)"/>';
    var qq=qOf(D.sim,tau), pr=clamp(4+1.5*Math.sqrt(p.m),5,11);
    h+='<circle class="bob" cx="'+X(qq.x)+'" cy="'+Y(qq.y)+'" r="'+pr+'"/>';
    if(qq.v>1e-9) h+=arrow(X(qq.x),Y(qq.y),X(qq.x)+qq.vx/qq.v*Math.min(40,qq.v*1.5),Y(qq.y)-qq.vy/qq.v*Math.min(40,qq.v*1.5),'ra',7);
    var ev=D.sim.events[0];
    if(ev&&tau>=ev.t){var e1=ev.after; h+=lbl(X(e1[4]),Y(e1[5])-12,'Abwurf','g');}
    if(D.sim.ended) h+=lbl(X(D.sim.ended.y[4]),Y(0)-8,'Aufprall','g');
    h+=handle(g0.tip[0]*0+X(g0.tip[0]),Y(g0.tip[1]),'katapult:phi0');
    h+=txt(40,292,'grün: Geschwindigkeit · gestrichelt: Startstellung','tick','start');
    return h;
  },
  drag:function(key,pt,V){
    if(key!=='katapult:phi0'||!V) return;
    var p=D.P.katapult, px=V.ox+(0-V.xmin)*V.s, py=V.top+(V.ymax-p.H)*V.s;
    var ang=Math.atan2(py-pt.y,pt.x-px)/D2R; if(ang<0) ang+=360;
    p.phi0=clamp(Math.round(ang),100,260);
  },
  stats:function(){
    var sim=D.full, p=D.P.katapult, ev=sim.events[0], o={rel:null};
    if(ev){var qr=SC.katapult.q(p,ev.after); o.rel={t:ev.t,x:qr.x,y:qr.y,v:Math.sqrt(qr.vx*qr.vx+qr.vy*qr.vy),ang:Math.atan2(qr.vy,qr.vx)/D2R,Ek:qr.Ek};}
    o.tLand=sim.ended?sim.ended.t:null; o.range=sim.ended?sim.ended.y[4]:null;
    var best=0,i; for(i=0;i<sim.ys.length;i++) if(sim.ys[i][8]>0.5&&sim.ys[i][5]>(sim.ys[best][8]>0.5?sim.ys[best][5]:-1e9)) best=i;
    o.ymax=sim.ys[best][8]>0.5?sim.ys[best][5]:null;
    return o;
  },
  rows:function(p,q,E0,dE){
    var st=SC.katapult.stats(), o=[Gp('Geschoss'),R('x',q.x,'m',1),R('y (Höhe)',q.y,'m',1),R('v<sub>x</sub>',q.vx,'m/s'),R('v<sub>y</sub>',q.vy,'m/s'),R('|v|',q.v,'m/s',1),R('|a|',q.a,'m/s²',1)];
    o.push(Gp('Mechanik'),R('Armwinkel φ',q.phi,'°'),R('Winkelgeschwindigkeit des Arms ω',q.w,'rad/s'));
    if(p.ls>0) o.push(R('Schleuder relativ zum Arm',q.psi,'°'));
    o=o.concat(eRow(q,E0,[['E<sub>pot</sub> (Lage, Feder)',q.Ep,1],['E<sub>kin</sub>',q.Ek,1],['E gesamt',q.E],['Änderung ΔE seit dem Start',dE]]));
    if(q.ph===1) o.push(R('(nach dem Abwurf zählt nur noch das Geschoss)',0,''));
    o.push(Gp('Abwurf'));
    if(st.rel) o.push(R('Zeitpunkt',st.rel.t,'s'),R('Abwurfgeschwindigkeit',st.rel.v,'m/s',1),R('Abwurfwinkel',st.rel.ang,'°',1),R('Abwurfhöhe',st.rel.y,'m'),R('Wirkungsgrad E<sub>kin,Geschoss</sub>/E<sub>Start</sub>',100*st.rel.Ek/E0,'%'));
    else o.push(R('Kein Abwurf innerhalb von 120 s',null,''));
    if(st.tLand!==null) o.push(R('Flugzeit bis Aufprall',st.tLand,'s'),R('Wurfweite (ab Turm)',st.range,'m',1));
    if(st.ymax!==null) o.push(R('Maximale Höhe',st.ymax,'m'));
    return o;
  },
  path:function(p,q,tau,E0){
    var g=D.g, It=SC.katapult.I(p), K=-p.Mc*p.a+p.m*p.b+p.Marm*(p.b-p.a)/2, st=[], tt=f(tau), s=SC.katapult.stats();
    var a0=SC.katapult.acc(p,SC.katapult.init(p));
    st.push(step('Aufbau',[
      eq('Hebelverhältnis b/a = '+f(p.b)+'/'+f(p.a)+' = '+f(p.b/p.a)),
      eq('Trägheitsmoment um die Achse: I = M<sub>Arm</sub>·(a³ + b³)/(3·(a + b)) + M<sub>c</sub>·a² + m·b² = '+f(It)+' kg·m²'),
      eq('Gravitations-Drehmoment (Armwinkel φ von +x aus): τ = −g·K·cos φ mit K = −M<sub>c</sub>·a + m·b + M<sub>Arm</sub>·(b − a)/2 = '+f(K)+' kg·m'),
      eq('Anfängliche Winkelbeschleunigung des Arms: φ″ = '+f(a0[0])+' rad/s²',false,true)]));
    var eqs=[];
    if(p.ls>0){
      eqs.push(eq('Zwei gekoppelte Gleichungen (Lagrange), δ = φ − ψ, Schleuder als starre Stange:'));
      eqs.push(eq('I·φ″ + m·b·l<sub>s</sub>·cos δ·ψ″ = −m·b·l<sub>s</sub>·sin δ·ψ′² − g·K·cos φ'+(p.kappa>0?' − κ·(φ − φ<sub>f</sub>)':'')));
      eqs.push(eq('l<sub>s</sub>·ψ″ + b·cos δ·φ″ = b·φ′²·sin δ − g·cos ψ'));
    } else {
      eqs.push(eq('Fester Löffel: I·φ″ = −g·K·cos φ'+(p.kappa>0?' − κ·(φ − φ<sub>f</sub>)':'')));
    }
    eqs.push(eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung, Schritt 0,002 s).',false,true));
    st.push(step('Bewegungsgleichungen',eqs));
    var rl=[];
    if(p.rel===1) rl.push(eq('Abwurf, wenn der Arm den Anschlag bei φ = '+f(p.phst)+'° erreicht (Arm stoppt, Geschoss fliegt weiter).'));
    else rl.push(eq('Abwurf, wenn die Geschwindigkeit des Geschosses nach oben-rechts den Winkel α = '+f(p.arel)+'° erreicht.'));
    if(s.rel){
      rl.push(eq('Abwurf bei t = '+f(s.rel.t)+' s: v = '+f(s.rel.v)+' m/s unter '+f(s.rel.ang)+'°, Höhe '+f(s.rel.y)+' m',true));
      rl.push(eq('Wirkungsgrad = E<sub>kin,Geschoss</sub>/E<sub>Start</sub> = '+f(s.rel.Ek)+'/'+f(E0)+' = '+f(100*s.rel.Ek/E0)+' %'));
    } else rl.push(eq('Kein Abwurf: der Arm erreicht die Abwurfbedingung nie (zu wenig Energie oder Winkel passt nicht).',true));
    st.push(step('Abwurf',rl));
    if(q.ph===0) st.push(step('Zustand bei t = '+tt+' s (Arm in Bewegung)',[
      eq('Armwinkel φ = '+f(q.phi)+'°, ω = '+f(q.w)+' rad/s',true),
      eq('Geschoss: x = '+f(q.x)+' m, y = '+f(q.y)+' m, |v| = '+f(q.v)+' m/s, |a| = '+f(q.a)+' m/s²',true)]));
    else st.push(step('Zustand bei t = '+tt+' s (im Flug)',[
      eq('x = '+f(q.x)+' m, y = '+f(q.y)+' m',true),
      eq('v = ('+f(q.vx)+' ; '+f(q.vy)+') m/s, |v| = '+f(q.v)+' m/s; a = ('+f(q.ax)+' ; '+f(q.ay)+') m/s²',true)]));
    if(s.rel){
      var fl=[], v0x=s.rel.v*Math.cos(s.rel.ang*D2R), v0y=s.rel.v*Math.sin(s.rel.ang*D2R);
      if(p.kd===0){
        var tf=(v0y+Math.sqrt(v0y*v0y+2*g*s.rel.y))/g;
        fl.push(eq('Wurf aus der Höhe h = '+f(s.rel.y)+' m: t<sub>Flug</sub> = (v<sub>y</sub> + √(v<sub>y</sub>² + 2·g·h))/g = '+f(tf)+' s'));
        fl.push(eq('Weite ab Abwurfpunkt = v<sub>x</sub>·t = '+f(v0x)+'·'+f(tf)+' = '+f(v0x*tf)+' m; vom Turm aus: x = '+f(s.rel.x+v0x*tf)+' m',true));
      } else fl.push(eq('Mit Luftwiderstand numerisch gelöst: Flugzeit '+(s.tLand!==null?f(s.tLand-s.rel.t):'–')+' s, Weite vom Turm '+(s.range!==null?f(s.range):'–')+' m',true));
      st.push(step('Flug nach dem Abwurf',fl));
    }
    st.push(step('Energien',[
      eq('E<sub>pot</sub> (Gewichte + Feder) = '+f(q.Ep)+' J, E<sub>kin</sub> = '+f(q.Ek)+' J, E = '+f(q.E)+' J (am Start '+f(E0)+' J)',true),
      eq('Vor dem Abwurf bleibt E konstant (ohne Reibung). Danach zählt nur das Geschoss; der Rest steckt im Arm und im Gegengewicht.',false,true)]));
    return st;
  },
  charts:function(col,tmax,tau,ss,C){
    return C('Energien','J',[{n:'Epot',c:'var(--accent)',d:col('Ep')},{n:'Ekin',c:'var(--react)',d:col('Ek')},{n:'Eges',c:'var(--muted)',d:col('E'),dash:true}],tmax,tau)+
      C('Geschoss: Weg','m',[{n:'x',c:'var(--mom)',d:col('x')},{n:'y',c:'var(--accent)',d:col('y')}],tmax,tau)+
      C('Geschwindigkeit des Geschosses','m/s',[{n:'|v|',c:'var(--react)',d:col('v')}],tmax,tau)+
      C('Armwinkel','°',[{n:'φ',c:'var(--mom)',d:col('phi')}],tmax,tau);
  }};

/* ---------- Duffing-Schwinger ---------- */
function duffU(p,x){
  var Umin=(p.k<0&&p.k3>0)?-p.k*p.k/(4*p.k3):0;
  return 0.5*p.k*x*x+0.25*p.k3*x*x*x*x-Umin;
}
function poincare(p){
  var Om=Math.max(p.Om,0.01), T=2*Math.PI/Om, n=200, h=T/n, y=[p.x0,p.v0], t=0, pts=[], k, i, trans=40, rec=300;
  function fn(t,y){return [y[1],(-p.c*y[1]-p.k*y[0]-p.k3*y[0]*y[0]*y[0]+p.F0*Math.cos(Om*t))/p.m];}
  for(k=0;k<trans+rec;k++){
    for(i=0;i<n;i++){
      var k1=fn(t,y), k2=fn(t+h/2,[y[0]+h/2*k1[0],y[1]+h/2*k1[1]]), k3=fn(t+h/2,[y[0]+h/2*k2[0],y[1]+h/2*k2[1]]), k4=fn(t+h,[y[0]+h*k3[0],y[1]+h*k3[1]]);
      y=[y[0]+h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),y[1]+h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1])]; t+=h;
    }
    if(Math.abs(y[0])>1e4) break;
    if(k>=trans) pts.push([y[0],y[1]]);
  }
  return pts;
}
SC.duffing={name:'Duffing-Schwinger',noG:true,
  dtOf:function(p){return clamp(2*Math.PI/Math.max(p.Om,0.05)/300,0.0005,0.01);},
  init:function(p){return [p.x0,p.v0,0,0];},
  deriv:function(p,t,y){var F=p.F0*Math.cos(p.Om*t); return [y[1],(-p.c*y[1]-p.k*y[0]-p.k3*y[0]*y[0]*y[0]+F)/p.m,p.c*y[1]*y[1],F*y[1]];},
  q:function(p,y,t){
    var F=p.F0*Math.cos(p.Om*(t||0)), a=(-p.c*y[1]-p.k*y[0]-p.k3*y[0]*y[0]*y[0]+F)/p.m;
    return {x:y[0],y:0,vx:y[1],vy:0,ax:a,ay:0,Ep:duffU(p,y[0]),Ek:0.5*p.m*y[1]*y[1],Q:y[2],W:y[3],F:F,Fs:-p.k*y[0]-p.k3*y[0]*y[0]*y[0]};
  },
  after:function(p){D.poinc=poincare(p);},
  view:function(tv){
    var p=D.P.duffing, A=Math.max(Math.abs(p.x0),0.3), j, q;

    for(j=0;j<=200;j++){q=qOf(D.sim,tv*j/200); A=Math.max(A,Math.abs(q.x));}
    var xr=A*1.35, Umin=1e9, Umax=-1e9, i, xx, fe;
    for(i=0;i<=60;i++){
      xx=-xr+2*xr*i/60;
      [-1,0,1].forEach(function(sg){fe=duffU(p,xx)-sg*p.F0*xx; Umin=Math.min(Umin,fe); Umax=Math.max(Umax,fe);});
    }
    return {xr:xr,s:140/xr,Umin:Umin,Umax:Math.max(Umax,Umin+1e-6),ys:125/Math.max(Umax-Umin,1e-6)};
  },
  presets:[
    {label:'Chaos (Doppelmulde)',apply:function(p){Object.assign(p,{m:1,c:0.3,k:-1,k3:1,F0:0.5,Om:1.2,x0:1,v0:0});}},
    {label:'Regelmässig (kleine Kraft)',apply:function(p){Object.assign(p,{m:1,c:0.3,k:-1,k3:1,F0:0.2,Om:1.2,x0:1,v0:0});}},
    {label:'Hartes Feder, Start klein',apply:function(p){Object.assign(p,{m:1,c:0.15,k:1,k3:0.5,F0:0.6,Om:1.6,x0:0,v0:0});}},
    {label:'Hartes Feder, Start gross',apply:function(p){Object.assign(p,{m:1,c:0.15,k:1,k3:0.5,F0:0.6,Om:1.6,x0:3,v0:0});}}
  ],
  draw:function(tau){
    var p=D.P.duffing, V=D.lock||D.view, qq=qOf(D.sim,tau), h='', i, n=90, pts=[], pts0=[], F=qq.F;
    function X(x){return 180+x*V.s;}
    function Yv(u){return 235-(u-V.Umin)*V.ys;}
    for(i=0;i<=n;i++){
      var xx=-V.xr+2*V.xr*i/n;
      pts.push(X(xx).toFixed(1)+','+clamp(Yv(duffU(p,xx)-F*xx),20,262).toFixed(1));
      pts0.push(X(xx).toFixed(1)+','+clamp(Yv(duffU(p,xx)),20,262).toFixed(1));

    h+='<line class="cgrid" x1="'+X(0)+'" y1="30" x2="'+X(0)+'" y2="255"/>'+txt(X(0),270,'x = 0','tick');
    var bx=X(qq.x), by=clamp(Yv(duffU(p,qq.x)-F*qq.x),20,262)-8;

    h+='<circle class="bob" cx="'+bx+'" cy="'+by+'" r="8"/>';
    var fl=p.F0>0?clamp(F/p.F0,-1,1)*45:0;
    if(Math.abs(fl)>2) h+=arrow(bx,by-18,bx+fl,by-18,'fa',7)+lbl(bx+fl/2,by-26,'F(t)','f');
    h+=vecArrows(bx,by+18,{v:Math.abs(qq.vx),vx:qq.vx,vy:0,a:0,ax:0,ay:0},40/Math.max(D.vmax,1e-9),1);
    h+=handle(gb[0],gb[1],'duffing:x0');
    h+=txt(40,292,'Die Kugel rollt in der schwankenden Mulde U(x) − F(t)·x','tick','start');
    return h;
  },
  drag:function(key,pt,V){if(key==='duffing:x0'&&V) D.P.duffing.x0=Math.round(((pt.x-180)/V.s)*100)/100;},
  rows:function(p,q,E0,dE){
    var o=[Gp('Position'),R('Auslenkung x',q.x,'',1),Gp('Geschwindigkeit'),R('v',q.vx,'',1),Gp('Beschleunigung'),R('a',q.ax,'',1),Gp('Kräfte'),R('Antrieb F(t)',q.F,''),R('Rückstellkraft −k·x − k<sub>3</sub>·x³',q.Fs,'')];
    return o.concat(eRow(q,E0,[['E<sub>pot</sub> = ½·k·x² + ¼·k<sub>3</sub>·x⁴ (ab Muldenboden)',q.Ep],['E<sub>kin</sub>',q.Ek],['E = pot + kin',q.E,1],['Arbeit des Antriebs W',q.W],['Wärme Q (Dämpfung)',q.Q],['W − Q (= ΔE)',q.W-q.Q]]));
  },
  path:function(p,q,tau,E0){
    var st=[], tt=f(tau), L=[];
    st.push(step('Die Gleichung',[
      eq('m·x″ + c·x′ + k·x + k<sub>3</sub>·x³ = F<sub>0</sub>·cos(Ω·t)'),
      eq('mit m = '+f(p.m)+', c = '+f(p.c)+', k = '+f(p.k)+', k<sub>3</sub> = '+f(p.k3)+', F<sub>0</sub> = '+f(p.F0)+', Ω = '+f(p.Om)+' (alles dimensionslos oder in SI)'),
      eq('Die Kraft k·x + k<sub>3</sub>·x³ kommt vom Potential U(x) = ½·k·x² + ¼·k<sub>3</sub>·x⁴. Der Antrieb kippt die Mulde: U(x) − F(t)·x.',false,true),
      eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung).',false,true)]));
    if(p.k<0&&p.k3>0){
      var xm=Math.sqrt(-p.k/p.k3), dU=p.k*p.k/(4*p.k3), ww=Math.sqrt(-2*p.k/p.m);
      L.push(eq('Doppelmulde: Minima bei x = ±√(−k/k<sub>3</sub>) = ±'+f(xm)));
      L.push(eq('Barrierenhöhe ΔU = k²/(4·k<sub>3</sub>) = '+f(dU)));
      L.push(eq('Kleine Schwingung im Minimum: ω = √(−2·k/m) = '+f(ww)+' rad/s, Antrieb Ω = '+f(p.Om)+' rad/s'));
      L.push(eq('Springt die Kugel über die Barriere hin und her, sind die Bewegungen oft chaotisch (Poincaré-Punkte füllen eine feine Struktur).',false,true));
    } else if(p.k>0){
      var w0=Math.sqrt(p.k/p.m);
      L.push(eq('Einzelmulde: ω<sub>0</sub> = √(k/m) = '+f(w0)+' rad/s für kleine Ausschläge'));
      if(p.k3>0) L.push(eq('Harte Feder (k<sub>3</sub> > 0): die Frequenz steigt mit der Amplitude, die Resonanzkurve neigt sich nach rechts. Bei einer Frequenz kann es zwei stabile Schwingungen geben (Sprungphänomen).',false,true));
      else if(p.k3<0) L.push(eq('Weiche Feder (k<sub>3</sub> < 0): die Frequenz sinkt mit der Amplitude.',false,true));
    }
    st.push(step('Das Potential',L));
    st.push(step('Zustand bei t = '+tt+' s',[
      eq('x = '+f(q.x)+', v = '+f(q.vx)+', F(t) = '+f(p.F0)+'·cos('+f(p.Om)+'·'+tt+') = '+f(q.F),true),
      eq('a = (−c·v − k·x − k<sub>3</sub>·x³ + F)/m = '+f(q.ax),true)]));
    st.push(step('Poincaré-Schnitt',[
      eq('Alle Punkte (x, v) im Takt der Antriebsperiode T = 2π/Ω = '+f(2*Math.PI/p.Om)+' s, nach 40 Einschwingperioden: '+(D.poinc?D.poinc.length:0)+' Punkte'),
      eq('Ein einzelner Punkt bedeutet periodische Bewegung, zwei Punkte Periodenverdopplung, eine verteilte Struktur Chaos.',false,true)]));
    st.push(step('Energien',[
      eq('E<sub>pot</sub> = '+f(q.Ep)+', E<sub>kin</sub> = '+f(q.Ek)+', E = '+f(q.E),true),
      eq('Arbeit des Antriebs W = '+f(q.W)+', Wärme Q = '+f(q.Q)+', W − Q = '+f(q.W-q.Q)+' = E − E<sub>Start</sub> = '+f(q.E-E0)+' ✓')]));
    return st;
  },
  charts:function(col,tmax,tau,ss,C){

/* ---------- Planetenbahn (Kepler) ---------- */
var KMS=4.74047, AEYR2=1.5022e-4;
SC.kepler={name:'Planetenbahn',dt:0.002,sub:2,noG:true,tunit:'Jahre',
  GM:function(p){return 4*Math.PI*Math.PI*p.M;},
  init:function(p){
    var th=p.th0*D2R, vc=Math.sqrt(SC.kepler.GM(p)/p.r0), v=p.kv*vc, a=p.ang*D2R;
    var tx=-Math.sin(th), ty=Math.cos(th), nx=Math.cos(th), ny=Math.sin(th);
    return [p.r0*nx,p.r0*ny,v*(tx*Math.cos(a)+nx*Math.sin(a)),v*(ty*Math.cos(a)+ny*Math.sin(a))];
  },
  deriv:function(p,t,y){
    var r2=y[0]*y[0]+y[1]*y[1], r=Math.sqrt(Math.max(r2,1e-8)), k=-SC.kepler.GM(p)/(r*r*r);
    return [y[2],y[3],k*y[0],k*y[1]];
  },
  q:function(p,y){
    var GM=SC.kepler.GM(p), r=Math.sqrt(y[0]*y[0]+y[1]*y[1]), k=-GM/(r*r*r), v2=y[2]*y[2]+y[3]*y[3];
    return {x:y[0],y:y[1],vx:y[2],vy:y[3],ax:k*y[0],ay:k*y[1],Ep:-GM/r,Ek:0.5*v2,r:r,eps:0.5*v2-GM/r,h:y[0]*y[3]-y[1]*y[2]};
  },
  elem:function(p){
    var GM=SC.kepler.GM(p), q=SC.kepler.q(p,SC.kepler.init(p)), e=Math.sqrt(Math.max(0,1+2*q.eps*q.h*q.h/(GM*GM)));
    var o={GM:GM,eps:q.eps,h:q.h,e:e,vc:Math.sqrt(GM/p.r0),peri:q.h*q.h/(GM*(1+e))};
    if(q.eps<-1e-12){o.a=-GM/(2*q.eps); o.T=2*Math.PI*Math.sqrt(o.a*o.a*o.a/GM); o.aph=o.a*(1+e); o.type=e<1e-3?'Kreisbahn':'Ellipse';}
    else {o.a=null;o.T=null;o.aph=null;o.type=Math.abs(q.eps)<=1e-12?'Parabel (gerade entkommen)':'Hyperbel (entkommt)';}
    return o;
  },
  view:function(tv){
    var p=D.P.kepler, el=SC.kepler.elem(p), R;
    if(el.aph) R=el.aph*1.1;
    else {R=p.r0*1.5; for(var j=0;j<=100;j++){var q=qOf(D.sim,tv*j/100); R=Math.max(R,Math.min(q.r,10*p.r0));} R*=1.05;}
    return {R:R,s:105/R};
  },
  presets:[
    {label:'Kreisbahn',apply:function(p){Object.assign(p,{M:1,r0:1,kv:1,ang:0,th0:0});}},
    {label:'Ellipse',apply:function(p){Object.assign(p,{M:1,r0:1,kv:0.8,ang:0,th0:0});}},
    {label:'Fluchtgeschwindigkeit',apply:function(p){Object.assign(p,{M:1,r0:1,kv:Math.SQRT2,ang:0,th0:0});}},
    {label:'Komet (Halley-ähnlich)',apply:function(p){Object.assign(p,{M:1,r0:35.1,kv:0.18,ang:0,th0:0});}},
    {label:'Mars-ähnlich',apply:function(p){Object.assign(p,{M:1,r0:1.52,kv:1,ang:0,th0:0});}}
  ],
  draw:function(tau){
    var p=D.P.kepler, V=D.lock||D.view, h='', i, j, k, el=SC.kepler.elem(p), qq=qOf(D.sim,tau);
    function X(x){return 180+x*V.s;}
    function Y(y){return 150-y*V.s;}
    var st=niceStep(V.R,2);
    for(i=1;i*st<=V.R*1.0;i++){h+='<circle cx="180" cy="150" r="'+(i*st*V.s)+'" fill="none" stroke="var(--grid)"/>'+txt(180+i*st*V.s,146,f(i*st)+' AE','tick','start');}
    // Flächensektoren (gleiche Zeit = gleiche Fläche)
    if(el.T){
      var nS=12, dT=el.T/nS, sec;
      for(k=0;k<nS;k++){
        if((k+1)*dT>Math.min(tau,D.t)+1e-9) break;
        var pts=['180,150'];
        for(j=0;j<=10;j++){sec=qOf(D.sim,k*dT+dT*j/10); pts.push(X(sec.x).toFixed(1)+','+Y(sec.y).toFixed(1));}

      }
    }
    var tw=Math.min(tau,D.t), N=300, tr=[], g1=[], q;
    for(j=0;j<=N;j++){q=qOf(D.sim,tw*j/N); tr.push(X(q.x).toFixed(1)+','+Y(q.y).toFixed(1));}
    for(j=0;j<=N;j++){q=qOf(D.sim,D.t*j/N); g1.push(X(q.x).toFixed(1)+','+Y(q.y).toFixed(1));}
    h+='<polyline class="trg" points="'+g1.join(' ')+'"/><polyline class="tr" points="'+tr.join(' ')+'"/>';
    var s0=SC.kepler.init(p), gx=X(s0[0]), gy=Y(s0[1]);
    h+='<circle cx="180" cy="150" r="9" fill="#f5b301" stroke="var(--panel)" stroke-width="2"/>';
    h+='<circle class="bobg" cx="'+gx+'" cy="'+gy+'" r="6"/>';
    h+='<circle class="bob" cx="'+X(qq.x)+'" cy="'+Y(qq.y)+'" r="6"/>';
    var vv=Math.sqrt(qq.vx*qq.vx+qq.vy*qq.vy), ln=Math.min(45,14+4*Math.sqrt(vv));
    if(vv>1e-9) h+=arrow(X(qq.x),Y(qq.y),X(qq.x)+qq.vx/vv*ln,Y(qq.y)-qq.vy/vv*ln,'ra',7);
    var vl=Math.sqrt(s0[2]*s0[2]+s0[3]*s0[3]), l0=10+7*Math.sqrt(vl/4.74*0+vl/6.28*4);
    var tx=gx+s0[2]/Math.max(vl,1e-9)*l0, ty=gy-s0[3]/Math.max(vl,1e-9)*l0;
    h+=arrow(gx,gy,tx,ty,'ra',6)+handle(tx,ty,'kepler:v')+handle(gx,gy,'kepler:p');
    h+=txt(40,292,el.T?'Gleiche Zeitabschnitte (T/12) überstreichen gleiche Flächen':'Unbegrenzte Bahn (kein Umlauf)','tick','start');
    return h;
  },
  drag:function(key,pt,V){
    var p=D.P.kepler; if(!V) return;
    if(key==='kepler:p'){
      var dx=(pt.x-180)/V.s, dy=(150-pt.y)/V.s;
      p.r0=Math.max(0.1,Math.round(Math.sqrt(dx*dx+dy*dy)*100)/100);
      p.th0=clamp(Math.round(Math.atan2(dy,dx)/D2R),-180,180);
    } else if(key==='kepler:v'){
      var s0=SC.kepler.init(p), gx=180+s0[0]*V.s, gy=150-s0[1]*V.s, ddx=pt.x-gx, ddy=gy-pt.y, len=Math.sqrt(ddx*ddx+ddy*ddy);
      if(len<4) return;
      var th=p.th0*D2R, tx=-Math.sin(th), ty=Math.cos(th), nx=Math.cos(th), ny=Math.sin(th);
      var ux=ddx/len, uy=ddy/len, vt=ux*tx+uy*ty, vn=ux*nx+uy*ny;
      p.ang=clamp(Math.round(Math.atan2(vn,vt)/D2R),-180,180);
      var vc=Math.sqrt(SC.kepler.GM(p)/p.r0), vnew=len<=10?0:Math.pow((len-10)/7,2)/4*6.28;
      p.kv=Math.max(0,Math.round(vnew/vc*100)/100);
    }
  },
  rows:function(p,q,E0,dE){
    var el=SC.kepler.elem(p), v=Math.sqrt(q.vx*q.vx+q.vy*q.vy), a=q.a;
    var o=[Gp('Position'),R('x',q.x,'AE'),R('y',q.y,'AE'),R('Abstand r zur Sonne',q.r,'AE',1),
      Gp('Geschwindigkeit'),R('v',v,'AE/Jahr',1),R('v in km/s',v*KMS,'km/s'),
      Gp('Beschleunigung'),R('a = GM/r²',a,'AE/Jahr²',1),R('a in m/s²',a*AEYR2,'m/s²'),
      Gp('Energie und Drehimpuls (pro kg)'),R('E<sub>pot</sub> = −GM/r',q.Ep,'AE²/Jahr²'),R('E<sub>kin</sub> = ½·v²',q.Ek,'AE²/Jahr²'),R('E gesamt',q.eps,'AE²/Jahr²',1),
      R('Drehimpuls h = x·v<sub>y</sub> − y·v<sub>x</sub>',q.h,'AE²/Jahr',1),R('Flächengeschwindigkeit h/2',q.h/2,'AE²/Jahr'),
      Gp('Bahn'),R('Exzentrizität e',el.e,''),R('Perihel',el.peri,'AE')];
    o.push(R('Bahnart: '+el.type,null,''));
    if(el.a){o.push(R('Grosse Halbachse a',el.a,'AE'),R('Aphel',el.aph,'AE'),R('Umlaufzeit T',el.T,'Jahre',1));}
    return o;
  },
  path:function(p,q,tau,E0){
    var el=SC.kepler.elem(p), st=[], tt=f(tau), v=Math.sqrt(q.vx*q.vx+q.vy*q.vy);
    st.push(step('Gravitation',[
      eq('Newton: a = −G·M/r² (zur Sonne hin). In den Einheiten AE, Jahr, Sonnenmasse gilt G·M☉ = 4π² AE³/Jahr², hier GM = 4π²·'+f(p.M)+' = '+f(el.GM)+' AE³/Jahr²'),
      eq('Kreisbahn-Geschwindigkeit bei r<sub>0</sub> = '+f(p.r0)+' AE: v<sub>K</sub> = √(GM/r<sub>0</sub>) = '+f(el.vc)+' AE/Jahr = '+f(el.vc*KMS)+' km/s'),
      eq('Start: v<sub>0</sub> = '+f(p.kv)+'·v<sub>K</sub> = '+f(p.kv*el.vc)+' AE/Jahr, Richtung '+f(p.ang)+'° zur Tangente',true),
      eq('Numerisch gelöst (Runge-Kutta, 4. Ordnung, Schritt 0,002 Jahre mit Unterschritten).',false,true)]));
    var bl=[
      eq('Spezifische Energie ε = v²/2 − GM/r = '+f(el.eps)+' AE²/Jahr² ('+(el.eps<0?'negativ: gebunden':'nicht negativ: ungebunden')+')'),
      eq('Drehimpuls pro Masse h = r·v·cos(Winkel) = '+f(el.h)+' AE²/Jahr'),

    st.push(step('Bahnform (Kepler-Gesetze)',bl));

    st.push(step('Erhaltungssätze (Probe)',[

      eq('Drehimpuls: h = '+f(q.h)+' (Start '+f(el.h)+') ✓ = 2·Flächengeschwindigkeit (2. Keplersches Gesetz)',true),
      eq('Nahe der Sonne läuft der Planet schneller (Perihel), weit weg langsamer (Aphel).',false,true)]));

  },
  charts:function(col,tmax,tau,ss,C){

  }};

/* ---------- Dreikörperproblem ---------- */
function setBodies(p,G,eps,b){
  p.G=G; p.eps=eps;
  b.forEach(function(o,i){var n=i+1; p['m'+n]=o[0]; p['x'+n]=o[1]; p['y'+n]=o[2]; p['u'+n]=o[3]; p['w'+n]=o[4];});
}
SC.nbody={name:'Dreikörperproblem',dt:0.002,sub:3,noG:true,tunit:'ZE',
  adaptDt:function(p,y){
    var m=[p.m1,p.m2,p.m3], pr=[[0,1],[0,2],[1,2]], dmin=1e9, e2=p.eps*p.eps;
    pr.forEach(function(q){
      var dx=y[2*q[0]]-y[2*q[1]], dy=y[2*q[0]+1]-y[2*q[1]+1], d2=dx*dx+dy*dy+e2;
      dmin=Math.min(dmin,0.04*Math.sqrt(d2*Math.sqrt(d2)/(p.G*(m[q[0]]+m[q[1]]))));
    });
    return dmin;

  accs:function(p,y){

function syncParams(force){
  var els=document.querySelectorAll('#dparams [data-dk]'), p=D.P[D.sc];
  for(var i=0;i<els.length;i++){
    var el=els[i], k=el.getAttribute('data-dk');
    if(!force&&el===document.activeElement) continue;
    if(el.type==='checkbox') el.checked=!!p[k];
    else el.value=String(Math.round((k==='g'?D.g:p[k])*1000)/1000);
  }
  var dtEl=$('#dt'); if(dtEl!==document.activeElement) dtEl.value=String(Math.round(D.t*100)/100);
  $('#dslider').value=String(Math.min(D.t,30));
}
function renderFrame(full){
  drawScene(D.tau); drawResults(D.tau);
  if(full) drawPath(D.tau);
}

function moveMarkers(){
  document.querySelectorAll('#dcharts .cmark').forEach(function(m){
    var x=parseFloat(m.getAttribute('data-x0'))+parseFloat(m.getAttribute('data-xw'))*clamp(D.tau/parseFloat(m.getAttribute('data-tmax')),0,1);
    m.setAttribute('x1',x); m.setAttribute('x2',x);
  });
}
var raf=0,last=0;
function setPlayLabel(){$('#dplay').textContent=D.play?'⏸ Pause':'▶ Abspielen';}
function stopPlay(){if(D.play){D.play=false; cancelAnimationFrame(raf);} setPlayLabel();}
function tick(ts){
  if(!D.play) return;
  var dt=(ts-last)/1000; last=ts;
  D.tau+=dt*D.speed;
  if(D.tau>=D.t){D.tau=D.t; D.play=false; setPlayLabel(); renderFrame(true); moveMarkers(); return;}
  renderFrame(false); moveMarkers();
  raf=requestAnimationFrame(tick);
}
$('#dplay').addEventListener('click',function(){
  if(D.play){stopPlay(); renderFrame(true); return;}
  if(D.tau>=D.t-1e-9) D.tau=0;
  D.play=true; last=performance.now(); setPlayLabel();
  raf=requestAnimationFrame(tick);
});
$('#dreset').addEventListener('click',function(){stopPlay(); D.tau=D.t; renderFrame(true); moveMarkers();});
$('#dspeed').addEventListener('change',function(e){D.speed=parseFloat(e.target.value)||1;});
function setT(v){
  if(!isFinite(v)) return;
  D.t=clamp(v,0,120); D.tau=D.t; stopPlay(); syncParams(false); refresh();
}
$('#dt').addEventListener('input',function(e){setT(parseFloat(e.target.value));});
$('#dslider').addEventListener('input',function(e){setT(parseFloat(e.target.value));});

var pnl=$('#dparams');
pnl.addEventListener('input',function(e){
  var el=e.target, k=el.getAttribute?el.getAttribute('data-dk'):null; if(!k) return;
  var p=D.P[D.sc];
  if(el.type==='checkbox'){p[k]=el.checked?1:0; stopPlay(); D.tau=D.t; refresh(); return;}
  var v=parseFloat(el.value); if(!isFinite(v)) return;
  if(k==='g'){
    if(v<=0) return;
    D.g=v; var idx=PRESET.length-1; PRESET.forEach(function(a,i){if(a[1]&&Math.abs(a[1]-v)<1e-9) idx=i;});
    D.gsel=idx; var gs=$('#dgsel'); if(gs) gs.value=String(idx);
  } else {
    var def=PF[D.sc].filter(function(d){return d[0]===k;})[0];
    if(def&&def[3]!==undefined&&def[3]!=='check'&&v<def[3]) return;
    if(def&&typeof def[4]==='number'&&v>def[4]) return;
    p[k]=v;
  }
  stopPlay(); D.tau=D.t; refresh();
});
pnl.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-preset]'):null; if(!b) return;
  var pr=SC[D.sc].presets[parseInt(b.getAttribute('data-preset'),10)];
  if(!pr) return;
  pr.apply(D.P[D.sc]); stopPlay(); D.tau=D.t; syncParams(true); refresh();
});
pnl.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='dsc'){
    D.sc=el.value; stopPlay(); D.tau=D.t; D.lock=null; renderParams(); refresh(); return;
  }
  if(el.id==='dgsel'){
    var i=parseInt(el.value,10); D.gsel=i;
    if(PRESET[i][1]) D.g=PRESET[i][1];
    stopPlay(); D.tau=D.t; syncParams(true); refresh(); return;
  }
});

/* Ziehen */
var drag=null;
function toSvg(e){
  var pt=dsvg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  var m=dsvg.getScreenCTM(); if(!m) return {x:0,y:0};
  return pt.matrixTransform(m.inverse());
}
dsvg.addEventListener('pointerdown',function(e){
  var t=e.target.closest?e.target.closest('[data-drag]'):null; if(!t) return;
  drag=t.getAttribute('data-drag');
  stopPlay(); D.tau=D.t;
  if(D.view) D.lock=D.view;
  try{dsvg.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
dsvg.addEventListener('pointermove',function(e){
  if(!drag) return;
  var pt=toSvg(e), p, V=D.lock;
  if(SC[D.sc].drag){SC[D.sc].drag(drag,pt,V); syncParams(false); refresh(); return;}
  if(drag==='pend:th'){
    p=D.P.pend;
    p.th0=clamp(Math.round(Math.atan2(pt.x-180,pt.y-44)/D2R),-179,179);
  } else if(drag==='doppel:th1'){
    p=D.P.doppel;
    p.th1=clamp(Math.round(Math.atan2(pt.x-180,pt.y-44)/D2R),-179,179);
  } else if(drag==='doppel:th2'){
    p=D.P.doppel;
    var scd=135/(p.L1+p.L2), bx=180+p.L1*Math.sin(p.th1*D2R)*scd, by=44+p.L1*Math.cos(p.th1*D2R)*scd;
    p.th2=clamp(Math.round(Math.atan2(pt.x-bx,pt.y-by)/D2R),-179,179);
  } else if(drag==='rolle:h1'||drag==='rolle:h2'){
    p=D.P.rolle;
    var hh=Math.max(0,Math.round(((250-pt.y)/(205/p.H))*20)/20);
    if(drag==='rolle:h1') p.h1=hh; else p.h2=hh;
  } else if(/^stoss:p[12]$/.test(drag)&&V){
    p=D.P.stoss;
    var wx=Math.round(((pt.x-V.ox)/V.s+V.xmin)*20)/20, wy=Math.round((V.ymax-(pt.y-V.top)/V.s)*20)/20;
    if(drag==='stoss:p1'){p.x1=wx;p.y1=wy;} else {p.x2=wx;p.y2=wy;}
  } else if(/^stoss:v[12]$/.test(drag)&&V){
    p=D.P.stoss;
    var one=drag==='stoss:v1', ox0=one?p.x1:p.x2, oy0=one?p.y1:p.y2;
    var ddx=pt.x-(V.ox+(ox0-V.xmin)*V.s), ddy=(V.top+(V.ymax-oy0)*V.s)-pt.y, ln=Math.sqrt(ddx*ddx+ddy*ddy);
    if(ln<4) return;
    var ang=clamp(Math.round(Math.atan2(ddy,ddx)/D2R),-180,180), vv=ln<=10?0:Math.min(300,Math.round(Math.pow((ln-10)/7,2)*10)/10);
    if(one){p.a1=ang;p.v1=vv;} else {p.a2=ang;p.v2=vv;}
  } else if(drag==='wurf:h0'&&V){
    p=D.P.wurf;
    var yv=V.ymax-(pt.y-V.top)/V.s;
    p.h0=Math.max(0,Math.round(yv*10)/10);
  } else if(drag==='wurf:vec'&&V){
    p=D.P.wurf;
    var sx0=V.ox+(0-V.xmin)*V.s, sy0=V.top+(V.ymax-p.h0)*V.s;
    var dx=pt.x-sx0, dy=sy0-pt.y, len=Math.sqrt(dx*dx+dy*dy);
    if(len<4) return;
    p.al=clamp(Math.round(Math.atan2(dy,dx)/D2R),-90,90);
    p.v0=len<=10?0:Math.min(300,Math.round(Math.pow((len-10)/7,2)*2)/2);
  } else if(drag==='feder:y0'&&V){
    p=D.P.feder;
    p.y0=Math.max(0,Math.round(((pt.y-34)/V.s)*100)/100);
  } else if(drag==='ebene:u0'&&V){
    p=D.P.ebene;
    var b=p.beta*D2R;
    var u=((pt.x-V.xb)*Math.cos(b)+(V.yb-pt.y)*Math.sin(b))/V.s;
    p.u0=clamp(Math.round(u*20)/20,0,p.Ls);
  } else if(drag==='ebene:beta'&&V){
    p=D.P.ebene;
    p.beta=clamp(Math.round(Math.atan2(V.yb-pt.y,pt.x-V.xb)/D2R),5,80);
  } else return;
  syncParams(false); refresh();
});
function endDrag(){ if(!drag) return; drag=null; D.lock=null; refresh(); }
dsvg.addEventListener('pointerup',endDrag);
dsvg.addEventListener('pointercancel',endDrag);

/* Tabs */
var SUB={
  static:'Aufbau in der Tabelle eintragen, gesuchte Grössen ankreuzen, Lösungsweg und Schnittgrössen lesen.',
  dyn:'Szenario und Gravitation wählen, Zeitpunkt t eingeben: Position, Beschleunigung und Energien werden berechnet.'
};
function showTab(t){
  $('#viewStatic').hidden=(t!=='static'); $('#viewDyn').hidden=(t!=='dyn');
  document.querySelectorAll('[data-tab]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-tab')===t));});
  $('#sub').textContent=SUB[t];
  if(t!=='dyn') stopPlay();
}
document.querySelectorAll('[data-tab]').forEach(function(b){
  b.addEventListener('click',function(){showTab(b.getAttribute('data-tab'));});
});

renderParams();
refresh();
if(typeof globalThis!=='undefined') globalThis.DYN={D:D,SC:SC,simulate:simulate,stateAt:stateAt,qOf:qOf,recompute:recompute,refresh:refresh,wurfStats:wurfStats,renderParams:renderParams};
})();

</script>
</body>
