<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helix Web-CAD</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f4;--panel:#ffffff;--line:#d3d8e0;--ink:#151922;--mute:#647084;--acc:#3a49d8;--accink:#ffffff;--hot:#e8960f;--field:#f5f6f9;--shadow:0 8px 30px rgba(10,15,40,.18);
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--panel:#1a1d24;--line:#2b303a;--ink:#e6e9ef;--mute:#8b95a7;--acc:#8794ff;--accink:#0b0e1f;--hot:#f2ac2c;--field:#13161b;--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#101216;--panel:#1a1d24;--line:#2b303a;--ink:#e6e9ef;--mute:#8b95a7;--acc:#8794ff;--accink:#0b0e1f;--hot:#f2ac2c;--field:#13161b;--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 var(--sans);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
#top{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.2px}
.brand svg{width:26px;height:26px;color:var(--acc)}
#pname{flex:1;min-width:40px;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-weight:500;text-overflow:ellipsis}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--field);outline:none}
.tb{display:flex;gap:4px}
.tb button,.chip,#dock button,#cmd button,.mfoot button,.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 10px;height:32px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.tb button:hover,.chip:hover,#dock button:hover,.sbtn:hover{border-color:var(--acc)}
.tb button.on,.chip.on,#dock button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tb button:disabled{opacity:.35}
#main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;min-width:0;touch-action:none;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:90%;background:#12151b;color:#f1f3f7;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s;z-index:5;text-align:center}
#toast.show{opacity:1}
#coords{position:absolute;left:8px;bottom:6px;font:12px var(--mono);color:#9aa4b5;pointer-events:none;text-shadow:0 0 3px rgba(0,0,0,.4)}
#side{display:none;flex-direction:column;width:min(330px,92%);background:var(--panel);border-left:1px solid var(--line);position:absolute;right:0;top:0;bottom:0;z-index:6;box-shadow:var(--shadow)}
#side.open{display:flex}
.stabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.stabs button{flex:1;border:0;background:none;padding:10px 4px;border-bottom:2px solid transparent;color:var(--mute);font-weight:500}
.stabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
#sbody{flex:1;overflow:auto;padding:10px;-webkit-user-select:text}
.lrow{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid var(--line)}
.lrow.cur{background:color-mix(in srgb,var(--acc) 12%,transparent);margin:0 -10px;padding:4px 10px}
.lrow input.ln{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:5px}
.lrow input.ln:focus{border-color:var(--line);background:var(--field);outline:none}
.lrow select{max-width:92px;border:1px solid var(--line);background:var(--field);border-radius:5px;padding:3px;font-size:12px}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib.off{opacity:.4}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.frow{display:flex;align-items:center;gap:8px;margin:6px 0}
.frow span{flex:0 0 38%;color:var(--mute);font-size:13px}
.frow input,.frow select,.frow textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 8px}
.frow input[type=checkbox]{flex:none;width:18px;height:18px}
.frow input[type=text]{font-family:var(--mono);font-size:13px}
.frow textarea{font-family:var(--sans)}
.info{font:12px/1.5 var(--mono);color:var(--mute);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;white-space:pre-wrap}
h4{margin:12px 0 4px;font-size:12px;color:var(--mute);font-weight:600}
#cmd{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:5px}
#prompt{font-size:13px;min-height:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prompt b{color:var(--acc)}
.cin{display:flex;gap:5px}
#cin{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:0 10px;height:34px;font:14px var(--mono)}
#cin:focus{outline:2px solid var(--acc);outline-offset:-1px}
#cmd button{height:34px}
#chips{flex:none;display:flex;gap:5px;padding:5px 8px;overflow-x:auto;background:var(--bg);scrollbar-width:none}
#chips::-webkit-scrollbar,#btns::-webkit-scrollbar{display:none}
.chip{height:28px;font-size:12.5px;flex:none}
#dock{flex:none;background:var(--panel);border-top:1px solid var(--line)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:none;height:34px;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
#tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
#btns{display:flex;gap:5px;padding:7px 8px;overflow-x:auto;scrollbar-width:none}
#btns button{flex:none;height:36px}
#modal{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
#modal[hidden]{display:none}
#mbox{background:var(--panel);width:min(560px,100%);max-height:88%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:var(--shadow)}
@media (min-width:700px){#modal{align-items:center}#mbox{border-radius:14px}}
#mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
#mbody{padding:12px 14px;overflow:auto;-webkit-user-select:text;user-select:text}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mfoot button.pri,.sbtn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:500}
.mfoot button,.sbtn{height:36px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;height:auto;min-height:44px;padding:8px 10px;text-align:left;justify-content:flex-start;white-space:normal;line-height:1.25}
.menu button:hover{border-color:var(--acc)}
.menu button small{display:block;color:var(--mute);font-size:11.5px}
.slot{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.slot span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help h3{margin:16px 0 4px;font-size:15px}
.help h3:first-child{margin-top:0}
.help p,.help li{margin:4px 0;line-height:1.5}
.help ul{padding-left:20px;margin:4px 0}
.help code,.help kbd{font:12.5px var(--mono);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.help table{border-collapse:collapse;width:100%;font-size:13px}
.help td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.help td:first-child{white-space:nowrap;font-family:var(--mono);color:var(--acc)}
textarea.big{width:100%;height:240px;font:12px var(--mono);border:1px solid var(--line);background:var(--field);border-radius:6px;padding:8px}
@media (min-width:900px){#side{position:static;box-shadow:none;width:310px;flex:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.ferr{color:#d6403a;font-size:12.5px;min-height:16px;margin-top:6px}
.lay{border-bottom:1px solid var(--line);padding:4px 0}
.lay.cur{background:color-mix(in srgb,var(--acc) 12%,transparent);margin:0 -10px;padding:4px 10px}
.lr2{display:flex;align-items:center;gap:5px;margin:2px 0}
.lr2 input.ln{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:4px 5px;border-radius:5px}
.lr2 input.ln:focus{border-color:var(--line);background:var(--field);outline:none}
.lr2 select{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:5px;padding:4px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;flex:none}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hint{color:var(--mute);font-size:12.5px;margin:4px 0}
@media (max-width:480px){.brand span{display:none}.tb button{padding:0 8px}}

#tools{flex:none;display:flex;align-items:stretch;padding:4px 6px 3px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tools::-webkit-scrollbar{display:none}
@media (min-width:700px){#tools{flex-wrap:wrap;overflow-x:visible;row-gap:3px}}
.tg{display:flex;flex-direction:column;padding:0 7px;border-right:1px solid var(--line);flex:none}
.tg:first-child{padding-left:2px}.tg:last-child{border-right:0}
.tgi{display:flex;gap:2px}
.tgl{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.3;margin-top:1px;letter-spacing:.3px}
.tbtn{width:36px;height:34px;border:1px solid transparent;background:transparent;border-radius:7px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.tbtn svg{width:22px;height:22px;pointer-events:none;display:block}
@media (hover:hover){.tbtn:hover{background:var(--field);border-color:var(--line)}}
.tbtn:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tbtn.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
@media (pointer:coarse){.tbtn{width:42px;height:40px}.tbtn svg{width:24px;height:24px}}
#tip{position:fixed;left:0;top:0;z-index:70;max-width:270px;background:#12151b;color:#f1f3f7;padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .12s}
#tip.show{opacity:1}
#tip b{display:block;font-size:13px;font-weight:600;margin-bottom:1px}
#tip kbd{font:11px var(--mono);background:#2b303a;border-radius:4px;padding:1px 5px;margin-left:7px;color:#cfd6e4;font-weight:400}
@media (prefers-reduced-motion:reduce){#tip{transition:none}}

.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.symbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;font-size:12px;text-align:center;cursor:pointer;line-height:1.2}
.symbtn:hover,.symbtn:focus-visible{border-color:var(--acc);outline:none}
.symbtn canvas{width:64px;height:64px;background:var(--field);border-radius:6px}
.symdel{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;background:var(--panel);color:var(--mute);border-radius:50%;padding:0;line-height:1;font-size:11px}
.frow input[type=range]{padding:0;accent-color:var(--acc)}
canvas.pdfprev{width:auto;max-width:100%;max-height:220px;display:block;border:1px solid var(--line);border-radius:6px;background:#dfe3ea;margin:4px auto 8px}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4c0 6 20 6 20 12S6 22 6 28"/><path d="M26 4c0 6-20 6-20 12s20 6 20 12" opacity=".55"/></svg><span>Helix</span></div>
  <input id="pname" value="Zeichnung 1" aria-label="Zeichnungsname" maxlength="60" spellcheck="false">
  <div class="tb">
    <button id="bFile" title="Datei: Neu, Öffnen, Speichern, Export">Datei</button>
    <button id="bUndo" title="Rückgängig (Strg+Z)">↶</button>
    <button id="bRedo" title="Wiederholen (Strg+Y)">↷</button>
    <button id="bSide" title="Ebenen und Eigenschaften">Ebenen</button>
    <button id="bHelp" title="Anleitung">?</button>
  </div>
</header>
<div id="tools" role="toolbar" aria-label="Werkzeuge"></div>
<div id="main">
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div><div id="coords"></div></div>
  <aside id="side">
    <div class="stabs"><button data-t="layers" class="on">Ebenen</button><button data-t="props">Eigenschaften</button><button data-t="set">Einstellungen</button></div>
    <div id="sbody"></div>
  </aside>
</div>
<div id="cmd">
  <div id="prompt"></div>
  <div class="cin"><input id="cin" placeholder="Befehl oder Wert, z. B. 10,20 · @5<45 · 12.5" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><button id="bOk">OK</button><button id="bEsc">Esc</button></div>
</div>
<div id="chips"></div>
<div id="modal" hidden><div id="mbox" role="dialog" aria-modal="true"><div id="mhead"><span id="mtitle"></span><button class="ib" id="mclose" aria-label="Schließen">✕</button></div><div id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<input type="file" id="fimg" accept="image/*" hidden>
<input type="file" id="fin" accept=".json,.hlx,.txt,.dxf,application/json,text/plain" hidden>
<script>
(()=>{'use strict';
/*GEOM_START*/
const TAU=Math.PI*2,D2R=Math.PI/180,EPS=1e-9;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1],crs=(a,b)=>a[0]*b[1]-a[1]*b[0];
const len=a=>Math.hypot(a[0],a[1]),dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const nrm=a=>{const l=len(a);return l<1e-15?[1,0]:[a[0]/l,a[1]/l]};
const ang=a=>Math.atan2(a[1],a[0]);
const pol=(c,r,a)=>[c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const nA=a=>{a%=TAU;return a<0?a+TAU:a};
const inArc=(a,a0,a1)=>{const s=nA(a1-a0),o=nA(a-a0);return o<=s+1e-9||o>=TAU-1e-9};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtN=n=>{let s=(+n).toFixed(doc.dec);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s==='-0'?'0':s};
const f3=n=>{const s=(+n).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');return s==='-0'?'0':s};

/* ---- Transformationen (Ähnlichkeitsabbildungen) ---- */
const M_t=d=>({a:1,b:0,c:0,d:1,e:d[0],f:d[1]});
const M_r=(o,th)=>{const c=Math.cos(th),s=Math.sin(th);return{a:c,b:s,c:-s,d:c,e:o[0]-(c*o[0]-s*o[1]),f:o[1]-(s*o[0]+c*o[1])}};
const M_s=(o,k)=>({a:k,b:0,c:0,d:k,e:o[0]*(1-k),f:o[1]*(1-k)});
const M_m=(p,q)=>{const th=ang(sub(q,p)),c=Math.cos(2*th),s=Math.sin(2*th);return{a:c,b:s,c:s,d:-c,e:p[0]-(c*p[0]+s*p[1]),f:p[1]-(s*p[0]-c*p[1])}};
const apM=(M,p)=>[M.a*p[0]+M.c*p[1]+M.e,M.b*p[0]+M.d*p[1]+M.f];
const linM=(M,v)=>[M.a*v[0]+M.c*v[1],M.b*v[0]+M.d*v[1]];
function xf(e,M){
  const n=clone(e),det=M.a*M.d-M.b*M.c,s=Math.sqrt(Math.abs(det)),flip=det<0,T=p=>apM(M,p);
  switch(e.type){
    case'line':n.a=T(e.a);n.b=T(e.b);break;
    case'pline':case'hatch':n.pts=e.pts.map(T);if(e.type==='hatch'){n.angle=ang(linM(M,[Math.cos(e.angle||0),Math.sin(e.angle||0)]));n.spacing=e.spacing*s}break;
    case'point':n.p=T(e.p);break;
    case'circle':n.c=T(e.c);n.r=e.r*s;break;
    case'arc':{const c2=T(e.c),s0=T(pol(e.c,e.r,e.a0)),s1=T(pol(e.c,e.r,e.a1));n.c=c2;n.r=e.r*s;n.a0=ang(sub(s0,c2));n.a1=ang(sub(s1,c2));if(flip){const t=n.a0;n.a0=n.a1;n.a1=t}break}
    case'ellipse':n.c=T(e.c);n.rx=e.rx*s;n.ry=e.ry*s;n.rot=ang(linM(M,[Math.cos(e.rot),Math.sin(e.rot)]));break;
    case'text':n.p=T(e.p);n.h=e.h*s;if(!flip)n.rot=ang(linM(M,[Math.cos(e.rot||0),Math.sin(e.rot||0)]));break;
    case'dim':n.a=T(e.a);n.b=T(e.b);n.p=T(e.p);n.th=(e.th||doc.th)*s;if(e.mode==='h'||e.mode==='v'){const q=Math.abs(M.b)+Math.abs(M.c)>1e-9&&!(Math.abs(M.a)<1e-9&&Math.abs(M.d)<1e-9)?1:0;if(q&&!(Math.abs(M.b)<1e-9&&Math.abs(M.c)<1e-9))n.mode='al'}break;
    case'rdim':n.c=T(e.c);n.r=e.r*s;n.p=T(e.p);n.th=(e.th||doc.th)*s;break;
    case'spline':n.pts=e.pts.map(T);break;
    case'leader':n.pts=e.pts.map(T);n.h=(e.h||doc.th)*s;break;
    case'adim':n.c=T(e.c);n.a=T(e.a);n.b=T(e.b);n.p=T(e.p);n.th=(e.th||doc.th)*s;break;
    case'xline':n.p=T(e.p);n.ang=ang(linM(M,[Math.cos(e.ang),Math.sin(e.ang)]));break;
  }
  return n;
}

/* ---- Geometrie je Objekt ---- */
function ellPts(e,n=72){const co=Math.cos(e.rot),si=Math.sin(e.rot),r=[];for(let i=0;i<=n;i++){const t=i/n*TAU,x=e.rx*Math.cos(t),y=e.ry*Math.sin(t);r.push([e.c[0]+x*co-y*si,e.c[1]+x*si+y*co])}return r}
function dimGeom(e){
  const mode=e.mode||'al';let a2,b2;
  if(mode==='h'){a2=[e.a[0],e.p[1]];b2=[e.b[0],e.p[1]]}
  else if(mode==='v'){a2=[e.p[0],e.a[1]];b2=[e.p[0],e.b[1]]}
  else{const u=nrm(sub(e.b,e.a)),n=[-u[1],u[0]],o=dot(sub(e.p,e.a),n);a2=add(e.a,mul(n,o));b2=add(e.b,mul(n,o))}
  const th=e.th||doc.th,m=dist(a2,b2),u=nrm(sub(b2,a2)),segs=[[a2,b2]],gap=th*.3,over=th*.6;
  for(const[p,q]of[[e.a,a2],[e.b,b2]]){const d=sub(q,p),l=len(d);if(l>1e-9){const n=mul(d,1/l);segs.push([add(p,mul(n,Math.min(gap,l*.5))),add(q,mul(n,over))])}}
  let tu=u;if(tu[0]<-1e-9||(Math.abs(tu[0])<1e-9&&tu[1]<0))tu=[-tu[0],-tu[1]];

function pathEnt(c,V,e){

    case'ellipse':{const q=w2s(e.c,V);c.moveTo(q[0]+Math.cos(-e.rot)*e.rx*V.s,q[1]+Math.sin(-e.rot)*e.rx*V.s);c.ellipse(q[0],q[1],Math.max(e.rx*V.s,.01),Math.max(e.ry*V.s,.01),-e.rot,0,TAU);break}
  }
}
function drawTxt(c,V,txt,p,hh,rot,align,col){

function gripsOf(e){const g=[],G=(p,k,i)=>g.push({p,k,i});switch(e.type){
  case'line':G(e.a,'a');G(e.b,'b');G(lerp(e.a,e.b,.5),'m');break;
  case'pline':case'spline':case'leader':e.pts.forEach((p,i)=>G(p,'v',i));break;
  case'adim':G(e.c,'c');G(e.a,'a');G(e.b,'b');G(e.p,'p');break;
  case'xline':G(e.p,'p');G(add(e.p,mul([Math.cos(e.ang),Math.sin(e.ang)],64/view.s)),'d');break;
  case'circle':G(e.c,'c');for(let k=0;k<4;k++)G(pol(e.c,e.r,k*Math.PI/2),'r');break;

  case'point':case'text':G(e.p,'p');break;
  case'dim':G(e.a,'a');G(e.b,'b');G(e.p,'p');break;
  case'rdim':G(e.p,'p');break;

function gripEdit(e,g,np){const n=clone(e);switch(e.type){

/* ================= Fang ================= */
function snapPts(e){const r=[];switch(e.type){

  case'pline':{const p=e.pts;p.forEach(q=>r.push([q,'end']));const n=e.closed?p.length:p.length-1;for(let i=0;i<n;i++)r.push([lerp(p[i],p[(i+1)%p.length],.5),'mid']);break}

function findSnap(wp,last,force){
  const tolW=(force?36:(coarse?24:14))/view.s,S=force?SNAP_ALL:prefs.snaps,near=[];
  for(const e of doc.ents){if(!vis(e)||e.type==='hatch')continue;const b=bbox(e);if(!b)continue;if(wp[0]<b[0]-tolW||wp[0]>b[2]+tolW||wp[1]<b[1]-tolW||wp[1]>b[3]+tolW)continue;near.push(e)}
  if(!near.length)return null;
  const C=[],push=(p,type)=>{const d=dist(p,wp);if(d<=tolW)C.push({p,type,d})};
  for(const e of near){
    for(const[p,t]of snapPts(e))if(S[t])push(p,t);
    if(e.type==='text'||e.type==='point')continue;
    if(S.nea||S.per)for(const q of prims(e)){if(S.nea)push(nearPrim(q,wp),'nea');if(S.per&&last)for(const p of footPrim(q,last))push(p,'per')}
  }
  if(S.int){const nn=near.filter(e=>e.type!=='text'&&e.type!=='point').slice(0,40);
    for(let i=0;i<nn.length;i++)for(let j=i+1;j<nn.length;j++)for(const qa of prims(nn[i]))for(const qb of prims(nn[j]))for(const p of intPP(qa,qb))push(p,'int')}
  if(!C.length)return null;
  const rank={end:0,int:.5,mid:1,cen:1,quad:1.5,per:2,nea:4};
  C.sort((a,b)=>(a.d*view.s+(rank[a.type]||0)*3)-(b.d*view.s+(rank[b.type]||0)*3));
  return C[0];
}
function snapPoint(rw,last){
  let p=rw.slice(),sn=null;
  if(prefs.osnap||shiftDown){const s=findSnap(rw,last,shiftDown);if(s){p=s.p;sn=s}}
  if(!sn&&prefs.polar&&!prefs.ortho&&last){
    const v=sub(rw,last),L=len(v),inc=(prefs.polarA||15)*D2R;
    if(L*view.s>14){const a=ang(v),k=Math.round(a/inc)*inc,dA=a-k;
      if(L*Math.abs(Math.sin(dA))*view.s<=(coarse?16:9)){p=add(last,mul([Math.cos(k),Math.sin(k)],L*Math.cos(dA)));sn={p,type:'polar',guide:{o:last,ang:k},label:`Polar ${f3(nA(k)/D2R)}°`}}}
  }

    if(prefs.gsnap){const g=doc.grid;p=[Math.round(rw[0]/g)*g,Math.round(rw[1]/g)*g];sn={p,type:'grid'}}
    if(prefs.ortho&&last){p=Math.abs(p[0]-last[0])>=Math.abs(p[1]-last[1])?[p[0],last[1]]:[last[0],p[1]];sn=null}
  }

        if(f.gt!=null&&!(n>f.gt)){err.textContent=`„${f.label}“: muss größer als ${f.gt} sein`;return null}
        if(f.max!=null&&n>f.max){err.textContent=`„${f.label}“: höchstens ${f.max}`;return null}
        o[f.k]=n;

const isPt=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite);

    case'pline':case'hatch':return Array.isArray(e.pts)&&e.pts.length>=(e.type==='hatch'?3:2)&&e.pts.every(isPt);
    case'circle':return isPt(e.c)&&isN(e.r)&&e.r>0;
    case'arc':return isPt(e.c)&&isN(e.r,e.a0,e.a1)&&e.r>0;
    case'ellipse':return isPt(e.c)&&isN(e.rx,e.ry,e.rot)&&e.rx>0&&e.ry>0;
    case'point':return isPt(e.p);
    case'text':return isPt(e.p)&&typeof e.text==='string'&&isN(e.h)&&e.h>0;
    case'dim':return isPt(e.a)&&isPt(e.b)&&isPt(e.p);
    case'rdim':return isPt(e.c)&&isN(e.r)&&isPt(e.p);
    case'spline':return Array.isArray(e.pts)&&e.pts.length>=2&&e.pts.every(isPt);
    case'leader':return Array.isArray(e.pts)&&e.pts.length>=2&&e.pts.every(isPt)&&typeof e.text==='string'&&isN(e.h)&&e.h>0;
    case'adim':return isPt(e.c)&&isPt(e.a)&&isPt(e.b)&&isPt(e.p);

      const o=[cx+nv[0]*k*sp,cy+nv[1]*k*sp],ts=[];
      for(let i=0;i<P.length;i++){

      for(let i=0;i+1<ts.length;i+=2)out.push([add(o,mul(d,ts[i])),add(o,mul(d,ts[i+1]))]);

function entSVG(e,col,sw,dash){
  const Y=p=>`${nn(p[0])},${nn(-p[1])}`,da=dash&&dash.length?` stroke-dasharray="${dash.map(v=>nn(v*(svgBase||sw)/1.4)).join(' ')}"`:'';
  const st=`fill="none" stroke="${col}" stroke-width="${nn(sw)}" stroke-linecap="round" stroke-linejoin="round"${da}`;
  switch(e.type){
    case'line':return`<line x1="${nn(e.a[0])}" y1="${nn(-e.a[1])}" x2="${nn(e.b[0])}" y2="${nn(-e.b[1])}" ${st}/>`;
    case'pline':return`<${e.closed?'polygon':'polyline'} points="${e.pts.map(Y).join(' ')}" ${st}/>`;
    case'circle':return`<circle cx="${nn(e.c[0])}" cy="${nn(-e.c[1])}" r="${nn(e.r)}" ${st}/>`;
    case'arc':{
      let span=nA(e.a1-e.a0);if(span<1e-9)return`<circle cx="${nn(e.c[0])}" cy="${nn(-e.c[1])}" r="${nn(e.r)}" ${st}/>`;

    }
    case'ellipse':return`<ellipse cx="${nn(e.c[0])}" cy="${nn(-e.c[1])}" rx="${nn(e.rx)}" ry="${nn(e.ry)}" transform="rotate(${nn(-e.rot/D2R)} ${nn(e.c[0])} ${nn(-e.c[1])})" ${st}/>`;
    case'point':{const r=sw*3;return`<g ${st}><line x1="${nn(e.p[0]-r)}" y1="${nn(-e.p[1])}" x2="${nn(e.p[0]+r)}" y2="${nn(-e.p[1])}"/><line x1="${nn(e.p[0])}" y1="${nn(-e.p[1]-r)}" x2="${nn(e.p[0])}" y2="${nn(-e.p[1]+r)}"/></g>`}
    case'text':return svgText(e.text,e.p,e.h,e.rot||0,'start',col);
    case'dim':{const g=dimGeom(e);return`<g>${g.segs.map(([p,q])=>`<line x1="${nn(p[0])}" y1="${nn(-p[1])}" x2="${nn(q[0])}" y2="${nn(-q[1])}" ${st}/>`).join('')}${svgArrow(g.a2,[-g.u[0],-g.u[1]],g.th*.9,col)}${svgArrow(g.b2,g.u,g.th*.9,col)}${svgText(g.txt,g.tp,g.th,g.rot,'middle',col)}</g>`}
    case'rdim':{const g=rdimGeom(e),[p,q]=g.segs[0];return`<g><line x1="${nn(p[0])}" y1="${nn(-p[1])}" x2="${nn(q[0])}" y2="${nn(-q[1])}" ${st}/>${svgArrow(g.edge,g.dir,g.th*.9,col)}${svgText(g.txt,g.tp,g.th,0,'start',col)}</g>`}
    case'spline':return`<polyline points="${splinePts(e).map(Y).join(' ')}" ${st}/>`;
    case'leader':{const g=leaderGeom(e);return`<g>${g.segs.map(([p,q])=>`<line x1="${nn(p[0])}" y1="${nn(-p[1])}" x2="${nn(q[0])}" y2="${nn(-q[1])}" ${st}/>`).join('')}${svgArrow(g.tip,g.dir,g.th*.9,col)}${svgText(e.text,g.p,g.th,0,g.align==='left'?'start':'end',col)}</g>`}
    case'adim':{const g=adimGeom(e),big=g.span>Math.PI?1:0;return`<g><path d="M ${Y(g.s)} A ${nn(g.r)} ${nn(g.r)} 0 ${big} 0 ${Y(g.t)}" ${st}/>${g.segs.map(([p,q])=>`<line x1="${nn(p[0])}" y1="${nn(-p[1])}" x2="${nn(q[0])}" y2="${nn(-q[1])}" ${st}/>`).join('')}${svgArrow(g.s,g.dir0,g.th*.9,col)}${svgArrow(g.t,g.dir1,g.th*.9,col)}${svgText(g.txt,g.tp,g.th,g.rot,'middle',col)}</g>`}
    case'hatch':{
      if(e.pattern==='solid')return`<polygon points="${e.pts.map(Y).join(' ')}" fill="${col}" fill-opacity=".35" stroke="none"/>`;
      return`<g stroke="${col}" stroke-width="${nn(sw*.7)}" stroke-opacity=".8" fill="none">${hatchLines(e).map(([p,q])=>`<line x1="${nn(p[0])}" y1="${nn(-p[1])}" x2="${nn(q[0])}" y2="${nn(-q[1])}"/>`).join('')}</g>`;
    }
  }
  return'';
}
function exportSVG(){
  const b=exportBox();if(!b)return;
  const w0=b[2]-b[0]||1,h0=b[3]-b[1]||1,pad=Math.max(w0,h0)*.05+1e-6,x0=b[0]-pad,y0=-(b[3]+pad),W=w0+2*pad,H=h0+2*pad,sw=Math.max(W,H)/700;

  for(const pass of[0,1])for(const e of doc.ents){

function exportPNG(){

const ACI={auto:7,red:1,yellow:2,green:3,cyan:4,blue:5,magenta:6,orange:30,gray:8};
function exportDXF(){
  if(!docBBox()){toast('Die Zeichnung ist leer');return}
  const o=[],g=(c,v)=>{o.push(String(c),String(v))},N=v=>(+(+v).toFixed(6)).toString();
  const ln=s=>{const t=String(s).replace(/[<>\/\\":;?*|=`,]/g,'_').trim().slice(0,31);return t||'0'};
  const lname=new Map(doc.layers.map(l=>[l.name,ln(l.name)]));
  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(9,'$INSUNITS');g(70,0);g(0,'ENDSEC');
  g(0,'SECTION');g(2,'TABLES');
  g(0,'TABLE');g(2,'LTYPE');g(70,1);g(0,'LTYPE');g(2,'CONTINUOUS');g(70,0);g(3,'Solid line');g(72,65);g(73,0);g(40,0);g(0,'ENDTAB');
  g(0,'TABLE');g(2,'LAYER');g(70,doc.layers.length);
  for(const L of doc.layers){g(0,'LAYER');g(2,lname.get(L.name));g(70,L.lock?4:0);g(62,(L.vis?1:-1)*(ACI[L.color]||7));g(6,'CONTINUOUS')}
  g(0,'ENDTAB');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
  const head=(t,e)=>{g(0,t);g(8,lname.get(e.layer)||'0');if(e.color&&ACI[e.color])g(62,ACI[e.color])};
  const LINE=(e,p,q)=>{head('LINE',e);g(10,N(p[0]));g(20,N(p[1]));g(30,0);g(11,N(q[0]));g(21,N(q[1]));g(31,0)};
  const POLY=(e,pts,closed)=>{head('POLYLINE',e);g(66,1);g(10,0);g(20,0);g(30,0);g(70,closed?1:0);for(const p of pts){g(0,'VERTEX');g(8,lname.get(e.layer)||'0');g(10,N(p[0]));g(20,N(p[1]));g(30,0)}g(0,'SEQEND');g(8,lname.get(e.layer)||'0')};
  const TXT=(e,txt,p,hh,rot)=>{const ls=String(txt).split('\n'),d=[Math.sin(rot),-Math.cos(rot)];ls.forEach((l,i)=>{if(!l)return;const q=add(p,mul(d,i*1.25*hh));head('TEXT',e);g(10,N(q[0]));g(20,N(q[1]));g(30,0);g(40,N(hh));g(1,l.replace(/\u00b0/g,'%%d').replace(/\u00d8/g,'%%c').replace(/\u00b1/g,'%%p'));g(50,N(nA(rot)/D2R))})};

      case'circle':head('CIRCLE',e);g(10,N(e.c[0]));g(20,N(e.c[1]));g(30,0);g(40,N(e.r));break;
      case'arc':{if(nA(e.a1-e.a0)<1e-9){head('CIRCLE',e);g(10,N(e.c[0]));g(20,N(e.c[1]));g(30,0);g(40,N(e.r))}else{head('ARC',e);g(10,N(e.c[0]));g(20,N(e.c[1]));g(30,0);g(40,N(e.r));g(50,N(nA(e.a0)/D2R));g(51,N(nA(e.a1)/D2R))}break}
      case'ellipse':POLY(e,ellPts(e,96).slice(0,-1),true);break;
      case'point':head('POINT',e);g(10,N(e.p[0]));g(20,N(e.p[1]));g(30,0);break;
      case'text':TXT(e,e.text,e.p,e.h,e.rot||0);break;

      case'rdim':{const q=rdimGeom(e);LINE(e,q.segs[0][0],q.segs[0][1]);ARR(e,q.edge,q.dir,q.th*.9);TXT(e,q.txt,q.tp,q.th,0);break}

      case'adim':{const q=adimGeom(e);if(q.span>=TAU-1e-9){head('CIRCLE',e);g(10,N(q.c[0]));g(20,N(q.c[1]));g(30,0);g(40,N(q.r))}else{head('ARC',e);g(10,N(q.c[0]));g(20,N(q.c[1]));g(30,0);g(40,N(q.r));g(50,N(nA(q.a0)/D2R));g(51,N(nA(q.a1)/D2R))}for(const[p,r]of q.segs)LINE(e,p,r);ARR(e,q.s,q.dir0,q.th*.9);ARR(e,q.t,q.dir1,q.th*.9);const w=.6*q.th*q.txt.length;TXT(e,q.txt,sub(q.tp,mul([Math.cos(q.rot),Math.sin(q.rot)],w/2)),q.th,q.rot);break}

}

/* ================= Anleitung ================= */
function helpDialog(){
  const d=h('div',{class:'help'});
  d.innerHTML=`
<h3>Willkommen bei Helix Web-CAD</h3>
<p>Ein 2D-CAD-Programm im Browser: zeichnen, ändern, bemaßen, schraffieren, in Ebenen ordnen, speichern, laden und exportieren. Es ist ein Nachbau im Stil klassischer 2D-CAD-Programme – Dateien des ursprünglichen Helix-Programms lassen sich nicht öffnen.</p>
<h3>1 · Schnellstart</h3>
<ul>
<li>In der <b>Symbolleiste oben</b> ein Werkzeug anklicken, z. B. <b>Linie</b>. Die Symbole sind gruppiert (<b>Zeichnen</b>, <b>Ändern</b>, <b>Beschriften</b>, <b>Ansicht</b>); das aktive Werkzeug ist farbig hervorgehoben. Maus darauf halten (am Handy: lange drücken) zeigt Name, Kürzel und Kurzbeschreibung. Am Handy lässt sich die Leiste seitlich wischen.</li>
<li>In die Zeichenfläche tippen/klicken, um Punkte zu setzen. Die Zeile über der Leiste zeigt immer, was als Nächstes erwartet wird.</li>
<li><b>Enter</b> (Button „OK“ mit leerem Feld) beendet oder wiederholt einen Schritt, <b>Esc</b> bricht ab.</li>
<li>Oben rechts: <b>Datei</b> (Neu, Öffnen, Speichern, Export), <b>↶ ↷</b> Rückgängig/Wiederholen, <b>Ebenen</b> (Seitenleiste), <b>?</b> diese Anleitung.</li>
</ul>
<h3>2 · Bedienung</h3>
<table>
<tr><td>Maus</td><td>Linksklick = Punkt/Auswahl · Rad = Zoom · Mitteltaste ziehen = Pan · Rechtsklick = Enter</td></tr>
<tr><td>Touch</td><td>Tippen = Punkt setzen · Finger ziehen = Fangring folgt, Loslassen setzt den Punkt dort (so lässt sich genau zielen) · mit zwei Fingern ziehen und zoomen</td></tr>
<tr><td>Auswahl</td><td>Objekt antippen · Fenster von links nach rechts = nur vollständig umschlossene Objekte (blau) · von rechts nach links = auch berührte (grün) · <b>Mehrfach</b>-Schalter oder Shift = zur Auswahl hinzufügen/entfernen</td></tr>
<tr><td>Griffe</td><td>Ein gewähltes Objekt zeigt Griffe (blaue Quadrate). Griff ziehen = Form oder Lage ändern (Endpunkte, Mitte, Radius …)</td></tr>
</table>
<h3>3 · Zeichnen</h3>
<table>
<tr><td>L</td><td>Linie (U = zurück, C = schließen)</td></tr>
<tr><td>PL</td><td>Polylinie (U, C, Enter = fertig)</td></tr>
<tr><td>REC</td><td>Rechteck (Gegenecke auch als <code>@Breite,Höhe</code>)</td></tr>
<tr><td>C</td><td>Kreis (Radius tippen oder klicken; D schaltet Ø um) · C2 = 2 Punkte · C3 = 3 Punkte</td></tr>
<tr><td>A</td><td>Bogen 3 Punkte · Bogen Mitte-Start-Ende in der Symbolleiste</td></tr>
<tr><td>EL</td><td>Ellipse (Mitte, Achsenende, Nebenachse)</td></tr>
<tr><td>POL</td><td>Regelmäßiges Polygon (Eckenzahl, Mitte, Radius; C/I umschrieben/einbeschrieben)</td></tr>
<tr><td>PO</td><td>Punkt</td></tr>
<tr><td>SPL</td><td>Spline: glatte Kurve durch Stützpunkte (U, C, Enter)</td></tr>
<tr><td>XL</td><td>Konstruktionslinie: unendliche Hilfslinie (H = waagerecht, V = senkrecht, sonst zwei Punkte). Wird nicht gedruckt oder exportiert, dient aber als Fang- und Schnittkante.</td></tr>
</table>
<h3>4 · Ändern</h3>
<table>
<tr><td>M</td><td>Verschieben (Objekte wählen, Enter, Basispunkt, Ziel)</td></tr>
<tr><td>CO</td><td>Kopieren (mehrfach, Enter = Ende)</td></tr>
<tr><td>RO</td><td>Drehen (Winkel in ° tippen oder Punkt; K = Kopie)</td></tr>
<tr><td>SC</td><td>Skalieren (Faktor, z. B. 2 oder 0.5)</td></tr>
<tr><td>MI</td><td>Spiegeln an einer Achse aus zwei Punkten</td></tr>
<tr><td>O</td><td>Versetzen (Abstand, Objekt, Seite anklicken)</td></tr>
<tr><td>TR</td><td>Stutzen – den Teil anklicken, der wegfallen soll</td></tr>
<tr><td>EX</td><td>Dehnen – Linie/Bogen am Ende anklicken, das bis zur nächsten Kante verlängert wird</td></tr>
<tr><td>F</td><td>Abrunden (Radius, zwei Linien) · CHA = Fase</td></tr>
<tr><td>X</td><td>Polylinie in Linien auflösen · J = Linien zu Polylinie verbinden</td></tr>
<tr><td>AR / ARP</td><td>Rechteckige / polare Reihe (Dialog)</td></tr>
<tr><td>STR</td><td>Strecken: Objekte mit einem Fenster von <b>rechts nach links</b> wählen, Enter, Basis- und Zielpunkt. Nur Punkte im Fenster wandern mit.</td></tr>
<tr><td>BR</td><td>Brechen: Objekt am ersten Punkt anklicken, zweiten Punkt wählen (Enter = nur trennen). Linie, Bogen, Kreis, Polylinie.</td></tr>
<tr><td>VI / VL</td><td>Punkt in Polylinie oder Spline einfügen / löschen</td></tr>
<tr><td>E</td><td>Löschen (oder Entf-Taste bei gewählten Objekten)</td></tr>
</table>
<h3>5 · Beschriften &amp; Messen</h3>
<ul>
<li><b>Text</b>: Einfügepunkt setzen, dann Text, Höhe und Winkel im Dialog eingeben.</li>
<li><b>Bemaßung</b> ausgerichtet / horizontal / vertikal: zwei Punkte, dann die Lage der Maßlinie. <b>Radius/Ø</b>: Kreis oder Bogen wählen, Textlage setzen.</li>
<li><b>Schraffur</b>: geschlossene Polylinie oder Kreis wählen; Muster, Abstand und Winkel im Dialog.</li>
<li><b>Hinweislinie</b> (LE): Pfeilspitze und Knickpunkte setzen, Enter, dann Text eingeben. <b>Winkelmaß</b> (AD): Scheitel, je ein Punkt pro Schenkel, dann die Lage des Maßbogens.</li>
<li><b>Abstand</b> und <b>Fläche</b> zeigen das Ergebnis kurz oben im Bild an.</li>
</ul>
<h3>6 · Koordinaten-Eingabe</h3>
<p>Wenn ein Punkt erwartet wird, kann er in das Eingabefeld getippt werden:</p>
<table>
<tr><td>10,20</td><td>absolut: X = 10, Y = 20</td></tr>
<tr><td>@5,3</td><td>relativ zum letzten Punkt</td></tr>
<tr><td>@10&lt;45</td><td>relativ, Länge 10 im Winkel 45° (0° = nach rechts, gegen den Uhrzeigersinn)</td></tr>
<tr><td>12.5</td><td>nur eine Zahl: Abstand vom letzten Punkt in Richtung Mauszeiger (bei Kreis: Radius)</td></tr>
</table>
<p>Dezimal-Komma oder -Punkt sind beide erlaubt. Ein Befehlskürzel (siehe oben) im Feld startet das Werkzeug; leeres Enter wiederholt den letzten Befehl.</p>
<h3>7 · Objektfang &amp; Hilfen</h3>
<ul>
<li><b>Objektfang</b> rastet auf Endpunkte (Quadrat), Mittelpunkte (Dreieck), Zentren (Kreis), Schnittpunkte (X), Quadranten (Raute) und optional Lot/Nächster Punkt ein. Arten wählbar unter <b>⚙ Fang</b>.</li>
<li><b>Shift gedrückt halten</b> (Maus/Tastatur): Objektfang wird vorübergehend mit <b>allen</b> Fangarten (inkl. Lot) und größerem Fangradius eingeschaltet – auch wenn „Objektfang“ aus ist. Praktisch z. B. beim Linienzeichnen.</li>
<li><b>Polar</b> (Chip „Polar“): Beim Zeichnen rastet der Cursor auf Winkelschritte (Standard 15°) ein und zeigt eine gestrichelte Hilfslinie mit dem Winkel. Der Schritt ist unter Einstellungen wählbar. Objektfang hat Vorrang; bei aktivem Ortho ist Polar aus.</li>
<li><b>Rasterfang</b> rastet auf das Raster (Größe unter Einstellungen). <b>Ortho</b> erzwingt waagerecht/senkrecht. <b>Gitter</b> blendet das Raster ein/aus.</li>
</ul>
<h3>8 · Ebenen &amp; Eigenschaften</h3>
<ul>
<li>Seitenleiste <b>Ebenen</b>: neue Ebene anlegen, umbenennen, Farbe und Linientyp wählen, ein-/ausblenden, sperren, leere Ebenen löschen. Neue Objekte landen auf der aktuellen Ebene (●).</li>
<li><b>Eigenschaften</b>: ein gewähltes Objekt zeigt Koordinaten, Radius, Winkel usw. als Zahlenfelder – Wert ändern und bestätigen. Ebene und Farbe lassen sich auch für mehrere Objekte zugleich ändern. Länge, Fläche und Umfang stehen unter „Info“.</li>
<li><b>Einstellungen</b>: Zeichnungsname, Raster, Texthöhe, Nachkommastellen, hell/dunkel, Fangarten.</li>
</ul>
<h3>9 · Strichstärken</h3>
<p>Jede Ebene hat eine Strichstärke (Standard 0,25 mm); einzelne Objekte können sie unter <b>Eigenschaften</b> überschreiben. Der Chip „Strichstärke“ schaltet die Anzeige am Bildschirm um. Im PDF, SVG und PNG werden die Stärken berücksichtigt. Das DXF-Format dieses Tools speichert keine Strichstärken.</p>
<h3>10 · Hintergrundbild (Unterlage)</h3>
<ul>
<li><b>Bild laden</b> (Symbol in der Leiste, Datei-Menü oder ein Bild auf die Fläche ziehen): JPG, PNG oder WebP. Große Bilder werden auf max. 2400 px verkleinert.</li>
<li><b>Maßstab setzen</b>: zwei Punkte einer bekannten Strecke im Bild wählen und die echte Länge eingeben – das Bild wird passend skaliert.</li>
<li><b>Verschieben</b> und <b>Ausrichten</b> (zwei Punkte einer Linie im Bild, z. B. einer Wand, die waagerecht sein soll). Deckkraft und Sichtbarkeit stehen unter Einstellungen.</li>
<li>Das Bild wird mit der Zeichnung gespeichert (.json). Der automatische Browser-Speicher hält es nur, wenn es klein genug ist.</li>
</ul>
<h3>11 · Symbol-Bibliothek</h3>
<p>Symbol in der Leiste (oder Datei ▸ Symbol-Bibliothek): Ventile, Pumpe, Behälter, Nordpfeil, Tür, Fenster u. a. Größenfaktor und Drehung vorher einstellen; beim Platzieren geht auch <code>R</code> (+90°), <code>R45</code> und <code>S2</code>. Eigene Objekte als Symbol speichern: Objekte wählen, Symbol-Bibliothek ▸ „Auswahl als Symbol speichern“.</p>
<h3>12 · Zeichnungsrahmen &amp; Schriftfeld</h3>
<ul>
<li><b>Einfügen</b> (Symbol „Rahmen“ oder Datei-Menü): Papierformat, Ausrichtung, Maßstab 1 : N und Zeichnungseinheit wählen, Schriftfeld ausfüllen, dann die untere linke Blattecke setzen. Der Rahmen wird in Zeichnungseinheiten so groß angelegt, dass er beim gewählten Maßstab genau auf das Papier passt.</li>
<li><b>Schriftfeld ändern</b>: Datei ▸ „Schriftfeld ausfüllen“ (oder unter Eigenschaften, wenn der Rahmen gewählt ist). Firma, Gezeichnet und Geprüft werden für den nächsten Rahmen gemerkt.</li>
<li>Der Rahmen besteht aus normalen Linien und Texten auf der Ebene „Rahmen“. Alles lässt sich verschieben, kopieren oder einzeln bearbeiten.</li>
<li><b>PDF</b>: Im PDF-Dialog unter „Bereich“ den Zeichnungsrahmen wählen. Dann gelten Blattgröße und Maßstab des Rahmens, ein zweites Schriftfeld wird nicht gedruckt.</li>
</ul>
<h3>13 · Speichern &amp; Laden</h3>
<p><b>Zeichnungen von einer KI erstellen lassen:</b> Datei ▸ „KI-Anleitung (.md)“ laden und zusammen mit der Aufgabe an eine KI geben. Sie beschreibt das JSON-Format vollständig; die Antwort der KI speicherst du als <code>.json</code> und öffnest sie hier.</p>
<table>
<tr><td>Speichern</td><td>Datei ▸ Speichern (.json) lädt die Zeichnung als Datei herunter. Das ist das vollständige, wieder ladbare Format.</td></tr>
<tr><td>Öffnen</td><td>Datei ▸ Öffnen wählt eine .json-Datei aus; alternativ eine Datei auf die Zeichenfläche ziehen.</td></tr>
<tr><td>Browser</td><td>Datei ▸ Browser-Speicher legt benannte Zeichnungen im Browser ab (praktisch zum Zwischenspeichern). Außerdem wird automatisch gesichert und beim nächsten Start wiederhergestellt.</td></tr>
<tr><td>Notlösung</td><td>Falls der Datei-Download in deiner Umgebung blockiert ist: „JSON als Text“ kopieren und später mit „JSON einfügen“ laden.</td></tr>
<tr><td>DXF-Import</td><td>Datei ▸ Öffnen oder DXF importieren (auch per Drag &amp; Drop): Linien, Kreise, Bögen, Polylinien (inkl. Bogensegmente), Ellipsen, Splines (als Polylinie), Texte, Punkte, Blöcke (INSERT) und Bemaßungen (als Einzelobjekte) samt Ebenen und Farben. Nicht unterstützt: DWG, binäres DXF, Schraffuren, Bilder. Beim Import kannst du wählen: neue Zeichnung oder zur aktuellen hinzufügen.</td></tr>
<tr><td>Export</td><td><b>PDF</b> (Papierformat A0–A5/Letter, Maßstab, Schriftfeld, Vorschau), SVG (Vektor), PNG (Bild) und DXF für andere CAD-Programme (Linien, Kreise, Bögen, Polylinien, Texte; Ellipsen als Polylinie, Bemaßung und Schraffur als Einzelobjekte). Im Desktop-Browser wird direkt eine <code>.dxf</code> gespeichert; in der Claude-Vorschau heißt sie <code>.dxf.txt</code> und muss umbenannt werden.</td></tr>
</table>
<p>Öffnen/Neu sind rückgängig machbar (Strg+Z), falls du versehentlich die aktuelle Zeichnung ersetzt.</p>
<h3>14 · Tastenkürzel</h3>
<table>
<tr><td>Strg+Z / Y</td><td>Rückgängig / Wiederholen</td></tr>
<tr><td>Strg+A</td><td>Alles wählen</td></tr>
<tr><td>Strg+C / V</td><td>Kopieren in Ablage / Einfügen</td></tr>
<tr><td>Strg+S / O</td><td>Speichern / Öffnen</td></tr>
<tr><td>Shift (halten)</td><td>Alle Fangpunkte automatisch nutzen</td></tr>
<tr><td>Entf</td><td>Gewählte Objekte löschen</td></tr>
<tr><td>Enter / Leertaste</td><td>Bestätigen / Befehl wiederholen</td></tr>

<tr><td>Z · ZW · ZI · ZO</td><td>Befehle im Eingabefeld: Alles zeigen · Zoom Fenster · Zoom + · Zoom −</td></tr>
</table>

<h3>15 · Hinweise</h3>
<ul>
<li>Maße sind einheitenlos (1 Einheit = 1 mm, cm oder m – wie du es festlegst).</li>
<li>Stutzen/Dehnen funktionieren mit Linien, Bögen und Kreisen; Polylinien werden dafür zuerst aufgelöst.</li>

          const w=0.6*hh*Math.max(...tx.split('\n').map(l=>l.length)),sx=h72===2?1:(h72===1||h72===3||h72===4)?.5:0,sy=v73===3?1:v73===2?.5:0;
          p=sub(sub(p,mul([Math.cos(rot),Math.sin(rot)],sx*w)),mul([-Math.sin(rot),Math.cos(rot)],sy*hh));

        const raw=r.g.filter(p=>p[0]===3).map(p=>p[1]).join('')+(dxG(r,1)||''),tx=dxfText(raw,true),hh=dxN(r,40);
        if(!(hh>0)||!tx.trim())break;
        let rot=dxN(r,50,0)*D2R;if(dxG(r,11)!==undefined&&dxG(r,50)===undefined)rot=Math.atan2(dxN(r,21),dxN(r,11));
        const ap=clamp(Math.round(dxN(r,71,1)),1,9),cl=(ap-1)%3,rw=Math.floor((ap-1)/3),lines=tx.split('\n'),H=lines.length*1.25*hh,w=0.6*hh*Math.max(...lines.map(l=>l.length));

          const Mi={a:A,b:B,c:C,d:D,e:ox-A*blk.base[0]-C*blk.base[1],f:oy-B*blk.base[0]-D*blk.base[1]};

}
function dxfParse(txt){
  const secs=dxfRecords(dxfPairs(txt));
  if(!secs.ENTITIES&&!secs.BLOCKS)throw new Error('Keine Zeichnungsdaten in der DXF-Datei gefunden.');
  const tab=dxfLayers(secs.TABLES),env={out:[],layers:new Set(),blocks:dxfBlocks(secs.BLOCKS||[]),sk:{},n:0,skip(t){this.sk[t]=(this.sk[t]||0)+1}};
  dxfConv(secs.ENTITIES||[],null,{layer:null,color:undefined},env,0);
  const layers=[],seen=new Set();
  const l0=tab.find(l=>l.name==='0')||{name:'0',color:'auto',vis:true,lock:false,lt:'solid'};layers.push(l0);seen.add('0');
  for(const l of tab)if(!seen.has(l.name)&&env.layers.has(l.name)){layers.push(l);seen.add(l.name)}
  for(const n of env.layers)if(!seen.has(n)){layers.push({name:n,color:'auto',vis:true,lock:false,lt:'solid'});seen.add(n)}
  let bb=null;
  for(const e of env.out){const q=bbox(e);if(!q||!q.every(Number.isFinite))continue;bb=bb?[Math.min(bb[0],q[0]),Math.min(bb[1],q[1]),Math.max(bb[2],q[2]),Math.max(bb[3],q[3])]:q}
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
  const ext=bb?Math.max(bb[2]-bb[0],bb[3]-bb[1]):0;
  return{ents:env.out,layers,skipped:env.sk,grid:ext>0?nice(ext/60):10,th:ext>0?nice(ext/100):5};
}
function importDxf(txt,fname){
  let r;try{r=dxfParse(txt)}catch(e){toast(e.message,4500);return}
  const sk=Object.entries(r.skipped).map(([k,v])=>`${k} ×${v}`).join(', ');
  if(!r.ents.length){toast('Keine unterstützten Objekte in der DXF-Datei gefunden.'+(sk?` (übersprungen: ${sk})`:''),5000);return}
  const name=String(fname||'DXF-Import').replace(/(\.dxf)?(\.txt)?$/i,'').slice(0,60)||'DXF-Import';
  const msg=n=>`DXF importiert: ${n} Objekte${sk?` · nicht unterstützt: ${sk}`:''}`;
  const apply=mode=>{
    if(mode==='merge'){
      cancelTool();pushUndo();
      for(const L of r.layers)if(!doc.layers.some(x=>x.name===L.name))doc.layers.push(L);
      for(const e of r.ents)rawAdd(e);
      sel=new Set();zoomExt();afterDoc();updPrompt();toast(msg(r.ents.length)+' – ↶ macht es rückgängig',6000);
    }else{
      try{
        const res=loadFromText(JSON.stringify({format:FORMAT,version:1,doc:{name,cur:'0',grid:r.grid,th:r.th,dec:2,layers:r.layers,ents:r.ents}}));
        toast(msg(res.count)+' – ↶ macht es rückgängig',6000);
      }catch(e){toast(e.message,4500)}
    }
  };
  if(!doc.ents.length){apply('replace');return}
  dialog('DXF importieren',[{k:'mode',label:'Wie öffnen?',type:'select',value:'replace',opts:[['replace','Als neue Zeichnung (ersetzt die aktuelle)'],['merge','Zur aktuellen Zeichnung hinzufügen']],hint:`${r.ents.length} Objekte in „${name}“ gefunden.`}],v=>{if(v)apply(v.mode)},'Importieren');
}

/* ================= Hintergrundbild ================= */
let bgImg=null,bgSrc=null;
function bgSync(){
  if(!doc.bg){bgImg=null;bgSrc=null;return null}
  if(doc.bg.data!==bgSrc){bgSrc=doc.bg.data;const im=new Image();bgImg=im;im.onload=()=>redraw();im.onerror=()=>{if(bgImg===im)bgImg=null};im.src=doc.bg.data}
  return bgImg&&bgImg.complete&&bgImg.naturalWidth?bgImg:null;
}
function bgMat(V,g=doc.bg){
  const co=Math.cos(g.rot),si=Math.sin(g.rot),k=V.s*g.s;
  return[k*co,-k*si,k*si,k*co,V.ox+V.s*(g.p[0]-g.s*si*g.h),V.oy-V.s*(g.p[1]+g.s*co*g.h)];
}
function drawBg(c,V,alpha){
  const im=bgSync();if(!im)return;
  c.save();c.globalAlpha=alpha==null?.6:alpha;c.transform(...bgMat(V));c.imageSmoothingQuality='high';c.drawImage(im,0,0,doc.bg.w,doc.bg.h);c.restore();
}
function bgQuad(g=doc.bg){
  const co=Math.cos(g.rot),si=Math.sin(g.rot),W=g.w*g.s,H=g.h*g.s;
  return[[0,0],[W,0],[W,H],[0,H]].map(q=>[g.p[0]+q[0]*co-q[1]*si,g.p[1]+q[0]*si+q[1]*co]);
}
function plotBBox(withBg=true){
  let b=docBBox();
  if(withBg&&doc.bg&&doc.bg.vis){
    const q=bgQuad(),xs=q.map(p=>p[0]),ys=q.map(p=>p[1]),c=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
    b=b?[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[2]),Math.max(b[3],c[3])]:c;
  }
  return b;
}
function loadBgFile(file){
  if(!file)return;
  if(file.size>40*1024*1024){toast('Bild ist zu groß (max. 40 MB)');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('Bild konnte nicht gelesen werden');
  fr.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Dieses Bildformat wird nicht unterstützt (JPG, PNG oder WebP verwenden)');
    im.onload=()=>{
      const MAXS=2400,k=Math.min(1,MAXS/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),hh=Math.max(1,Math.round(im.naturalHeight*k));
      const c2=document.createElement('canvas');c2.width=w;c2.height=hh;const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,hh);g.drawImage(im,0,0,w,hh);
      let data;try{data=c2.toDataURL('image/jpeg',.88)}catch(e){toast('Bild konnte nicht verarbeitet werden');return}
      const W=stage.clientWidth,H=stage.clientHeight,s=(W/view.s*.6)/w,c=s2w(W/2,H/2);
      doc.bg={name:String(file.name||'Bild').slice(0,60),data,w,h:hh,p:[c[0]-w*s/2,c[1]-hh*s/2],s,rot:0,op:.6,vis:true};
      dirty();renderSide();redraw();
      toast('Bild geladen – mit „Maßstab setzen“ auf die echte Größe bringen',5500);
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function bgToggle(){

/* --- Brechen --- */
function doBreak(e,p1,p2){
  const parts=[];
  if(e.type==='line'){
    const d=sub(e.b,e.a),L2=dot(d,d);if(L2<EPS)return;
    const tf=p=>clamp(dot(sub(p,e.a),d)/L2,0,1);let t1=tf(p1),t2=p2?tf(p2):t1;if(t1>t2)[t1,t2]=[t2,t1];
    if(t1>1e-9)parts.push(cp(e,{b:add(e.a,mul(d,t1))}));
    if(t2<1-1e-9)parts.push(cp(e,{a:add(e.a,mul(d,t2))}));
  }else if(e.type==='arc'){
    let span=nA(e.a1-e.a0);if(span<1e-9)span=TAU;
    const tf=p=>clamp(nA(ang(sub(p,e.c))-e.a0),0,span);let t1=tf(p1),t2=p2?tf(p2):t1;if(t1>t2)[t1,t2]=[t2,t1];
    if(t1>1e-9)parts.push(cp(e,{a1:e.a0+t1}));
    if(t2<span-1e-9)parts.push(cp(e,{a0:e.a0+t2,a1:e.a0+span}));
  }else if(e.type==='circle'){
    if(!p2){toast('Beim Kreis zwei Brechpunkte setzen');return}
    const A=ang(sub(p1,e.c)),B=ang(sub(p2,e.c));
    if(Math.abs(nA(A-B))<1e-9){toast('Die Punkte dürfen nicht zusammenfallen');return}
    parts.push(mkLike(e,{type:'arc',c:e.c,r:e.r,a0:B,a1:A}));
  }else if(e.type==='pline'){
    const P=e.pts,n=P.length,m=e.closed?n:n-1;
    const loc=p=>{let bi=0,bt=0,bd=Infinity;for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%n],d=sub(b,a),L2=dot(d,d),t=L2?clamp(dot(sub(p,a),d)/L2,0,1):0,dd=dist(p,add(a,mul(d,t)));if(dd<bd){bd=dd;bi=i;bt=t}}return{i:bi,t:bt,pos:bi+bt,pt:add(P[bi],mul(sub(P[(bi+1)%n],P[bi]),bt))}};
    let A=loc(p1),B=p2?loc(p2):A;if(A.pos>B.pos)[A,B]=[B,A];
    const push=pts=>{const q=pts.filter((x,i)=>!i||dist(x,pts[i-1])>1e-9);if(q.length>=2)parts.push(mkLike(e,{type:'pline',pts:q,closed:false}))};
    if(!e.closed){push([...P.slice(0,A.i+1),A.pt]);push([B.pt,...P.slice(B.i+1)])}
    else if(!p2)push([A.pt,...P.slice(A.i+1),...P.slice(0,A.i+1),A.pt]);
    else push([B.pt,...P.slice(B.i+1),...P.slice(0,A.i+1),A.pt]);
  }

function fillFrameDialog(){
  const fr=framesInDoc();
  if(!fr.length){toast('Noch kein Zeichnungsrahmen vorhanden (Symbol „Zeichnungsrahmen“)');return}
  let fe=null;
  for(const id of sel){const e=byId(id);if(!e)continue;if(e.frame){fe=e;break}if(e.fld){fe=fr.find(x=>{const r=frameSheetRect(x);return e.p[0]>=r[0]&&e.p[0]<=r[2]&&e.p[1]>=r[1]&&e.p[1]<=r[3]});if(fe)break}}
  if(!fe&&fr.length===1)fe=fr[0];
  if(fe)return fillFrame(fe);
  dialog('Welcher Rahmen?',[{k:'i',label:'Rahmen',type:'select',value:0,opts:fr.map((e,i)=>[i,`Rahmen ${i+1}: ${e.frame.size} ${e.frame.orient==='landscape'?'quer':'hoch'}, 1:${e.frame.N}`])}],r=>{if(r)fillFrame(fr[+r.i])},'Weiter');
}

/* Rahmen-Anforderung aus der JSON-Datei ("frames": [...]) -> Rahmen-Definition */
function frameFromRequest(r){
  if(!r||typeof r!=='object')return null;
  const size=PAPER[r.size]?r.size:'A3',orient=r.orient==='portrait'?'portrait':'landscape',N=Number.isFinite(r.scale)&&r.scale>0?r.scale:50,UN={mm:1,cm:10,m:1000};
  let unit=typeof r.unit==='string'?UN[r.unit.toLowerCase()]:r.unit;if(![1,10,1000].includes(unit))unit=1;
  let[w,hh]=PAPER[size];if(orient==='landscape'&&w<hh)[w,hh]=[hh,w];if(orient==='portrait'&&w>hh)[w,hh]=[hh,w];
  const m=Math.min(10,w/20),def={size,orient,N,unit,m,mL:r.binding===false?m:Math.max(20,m),w,h:hh};
  if(def.w-def.m-def.mL<60||def.h-2*def.m<50)return null;
  const vals={},F=r.fields&&typeof r.fields==='object'?r.fields:{};
  for(const[k]of FR_FIELDS)vals[k]=typeof F[k]==='string'||Number.isFinite(F[k])?String(F[k]).slice(0,80):'';
  if(!vals.mass.trim())vals.mass=fmtScale(N);
  return{def,vals,origin:isPt(r.origin)?r.origin:[0,0]};
}

/* Eingebettete KI-Anleitung (Markdown) */
const AI_GUIDE="# Helix Web-CAD – Anleitung zum JSON-Format (für KI-Assistenten)\n\nDiese Datei beschreibt vollständig, wie eine Zeichnung für **Helix Web-CAD** (2D-CAD im Browser) als `.json`-Datei aufgebaut ist.\nEin KI-Assistent, der diese Datei erhält, kann daraus eine komplette Zeichnung erzeugen, die der Nutzer direkt in Helix öffnet (Datei ▸ „Öffnen …“, oder per Drag & Drop, oder Datei ▸ „JSON einfügen“).\n\n---\n\n## 0. Auftrag an die KI (bitte zuerst lesen)\n\n1. Erzeuge **genau ein JSON-Objekt** nach dieser Anleitung. Gib es als einen einzigen Codeblock (```` ```json ````) oder als reine Datei aus. Vor und nach dem Block höchstens ein kurzer Satz.\n2. **Keine Kommentare** im JSON, **keine Kommas nach dem letzten Element**, nur doppelte Anführungszeichen, Dezimalpunkt (nicht Komma), Zahlen als Zahlen (nicht als Text).\n3. **Winkel immer im Bogenmaß (Radiant)**, nie in Grad (siehe Abschnitt 1).\n4. **Die y-Achse zeigt nach oben** (wie in der Mathematik, nicht wie in Bildschirm-Pixeln oder SVG).\n5. Berechne alle Koordinaten selbst und lege sie vollständig ab. Es gibt **keine Verweise, Variablen, Ausdrücke oder Schleifen** im Format. Jedes Objekt (z. B. jede der vier Bohrungen) wird einzeln aufgeführt.\n6. Halte dich an die erlaubten Werte (Ebenenfarben, Linienarten, Typen). Unbekannte Werte werden von Helix stillschweigend ersetzt oder das Objekt wird übersprungen.\n7. Fehlen dir Maße oder Angaben (Einheit, Maßstab, Papierformat, Beschriftung), **frage nach** oder triff eine klar benannte Annahme und nenne sie kurz.\n8. Prüfe das Ergebnis vor der Ausgabe mit der Checkliste in Abschnitt 9.\n\n---\n\n## 1. Grundlagen\n\n| Thema | Regel |\n|---|---|\n| Koordinatensystem | kartesisch, Ursprung (0, 0), **x nach rechts, y nach oben** |\n| Punkte | immer als Liste mit zwei Zahlen: `[x, y]` |\n| Einheiten | **einheitenlos**. 1 Einheit ist, was du festlegst (empfohlen: 1 Einheit = 1 mm). Mit Zeichnungsrahmen (`frames`) wird die Einheit dort angegeben. |\n| Winkel | **Bogenmaß (rad)**, 0 = Richtung +x, positiv = **gegen den Uhrzeigersinn**. Umrechnung: rad = Grad × π / 180 (90° = 1.570796, 180° = 3.141593, 270° = 4.712389, 45° = 0.785398) |\n| Zahlen | endliche Zahlen (kein `NaN`, kein `Infinity`), Dezimalpunkt, höchstens ca. 4 Nachkommastellen nötig |\n| Text | UTF-8. Umlaute, `Ø`, `°`, `±`, `×`, `²`, `³`, `µ`, `–` sind unproblematisch. Zeichen außerhalb von Windows-1252 (z. B. Emojis, griechische Buchstaben) erscheinen im PDF als `?` und sollten vermieden werden. |\n| Zeichenreihenfolge | Reihenfolge in `ents`; Schraffuren werden immer **hinter** die übrigen Objekte gezeichnet |\n| Größenordnung | tausende Objekte sind unproblematisch; Dateigröße max. 60 MB |\n\n---\n\n## 2. Aufbau der Datei\n\n```json\n{\n \"format\": \"helix-web-cad\",\n \"version\": 1,\n \"doc\": {\n  \"name\": \"Zeichnungsname\",\n  \"cur\": \"Kontur\",\n  \"grid\": 5,\n  \"th\": 3.5,\n  \"dec\": 2,\n  \"layers\": [ ... ],\n  \"ents\": [ ... ],\n  \"frames\": [ ... ]\n }\n}\n```\n\n| Feld | Pflicht | Bedeutung |\n|---|---|---|\n| `format` | empfohlen | immer `\"helix-web-cad\"` |\n| `version` | empfohlen | immer `1` |\n| `doc.name` | nein | Name der Zeichnung, max. 60 Zeichen (Standard: „Zeichnung 1“). Wird auch als Dateiname beim Speichern genutzt. |\n| `doc.cur` | nein | Name der Ebene, auf der der Nutzer neue Objekte zeichnet. Muss in `layers` existieren, sonst `\"0\"`. |\n| `doc.grid` | nein | Rastergröße (Zahl > 0, Standard 10) |\n| `doc.th` | nein | Standard-Texthöhe für **Bemaßungen und Hinweislinien** (Zahl > 0, Standard 5). Siehe Abschnitt 8. |\n| `doc.dec` | nein | Nachkommastellen in Maßtexten, ganze Zahl 0–6 (Standard 2; überflüssige Nullen werden entfernt) |\n| `doc.layers` | nein | Liste der Ebenen (Abschnitt 3). Ebene `\"0\"` existiert immer. |\n| `doc.ents` | **ja** | Liste der Zeichnungsobjekte (Abschnitt 4–5). Darf leer sein, muss aber ein Array sein. |\n| `doc.frames` | nein | Eingabe für Zeichnungsrahmen mit Schriftfeld (Abschnitt 6). Wird beim Laden in normale Objekte umgewandelt. |\n\nNicht erzeugen (von Helix selbst verwaltet oder für die KI ungeeignet): `doc.nid`, `doc.bg` (Hintergrundbild), `saved`, Objekt-`id`s. Wenn sie doch vorkommen, werden `id`/`nid` neu vergeben und ein ungültiges `bg` wird ignoriert.\n\n---\n\n## 3. Ebenen (`layers`)\n\n```json\n{\"name\":\"Kontur\",\"color\":\"auto\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.5}\n```\n\n| Feld | Werte | Standard / Verhalten bei ungültigem Wert |\n|---|---|---|\n| `name` | Text, 1–40 Zeichen, eindeutig | Pflicht. Doppelte Namen und leere Namen werden übersprungen. |\n| `color` | `auto`, `red`, `yellow`, `green`, `cyan`, `blue`, `magenta`, `orange`, `gray` | sonst `auto` (`auto` = hell auf dunklem, schwarz auf hellem Hintergrund und im PDF schwarz) |\n| `vis` | `true` / `false` | sichtbar; Standard `true` |\n| `lock` | `true` / `false` | gesperrt (nicht bearbeitbar); Standard `false` |\n| `lt` | `solid`, `dashed`, `center`, `dotted`, `hidden` | sonst `solid` (durchgezogen, gestrichelt, Strich-Punkt-Mittellinie, gepunktet, verdeckt) |\n| `lw` | Strichstärke in **mm**, Zahl 0 bis 5 | sonst `0.25`. Übliche Werte: 0.05, 0.09, 0.13, 0.18, 0.25, 0.35, 0.5, 0.7, 1, 1.4, 2 |\n\nRegeln:\n\n- Die Ebene `\"0\"` gibt es immer. Du kannst sie in `layers` aufführen, um ihre Eigenschaften zu ändern.\n- Objekte verweisen über `layer` mit dem **exakten Namen** (Groß-/Kleinschreibung) auf eine Ebene. Unbekannter Name → Objekt landet auf `\"0\"`.\n- Sinnvolle Aufteilung: z. B. `Kontur`, `Mittellinien`, `Masse`, `Text`, `Schraffur`, `Hilfslinien`.\n\n---\n\n## 4. Gemeinsame Felder aller Objekte\n\nJedes Element von `ents` ist ein Objekt mit:\n\n| Feld | Pflicht | Bedeutung |\n|---|---|---|\n| `type` | **ja** | Objekttyp (Abschnitt 5) |\n| `layer` | empfohlen | Ebenenname; fehlt er oder ist unbekannt → `\"0\"` |\n| `color` | nein | überschreibt die Ebenenfarbe (gleiche Werte wie bei Ebenen). Hex-Farben (`#ff0000`) sind **nicht** erlaubt und werden entfernt. |\n| `lw` | nein | überschreibt die Ebenen-Strichstärke (mm, 0–5) |\n| `id` | nein | wird ignoriert und neu vergeben |\n\nEin Objekt mit fehlenden oder ungültigen Pflichtfeldern wird beim Laden **übersprungen** (Helix meldet „n ungültige übersprungen“).\n\n---\n\n## 5. Objekttypen\n\nAlle Beispiele sind gültig und können direkt in `ents` übernommen werden.\n\n### 5.1 `line` – Linie\nPflicht: `a`, `b` (Punkte).\n```json\n{\"type\":\"line\",\"layer\":\"Kontur\",\"a\":[0,0],\"b\":[100,50]}\n```\n\n### 5.2 `pline` – Polylinie (auch Rechteck und Polygon)\nPflicht: `pts` (mindestens 2 Punkte). Optional: `closed` (`true` = letzter Punkt wird mit dem ersten verbunden).\n**Rechteck, Polygon, Dreieck usw. gibt es nicht als eigenen Typ**: nimm eine geschlossene `pline`. Bögen innerhalb einer Polylinie sind nicht möglich (nimm `arc`-Objekte).\n```json\n{\"type\":\"pline\",\"layer\":\"Kontur\",\"pts\":[[0,0],[120,0],[120,70],[0,70]],\"closed\":true}\n```\n\n### 5.3 `circle` – Kreis\nPflicht: `c` (Mittelpunkt), `r` (Radius > 0).\n```json\n{\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[60,35],\"r\":15}\n```\n\n### 5.4 `arc` – Kreisbogen\nPflicht: `c`, `r` (> 0), `a0` (Startwinkel), `a1` (Endwinkel), beide in **Radiant**. Der Bogen läuft von `a0` **gegen den Uhrzeigersinn** nach `a1` (Spannweite = (a1 − a0) modulo 2π). Ein Viertelkreis oben rechts: a0 = 0, a1 = 1.570796. Für einen Vollkreis nimm `circle`.\n```json\n{\"type\":\"arc\",\"layer\":\"Kontur\",\"c\":[0,0],\"r\":20,\"a0\":0,\"a1\":1.570796}\n```\n\n### 5.5 `ellipse` – Ellipse\nPflicht: `c`, `rx`, `ry` (beide > 0), `rot` (Drehwinkel der rx-Achse, Radiant; 0 = rx liegt waagerecht).\n```json\n{\"type\":\"ellipse\",\"layer\":\"Kontur\",\"c\":[0,0],\"rx\":30,\"ry\":15,\"rot\":0}\n```\n\n### 5.6 `point` – Punkt\nPflicht: `p`. Wird als kleines Kreuz dargestellt.\n```json\n{\"type\":\"point\",\"layer\":\"Hilfslinien\",\"p\":[10,10]}\n```\n\n### 5.7 `text` – Text\nPflicht: `p`, `text` (Zeichenkette), `h` (Texthöhe > 0). Optional: `rot` (Radiant, Standard 0).\n\n- `p` ist der **Startpunkt der Grundlinie** der ersten Zeile (linksbündig). Eine Ausrichtung (zentriert, rechtsbündig) gibt es nicht; verschiebe `p` entsprechend.\n- Zeilenumbruch mit `\\n` im Text. Weitere Zeilen stehen **unterhalb**, Zeilenabstand = 1.25 × `h`.\n- Breite des Texts ≈ 0.6 × `h` × Anzahl der Zeichen (Faustformel zur Platzplanung; ob ein Text in ein Feld passt, vorher damit prüfen).\n```json\n{\"type\":\"text\",\"layer\":\"Text\",\"p\":[60,176],\"text\":\"Lagerplatte Pos. 1\\nWerkstoff S235JR\",\"h\":3.5,\"rot\":0}\n```\n\n### 5.8 `dim` – Maßlinie (Längenmaß)\nPflicht: `a`, `b` (die zwei **gemessenen** Punkte), `p` (ein Punkt, durch den die **Maßlinie** verläuft). Optional: `mode`: `\"al\"` (ausgerichtet, parallel zu a–b; Standard), `\"h\"` (waagerecht gemessen), `\"v\"` (senkrecht gemessen); `th` (Texthöhe, Standard `doc.th`).\n\n- Der Maßtext wird **automatisch** aus der gemessenen Länge in Zeichnungseinheiten gebildet (`doc.dec` Nachkommastellen, ohne Einheit). Er lässt sich nicht von Hand setzen.\n- `mode:\"h\"`: Maßlinie liegt auf der Höhe `p[1]`; `mode:\"v\"`: Maßlinie liegt bei `p[0]`; `\"al\"`: Maßlinie parallel zu a–b durch `p`.\n- Maßhilfslinien und Pfeile entstehen automatisch. Pfeilgröße = 0.9 × `th`.\n```json\n{\"type\":\"dim\",\"layer\":\"Masse\",\"mode\":\"h\",\"a\":[0,0],\"b\":[120,0],\"p\":[60,-14],\"th\":3.5}\n```\n\n### 5.9 `rdim` – Radius-/Durchmessermaß\nPflicht: `c` (Kreismittelpunkt), `r` (Radius), `p` (Endpunkt der Maßlinie, dort steht der Text). Optional: `kind`: `\"R\"` (Text „R15“, Standard) oder `\"D\"` (Text „Ø30“); `th`.\nDie Maßlinie läuft vom Kreisrand in Richtung `p` (vom Mittelpunkt aus gesehen). Wähle `p` außerhalb (oder innerhalb) des Kreises auf der gewünschten Seite.\n```json\n{\"type\":\"rdim\",\"layer\":\"Masse\",\"c\":[60,35],\"r\":15,\"p\":[82,53],\"kind\":\"D\",\"th\":3.5}\n```\n\n### 5.10 `adim` – Winkelmaß\nPflicht: `c` (Scheitelpunkt), `a` (ein Punkt auf dem ersten Schenkel), `b` (ein Punkt auf dem zweiten Schenkel), `p` (Punkt auf dem Maßbogen). Optional: `th`.\n`dist(c, p)` ist der Radius des Maßbogens; die **Seite** des Winkels (spitz oder überstumpf) ergibt sich daraus, in welchem der beiden Winkelfelder die Richtung c→p liegt. Der Text („90°“) entsteht automatisch.\n```json\n{\"type\":\"adim\",\"layer\":\"Masse\",\"c\":[0,0],\"a\":[40,0],\"b\":[0,40],\"p\":[22,22],\"th\":3.5}\n```\n\n### 5.11 `leader` – Hinweislinie mit Text\nPflicht: `pts` (mindestens 2 Punkte), `text`, `h` (> 0).\n`pts[0]` ist die **Pfeilspitze** (zeigt auf das Objekt), die weiteren Punkte sind Knickpunkte, der **letzte** Punkt ist das Ende der Linie. Dort schließt eine waagerechte Anschlusslinie (0.7 × `h` lang) an, danach folgt der Text; er steht rechts, wenn das letzte Segment nach rechts läuft (`x` des letzten Punkts ≥ `x` des vorletzten), sonst links. Mehrzeilig mit `\\n`.\n```json\n{\"type\":\"leader\",\"layer\":\"Text\",\"pts\":[[171,151],[178,168],[186,168]],\"text\":\"4× Bohrung Ø8\",\"h\":3.5}\n```\n\n### 5.12 `spline` – Spline (glatte Kurve durch Stützpunkte)\nPflicht: `pts` (mindestens 2 Stützpunkte; die Kurve verläuft **durch** alle). Optional: `closed` (`true` = geschlossene Kurve, braucht mindestens 3 Punkte).\n```json\n{\"type\":\"spline\",\"layer\":\"Kontur\",\"pts\":[[0,0],[20,15],[45,5],[70,25]],\"closed\":false}\n```\n\n### 5.13 `hatch` – Schraffur / Füllung\nPflicht: `pts` (mindestens 3 Punkte; das Polygon wird **automatisch geschlossen**). Optional: `pattern`: `\"lines\"` (Linien, Standard), `\"cross\"` (Kreuzschraffur), `\"solid\"` (Vollfläche, halbtransparent); `spacing` (Linienabstand in Zeichnungseinheiten, > 0, Standard 5); `angle` (Winkel der Linien, **Radiant**, Standard 0; 45° = 0.785398).\n\n- Die Schraffur zeichnet **keinen Rand**. Zeichne die Kontur zusätzlich als geschlossene `pline`.\n- Schraffuren mit Löchern/Inseln gibt es nicht: die Fläche ist ein einfaches Polygon.\n```json\n{\"type\":\"hatch\",\"layer\":\"Schraffur\",\"pts\":[[0,0],[20,0],[20,70],[0,70]],\"pattern\":\"lines\",\"spacing\":3,\"angle\":0.785398}\n```\n\n### 5.14 `xline` – Konstruktionslinie (unendliche Hilfslinie)\nPflicht: `p` (ein Punkt auf der Linie), `ang` (Richtung, Radiant; 0 = waagerecht, 1.570796 = senkrecht).\nWird **nicht gedruckt und nicht exportiert** (weder PDF noch SVG, PNG, DXF). Nur auf Wunsch des Nutzers verwenden.\n```json\n{\"type\":\"xline\",\"layer\":\"Hilfslinien\",\"p\":[0,0],\"ang\":0}\n```\n\n### Nicht unterstützt\nBlöcke/Einfügungen, Schraffuren mit Löchern, Bögen in Polylinien, Bemaßungsstile, Pfeilarten, Schriftarten und Textausrichtungen, Layouts/Ansichtsfenster, Hex-/RGB-Farben, Volltext-Formatierung. Bilder gibt es nur als Hintergrundbild, das die KI **nicht** erzeugen soll.\n\n---\n\n## 6. Zeichnungsrahmen mit Schriftfeld (`frames`)\n\nStatt Rahmen und Schriftfeld selbst aus Linien und Texten zu bauen, beschreibst du sie in `doc.frames`. Helix erzeugt daraus beim Laden den fertigen Rahmen (auf der Ebene `Rahmen`, wird bei Bedarf angelegt) – inklusive Blattkante, Rahmenlinie und Schriftfeld, das der Nutzer später im Programm ausfüllen kann. Nach dem Laden sind es normale Objekte; gespeichert wird kein `frames`-Feld mehr.\n\n```json\n\"frames\": [\n {\"size\":\"A3\",\"orient\":\"landscape\",\"scale\":50,\"unit\":\"mm\",\"binding\":true,\"origin\":[0,0],\n  \"fields\":{\"titel\":\"Neutralisationsanlage\",\"nr\":\"DL-0815\",\"projekt\":\"Werk Dietlikon\",\"firma\":\"Muster AG\",\"gez\":\"A. Muster\",\"gepr\":\"\",\"datum\":\"03.10.2026\",\"blatt\":\"1/1\",\"rev\":\"A\"}}\n]\n```\n\n| Feld | Werte | Standard |\n|---|---|---|\n| `size` | `A0`, `A1`, `A2`, `A3`, `A4`, `A5`, `Letter` | `A3` |\n| `orient` | `landscape` (quer), `portrait` (hoch) | `landscape` |\n| `scale` | Maßstabszahl N für 1 : N (Zahl > 0). Beispiel 50 = 1:50, 1 = 1:1, 0.5 = 2:1 | 50 |\n| `unit` | Bedeutung **einer Zeichnungseinheit**: `\"mm\"`, `\"cm\"` oder `\"m\"` | `\"mm\"` |\n| `binding` | `true` = Heftrand links 20 mm, `false` = überall 10 mm | `true` |\n| `origin` | `[x, y]` der **unteren linken Blattecke** in Zeichnungseinheiten | `[0, 0]` |\n| `fields` | Schriftfeld-Texte (alle optional, nur Text): `titel`, `nr` (Zeichnungs-Nr.), `projekt`, `firma`, `gez` (Gezeichnet), `gepr` (Geprüft), `datum`, `mass` (Maßstabstext; leer = automatisch „1:N“), `blatt`, `rev` (Revision) | leer |\n\nMehrere Einträge in `frames` ergeben mehrere Blätter. Wähle verschiedene `origin`-Werte, sodass sie sich nicht überlappen (Abstand größer als die Blattbreite).\n\n### Geometrie des Blatts (damit der Inhalt hineinpasst)\n\nPapiermaße in mm (Breite × Höhe bei **Querformat**; bei Hochformat vertauschen): A0 1189×841, A1 841×594, A2 594×420, A3 420×297, A4 297×210, A5 210×148, Letter 279.4×215.9.\n\n- **Umrechnungsfaktor** `wu` = Zeichnungseinheiten pro Papier-Millimeter = `scale ÷ f`, mit f = 1 (mm), 10 (cm), 1000 (m).\n  Beispiele: mm und 1:50 → wu = 50. m und 1:50 → wu = 0.05. mm und 1:1 → wu = 1.\n- Blattgröße in Zeichnungseinheiten: Blattbreite_mm × wu und Blatthöhe_mm × wu (ab `origin`).\n- Seitenrand `m` = min(10, Blattbreite_mm / 20) mm; linker Rand `mL` = max(20, m) mm bei `binding:true`, sonst `m`.\n- **Innerer Rahmen** (Zeichenfläche): x von `origin.x + mL·wu` bis `origin.x + (Blattbreite − m)·wu`, y von `origin.y + m·wu` bis `origin.y + (Blatthöhe − m)·wu`.\n- **Schriftfeld**: unten rechts im inneren Rahmen, **180 mm breit × 36 mm hoch** (bei sehr schmalem Blatt schmaler). Die Zeichnung darf diesen Bereich nicht überdecken: x ≥ `origin.x + (Blattbreite − m − 180)·wu` **und** y ≤ `origin.y + (m + 36)·wu` ist reserviert.\n- Platziere den Zeichnungsinhalt innerhalb des inneren Rahmens, oberhalb des Schriftfelds, mit etwas Abstand (ca. 10 mm Papier).\n\nBeispiel A4 quer, 1:1, mm, origin [0,0]: Blatt 297×210; innerer Rahmen x 20…287, y 10…200; Schriftfeld x 107…287, y 10…46; freie Fläche für die Zeichnung z. B. x 30…277, y 56…190.\n\n### Auswahl des Maßstabs\nRechne die Zeichnungsgröße (Breite, Höhe in Zeichnungseinheiten) in Papier-mm um (`Größe ÷ wu`) und wähle den **größten** gebräuchlichen Maßstab (1:1, 1:2, 1:5, 1:10, 1:20, 1:25, 1:50, 1:100, 1:200, 1:500, 1:1000), bei dem alles in die freie Fläche passt. Nenne dem Nutzer Papierformat und Maßstab.\n\n### PDF-Ausgabe\nIm Programm: Datei ▸ „Export PDF“ ▸ **Bereich: Zeichnungsrahmen**. Dann gelten Blattgröße und Maßstab des Rahmens exakt, es wird kein zweites Schriftfeld gedruckt.\n\n---\n\n## 7. Schriftgrößen, Strichstärken und Ebenen sinnvoll wählen\n\n**Texthöhen sind Zeichnungseinheiten, keine Papiermillimeter.** Die gewünschte Höhe auf Papier muss mit `wu` (Abschnitt 6) in Zeichnungseinheiten umgerechnet werden:\n\n`h = Papierhöhe_mm × wu`\n\nÜbliche Papierhöhen: Beschriftung 3.5 mm (Titel 5 mm), Maßzahlen 2.5–3.5 mm. Beispiel mm und 1:50: 3.5 mm Papier → `h` = 175. Setze `doc.th` und alle `th`/`h`-Werte der Bemaßung entsprechend (Pfeile sind 0.9 × `th`, Maßhilfslinien-Abstand 0.3 × `th`).\nOhne Zeichnungsrahmen: wähle `th` ca. 1/50 bis 1/70 der größeren Zeichnungsausdehnung (Zeichnung 120 breit → `th` ≈ 2–3).\n\nEmpfohlene Strichstärken (mm): Konturen/sichtbare Kanten 0.5, Schnittlinien/Hauptlinien 0.7, Maße, Mittellinien, Hilfslinien 0.18, Schraffuren 0.13, Text 0.25. Mittellinien: `lt:\"center\"`, verdeckte Kanten: `lt:\"hidden\"`.\n\n---\n\n## 8. Hinweise zur Qualität\n\n- Maße bei Maßlinien sind **gemessen**, nicht eingegeben: `a`/`b` müssen exakt auf den Kanten liegen, sonst stimmt die Zahl nicht.\n- Schließe Konturen exakt (gleiche Koordinaten an Berührpunkten), lege keine Objekte doppelt übereinander.\n- Rechne symmetrische Anordnungen (Lochkreise, Raster) mit den Formeln x = cx + r·cos θ, y = cy + r·sin θ **selbst aus** und trage die Zahlen ein.\n- Beschriftungen nicht über Linien legen: Text oberhalb/neben dem Objekt platzieren, Breite mit der Faustformel (0.6 × `h` × Zeichenzahl) prüfen.\n- Verwende pro Zweck eine eigene Ebene, damit der Nutzer Teile ein-/ausblenden kann.\n\n---\n\n## 9. Checkliste vor der Ausgabe\n\n- [ ] Gültiges JSON (Klammern, Kommas, keine Kommentare, keine Kommas am Ende)\n- [ ] `doc.ents` ist ein Array; jedes Objekt hat `type` und alle Pflichtfelder seines Typs\n- [ ] Alle Winkel (`a0`, `a1`, `rot`, `ang`, `angle`) in Radiant\n- [ ] `y` nach oben gedacht; Kreise/Radien > 0\n- [ ] Jede verwendete `layer`-Angabe existiert in `layers` (Schreibweise identisch)\n- [ ] Farben nur aus der Liste, Linienarten nur aus der Liste, keine Hex-Farben\n- [ ] Texthöhen passend zum Maßstab (Abschnitt 7); nichts liegt im Schriftfeld-Bereich\n- [ ] Bei `frames`: Größe, Maßstab, Einheit, `origin` gesetzt; Inhalt liegt im inneren Rahmen\n- [ ] Alle Objekte einzeln ausgeschrieben (keine Platzhalter wie `...` im Endergebnis)\n\n---\n\n## 10. Vollständiges, geprüftes Beispiel\n\nLagerplatte 120 × 70 mm mit Bohrungen, Mittellinien, Maßen, Hinweislinie, Schnittdarstellung mit Schraffur, auf A4 quer im Maßstab 1:1 mit Schriftfeld (lädt ohne übersprungene Objekte):\n\n```json\n{\n \"format\": \"helix-web-cad\",\n \"version\": 1,\n \"doc\": {\n  \"name\": \"Lagerplatte\",\n  \"cur\": \"Kontur\",\n  \"grid\": 5,\n  \"th\": 3.5,\n  \"dec\": 2,\n  \"layers\": [\n   {\"name\":\"0\",\"color\":\"auto\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.25},\n   {\"name\":\"Kontur\",\"color\":\"auto\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.5},\n   {\"name\":\"Mittellinien\",\"color\":\"red\",\"vis\":true,\"lock\":false,\"lt\":\"center\",\"lw\":0.18},\n   {\"name\":\"Masse\",\"color\":\"green\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.18},\n   {\"name\":\"Text\",\"color\":\"auto\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.25},\n   {\"name\":\"Schraffur\",\"color\":\"gray\",\"vis\":true,\"lock\":false,\"lt\":\"solid\",\"lw\":0.13}\n  ],\n  \"ents\": [\n   {\"type\":\"pline\",\"layer\":\"Kontur\",\"pts\":[[60,90],[180,90],[180,160],[60,160]],\"closed\":true},\n   {\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[120,125],\"r\":15},\n   {\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[72,102],\"r\":4},\n   {\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[168,102],\"r\":4},\n   {\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[72,148],\"r\":4},\n   {\"type\":\"circle\",\"layer\":\"Kontur\",\"c\":[168,148],\"r\":4},\n   {\"type\":\"line\",\"layer\":\"Mittellinien\",\"a\":[120,80],\"b\":[120,170]},\n   {\"type\":\"line\",\"layer\":\"Mittellinien\",\"a\":[50,125],\"b\":[190,125]},\n   {\"type\":\"dim\",\"layer\":\"Masse\",\"mode\":\"h\",\"a\":[60,90],\"b\":[180,90],\"p\":[120,76],\"th\":3.5},\n   {\"type\":\"dim\",\"layer\":\"Masse\",\"mode\":\"v\",\"a\":[180,90],\"b\":[180,160],\"p\":[194,125],\"th\":3.5},\n   {\"type\":\"rdim\",\"layer\":\"Masse\",\"c\":[120,125],\"r\":15,\"p\":[142,143],\"kind\":\"D\",\"th\":3.5},\n   {\"type\":\"leader\",\"layer\":\"Text\",\"pts\":[[171,151],[178,168],[186,168]],\"text\":\"4× Bohrung Ø8\",\"h\":3.5},\n   {\"type\":\"text\",\"layer\":\"Text\",\"p\":[60,176],\"text\":\"Lagerplatte Pos. 1\\nWerkstoff S235JR\",\"h\":3.5,\"rot\":0},\n   {\"type\":\"pline\",\"layer\":\"Kontur\",\"pts\":[[232,90],[252,90],[252,160],[232,160]],\"closed\":true},\n   {\"type\":\"hatch\",\"layer\":\"Schraffur\",\"pts\":[[232,90],[252,90],[252,160],[232,160]],\"pattern\":\"lines\",\"spacing\":3,\"angle\":0.785398},\n   {\"type\":\"text\",\"layer\":\"Text\",\"p\":[226,166],\"text\":\"Schnitt A–A\",\"h\":3.5,\"rot\":0}\n  ],\n  \"frames\": [\n   {\"size\":\"A4\",\"orient\":\"landscape\",\"scale\":1,\"unit\":\"mm\",\"binding\":true,\"origin\":[0,0],\"fields\":{\"titel\":\"Lagerplatte\",\"nr\":\"LP-001\",\"projekt\":\"Beispielprojekt\",\"firma\":\"Muster AG\",\"gez\":\"A. Muster\",\"gepr\":\"\",\"datum\":\"03.10.2026\",\"blatt\":\"1/1\",\"rev\":\"A\"}}\n  ]\n }\n}\n```\n\n---\n\n## 11. Beispiel-Prompt für den Nutzer\n\n> Hier ist die Anleitung für das JSON-Format von Helix Web-CAD (Datei im Anhang). Erstelle damit eine vollständige Zeichnung als JSON: **[Beschreibung, z. B. „Fließschema einer Neutralisationsanlage mit Behälter, Pumpe und Rohrleitungen“]**. Papierformat A3 quer, Maßstab nach Bedarf, Zeichnungseinheit mm. Schriftfeld: Titel „…“, Projekt „…“, Firma „…“, Gezeichnet „…“. Gib nur das JSON aus.\n\nDie Antwort als Datei mit der Endung `.json` speichern und in Helix öffnen (Datei ▸ „Öffnen …“) – oder den Text direkt über Datei ▸ „JSON einfügen“ laden. Hinweise zu Codeblöcken (```` ```json ````) oder einleitenden Sätzen im eingefügten Text sind unproblematisch: Helix sucht das JSON-Objekt darin selbst.\n\n---\n\n## 12. Was Helix beim Laden macht (Fehlerverhalten)\n\n| Fall | Verhalten |\n|---|---|\n| Ungültiges JSON | Fehlermeldung mit Hinweis zur Stelle; nichts wird geladen |\n| `doc.ents` fehlt oder kein Array | Fehlermeldung „Datei enthält keine Zeichnung“ |\n| Objekt mit unbekanntem `type` oder fehlenden/ungültigen Pflichtfeldern | wird übersprungen; Meldung „n ungültige übersprungen“ |\n| Unbekannte `layer` | Objekt kommt auf Ebene `\"0\"` |\n| Ungültige `color` / `lw` am Objekt | Eigenschaft wird entfernt (Ebenenwerte gelten) |\n| Ungültige Ebenen-Werte | `color` → `auto`, `lt` → `solid`, `lw` → 0.25 |\n| `doc.cur` unbekannt | `\"0\"` |\n| Ungültiger Eintrag in `frames` (z. B. Blatt zu klein) | wird übersprungen |\n| Zusätzliche, unbekannte Felder | werden meist mitgeführt, haben aber keine Wirkung |\n\n---\n\n## 13. Kurzreferenz der Pflichtfelder\n\n| `type` | Pflichtfelder | wichtige optionale Felder |\n|---|---|---|\n| `line` | `a`, `b` | |\n| `pline` | `pts` (≥ 2) | `closed` |\n| `circle` | `c`, `r` | |\n| `arc` | `c`, `r`, `a0`, `a1` | |\n| `ellipse` | `c`, `rx`, `ry`, `rot` | |\n| `point` | `p` | |\n| `text` | `p`, `text`, `h` | `rot` |\n| `dim` | `a`, `b`, `p` | `mode` (`al`/`h`/`v`), `th` |\n| `rdim` | `c`, `r`, `p` | `kind` (`R`/`D`), `th` |\n| `adim` | `c`, `a`, `b`, `p` | `th` |\n| `leader` | `pts` (≥ 2), `text`, `h` | |\n| `spline` | `pts` (≥ 2) | `closed` |\n| `hatch` | `pts` (≥ 3) | `pattern` (`lines`/`cross`/`solid`), `spacing`, `angle` |\n| `xline` | `p`, `ang` | |\n\nAlle Typen zusätzlich: `layer`, `color`, `lw`.\n\n*Stand: Helix Web-CAD, Dateiformat `helix-web-cad` Version 1.*\n";

const TIP=h('div',{id:'tip',role:'tooltip'});
let tipT=0,tipHide=0;
function hideTip(){clearTimeout(tipT);clearTimeout(tipHide);TIP.classList.remove('show')}
function showTip(btn){
  const i=TOOLINFO[btn.dataset.id];if(!i)return;
  TIP.textContent='';TIP.append(h('b',null,i[0],i[1]?h('kbd',null,i[1]):null),i[2]);
  TIP.style.left='0px';TIP.style.top='0px';TIP.classList.add('show');
  const r=btn.getBoundingClientRect(),w=TIP.offsetWidth,th=TIP.offsetHeight;
  let top=r.bottom+8;if(top+th>innerHeight-6)top=Math.max(6,r.top-th-8);
  TIP.style.left=Math.round(clamp(r.left+r.width/2-w/2,6,Math.max(6,innerWidth-w-6)))+'px';TIP.style.top=Math.round(top)+'px';
}
function buildDock(){
  const bar=$('#tools');bar.textContent='';document.body.append(TIP);
  for(const[label,ids]of TGROUPS){
    const row=h('div',{class:'tgi'});
    for(const id of ids){
      const i=TOOLINFO[id],b=h('button',{class:'tbtn','data-id':id,type:'button','aria-label':i[0]+(i[1]?` (${i[1]})`:''),'aria-pressed':'false'});
      b.innerHTML=ICON[id];
      let lp=false,lpT=0;
      b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){clearTimeout(tipT);tipT=setTimeout(()=>showTip(b),380)}});
      b.addEventListener('pointerleave',()=>{hideTip();clearTimeout(lpT)});
      b.addEventListener('pointerdown',e=>{hideTip();lp=false;if(e.pointerType!=='mouse'){clearTimeout(lpT);lpT=setTimeout(()=>{lp=true;showTip(b);tipHide=setTimeout(hideTip,3200)},480)}});
      for(const ev of['pointerup','pointercancel'])b.addEventListener(ev,()=>clearTimeout(lpT));
      b.addEventListener('focus',()=>{if(b.matches(':focus-visible'))showTip(b)});
      b.addEventListener('blur',hideTip);
      b.addEventListener('click',()=>{if(lp){lp=false;return}hideTip();act(id);b.blur()});
      row.append(b);
    }
    bar.append(h('div',{class:'tg'},row,h('div',{class:'tgl'},label)));
  }
  bar.addEventListener('scroll',hideTip,{passive:true});
  bar.addEventListener('contextmenu',e=>e.preventDefault());
  updDock();
}
function updDock(){
  document.querySelectorAll('#tools .tbtn').forEach(b=>{
    const id=b.dataset.id,tid=id==='symbol'?'symput':id,on=id==='select'?!tool:(!!tool&&tool.id===tid);
    b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');
  });
}

/* ================= Tastatur & Verdrahtung ================= */
const cin=$('#cin');
window.addEventListener('keydown',e=>{if(e.key==='Shift'&&!shiftDown){shiftDown=true;updateCursor(cs[0],cs[1])}},true);
window.addEventListener('keyup',e=>{if(e.key==='Shift'&&shiftDown){shiftDown=false;updateCursor(cs[0],cs[1])}},true);
window.addEventListener('blur',()=>{if(shiftDown){shiftDown=false;updateCursor(cs[0],cs[1])}});
function sendInput(){const v=cin.value;cin.value='';submitInput(v)}
cin.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();sendInput()}
  else if(e.key==='Escape'){e.preventDefault();cin.value='';esc()}
  else if(e.key===' '&&!cin.value){e.preventDefault();submitInput('')}
  else if(!cin.value&&(e.ctrlKey||e.metaKey||e.key==='Delete'||/^F\d+$/.test(e.key)))return;
  e.stopPropagation();
});
document.addEventListener('keydown',e=>{
  if(modalOpen()){if(e.key==='Escape'){e.preventDefault();closeModal()}return}
  const t=e.target,tn=t&&t.tagName;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(t===cin){if(cin.value||!(ctrl||k==='Delete'||/^F\d+$/.test(k)))return}
  else if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'){if(k==='Escape')t.blur();return}
  if(ctrl){
    const l=k.toLowerCase();
    if(l==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(l==='y'){e.preventDefault();redo();return}
    if(l==='a'){e.preventDefault();selectAll();return}
    if(l==='c'){e.preventDefault();clipCopy();return}
    if(l==='v'){e.preventDefault();act('paste');return}
    if(l==='s'){e.preventDefault();saveJSON();return}
    if(l==='o'){e.preventDefault();$('#fin').click();return}
    return;
  }
  if(k==='F3'){e.preventDefault();prefs.osnap=!prefs.osnap;savePrefs();updChips();redraw();return}
  if(k==='F7'){e.preventDefault();prefs.grid=!prefs.grid;savePrefs();updChips();redraw();return}
  if(k==='F8'){e.preventDefault();prefs.ortho=!prefs.ortho;savePrefs();updChips();redraw();return}
  if(k==='F9'){e.preventDefault();prefs.gsnap=!prefs.gsnap;savePrefs();updChips();redraw();return}
  if(k==='Escape'){e.preventDefault();cin.value='';esc();return}
  if(k==='Delete'||k==='Backspace'){if(!tool&&sel.size){e.preventDefault();delEnts([...sel]);afterDoc()}return}
  if(k==='Enter'){e.preventDefault();submitInput('');return}
  if(k===' '){e.preventDefault();submitInput('');return}
  if(k.length===1&&!e.altKey){cin.focus()}
});
$('#bOk').onclick=()=>sendInput();
$('#bEsc').onclick=()=>{cin.value='';esc()};

$('#fimg').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';loadBgFile(f)});
$('#fin').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';readFile(f)});
for(const ev of['dragover','dragenter'])document.addEventListener(ev,e=>{if(e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();readFile(e.dataTransfer.files[0])}});
window.addEventListener('beforeunload',()=>{try{autosave()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{autosave()}catch(e){}});
if('ResizeObserver'in window)new ResizeObserver(()=>resize()).observe(stage);else window.addEventListener('resize',resize);

/* ================= Start ================= */
(function init(){
  loadPrefs();applyTheme();buildChips();buildDock();
  coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  resize();
  let restored=false;
  const auto=store.get('helix:auto');
  if(auto){try{const r=loadFromText(auto,{silent:true});restored=r.count>0}catch(e){}}
  $('#pname').value=doc.name;
  updUndoBtns();updPrompt();
  if(innerWidth>=900)openSide(true);
  zoomExt();redraw();
  if(restored)toast('Letzte Sitzung wiederhergestellt',2800);
  else if(storageWorks()&&!store.get('helix:seen')){store.set('helix:seen','1');setTimeout(helpDialog,350)}
})();
})();
</script>
